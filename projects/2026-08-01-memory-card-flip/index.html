<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Memory Card Flip Game</title><style>body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; margin: 0; } .container { display: grid; grid-template-columns: repeat(4, 100px); grid-gap: 10px; } .card { width: 100px; height: 100px; background-color: #3498db; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; cursor: pointer; border-radius: 5px; } .matched { background-color: #2ecc71; pointer-events: none; } .hidden { background-color: #34495e; } h1 { text-align: center; } </style></head><body><div><h1>Memory Card Flip Game</h1><div class='container' id='card-container'></div><h2 id='score'>Score: 0</h2><button id='restart'>Restart</button></div><script>const cardContainer = document.getElementById('card-container'); const scoreDisplay = document.getElementById('score'); const restartButton = document.getElementById('restart'); const cards = []; const cardValues = [1, 2, 3, 4, 1, 2, 3, 4]; let firstCard = null; let secondCard = null; let score = 0; let matchedPairs = 0; let lockBoard = false; for (let value of cardValues) { const card = document.createElement('div'); card.classList.add('card', 'hidden'); card.setAttribute('data-value', value); cards.push(card); } cards.sort(() => 0.5 - Math.random()); cards.forEach(card => { card.addEventListener('click', flipCard); cardContainer.appendChild(card); }); function flipCard() { if (lockBoard || this.classList.contains('matched')) return; this.classList.remove('hidden'); this.textContent = this.getAttribute('data-value'); if (!firstCard) { firstCard = this; return; } secondCard = this; lockBoard = true; checkForMatch(); } function checkForMatch() { if (firstCard.textContent === secondCard.textContent) { lockBoard = false; firstCard.classList.add('matched'); secondCard.classList.add('matched'); score++; matchedPairs++; scoreDisplay.textContent = 'Score: ' + score; if (matchedPairs === cardValues.length / 2) { alert('You Won! Final Score: ' + score); } } else { setTimeout(() => { firstCard.classList.add('hidden'); secondCard.classList.add('hidden'); firstCard.textContent = ''; secondCard.textContent = ''; lockBoard = false; }, 1000); } firstCard = null; secondCard = null; } restartButton.addEventListener('click', () => { cards.forEach(card => { card.classList.add('hidden'); card.textContent = ''; }); score = 0; matchedPairs = 0; scoreDisplay.textContent = 'Score: ' + score; firstCard = null; secondCard = null; cards.sort(() => 0.5 - Math.random()); }); </script></body></html>
