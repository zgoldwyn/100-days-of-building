<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Skyward Rocket Challenge</title><style>body { font-family: Arial, sans-serif; margin: 0; overflow: hidden; background: linear-gradient(to top, #87ceeb, #ffffff); } #gameContainer { position: relative; width: 100vw; height: 100vh; overflow: hidden; } #rocket { position: absolute; width: 50px; height: 100px; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMMAAAABCAIAAADwJ1W6AAAAWElEQVRIDbXBAQEAAABkQMs4VbCrH5p7u92hIZkmgDT6CQXiJmtmXIZmgDC6G3HJcy5mqXZpYgFqmB1Q0WTN2AAAAABJRU5ErkJggg==') no-repeat center; background-size: contain; transform: translate(-50%, 100%); } .star { position: absolute; width: 20px; height: 20px; background: yellow; clip-path: polygon(50% 0%, 63% 35%, 100% 35%, 73% 57%, 81% 91%, 50% 70%, 19% 91%, 27% 57%, 0% 35%, 37% 35%); } .cloud { position: absolute; width: 80px; height: 50px; background: white; border-radius: 50%; opacity: 0.8; } #scoreboard { position: absolute; top: 20px; left: 20px; font-size: 24px; color: #333; }</style></head><body><div id='gameContainer'><div id='rocket'></div></div><div id='scoreboard'>Score: 0</div><script>let score = 0; let rocket = document.getElementById('rocket'); let gameContainer = document.getElementById('gameContainer'); let scoreboard = document.getElementById('scoreboard'); let fallingStars = []; let fallingClouds = []; let gravity = 0.5; let rocketSpeed = 5; let gameInterval; let starInterval; let cloudInterval; function startGame() { gameInterval = setInterval(updateGameArea, 20); starInterval = setInterval(createStar, 1000); cloudInterval = setInterval(createCloud, 2000); window.addEventListener('keydown', moveRocket); } function updateGameArea() { rocket.style.transform = 'translate(-50%, ' + (rocket.offsetTop - gravity) + 'px)'; fallingStars.forEach((star, index) => { star.style.top = star.offsetTop + 5 + 'px'; if (star.offsetTop > window.innerHeight) { star.remove(); fallingStars.splice(index, 1); } if (rocket.offsetTop < star.offsetTop + 20 && rocket.offsetTop + 100 > star.offsetTop && rocket.offsetLeft < star.offsetLeft + 20 && rocket.offsetLeft + 50 > star.offsetLeft) { star.remove(); score++; fallingStars.splice(index, 1); scoreboard.innerText = 'Score: ' + score; } }); fallingClouds.forEach((cloud, index) => { cloud.style.top = cloud.offsetTop + 3 + 'px'; if (cloud.offsetTop > window.innerHeight) { cloud.remove(); fallingClouds.splice(index, 1); } if (rocket.offsetTop < cloud.offsetTop + 50 && rocket.offsetTop + 100 > cloud.offsetTop && rocket.offsetLeft < cloud.offsetLeft + 80 && rocket.offsetLeft + 50 > cloud.offsetLeft) { clearInterval(gameInterval); clearInterval(starInterval); clearInterval(cloudInterval); alert('Game Over! Your score: ' + score); } }); } function createStar() { let star = document.createElement('div'); star.className = 'star'; star.style.left = Math.random() * (window.innerWidth - 20) + 'px'; star.style.top = '0px'; gameContainer.appendChild(star); fallingStars.push(star); } function createCloud() { let cloud = document.createElement('div'); cloud.className = 'cloud'; cloud.style.left = Math.random() * (window.innerWidth - 80) + 'px'; cloud.style.top = '0px'; gameContainer.appendChild(cloud); fallingClouds.push(cloud); } function moveRocket(e) { if (e.key === 'ArrowLeft' && rocket.offsetLeft > 0) { rocket.style.left = rocket.offsetLeft - rocketSpeed + 'px'; } else if (e.key === 'ArrowRight' && rocket.offsetLeft < window.innerWidth - 50) { rocket.style.left = rocket.offsetLeft + rocketSpeed + 'px'; } } startGame();</script></body></html>
