<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Snowflake Symphony</title><style>body {font-family: Arial, sans-serif; background: #e0f7fa; color: #00796b; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;}h1 {margin-bottom: 20px;}#snowflake-container {width: 100%; height: 70%; position: relative; overflow: hidden; border: 2px dashed #00796b; border-radius: 10px;} .snowflake {position: absolute; top: -50px; width: 30px; height: 30px; background: white; border-radius: 50%; opacity: 0.8; pointer-events: none;}#instructions {margin-top: 20px; text-align: center;}button {background-color: #00796b; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px;}button:hover {background-color: #004d40;}</style></head><body><h1>Whimsical Snowflake Symphony</h1><div id='snowflake-container'></div><div id='instructions'><p>Click anywhere to generate a snowflake!</p><button id='reset'>Reset Symphony</button></div><script>const container = document.getElementById('snowflake-container');const resetButton = document.getElementById('reset');let audio = new Audio('https://www.soundjay.com/button/sounds/button-3.mp3');function createSnowflake(x) {const snowflake = document.createElement('div');snowflake.classList.add('snowflake');snowflake.style.left = x + 'px';snowflake.style.transition = 'transform 2s linear';container.appendChild(snowflake);setTimeout(() => {snowflake.style.transform = 'translateY(100vh)';audio.currentTime = 0;audio.play();snowflake.addEventListener('transitionend', () => {snowflake.remove();});}, 100);  }function generateSnowflake(e) {const x = e.clientX;createSnowflake(x - 15); }function resetSymphony() {container.innerHTML = '';}document.addEventListener('click', generateSnowflake);resetButton.addEventListener('click', resetSymphony);window.addEventListener('resize', resetSymphony);</script></body></html>
