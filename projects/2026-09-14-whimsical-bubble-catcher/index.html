<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Bubble Catcher</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#f0f8ff;}#game{position:relative;width:300px;height:400px;border:3px solid #4caf50;overflow:hidden;}.bubble{position:absolute;border-radius:50%;opacity:0.8;}.black-bubble{background-color:black;}#score{position:absolute;top:10px;left:10px;font-size:20px;color:#333;}#start{position:absolute;top:50%;left:50%;transform:translate(-50%, -50%);background-color:#4caf50;color:white;padding:10px 20px;border:none;font-size:16px;cursor:pointer;}#start:disabled{background-color:#ccc;cursor:not-allowed;}</style></head><body><div id='game'><div id='score'>Score: 0</div><button id='start'>Start Game</button></div><script>let score = 0;let gameActive = false;const gameArea = document.getElementById('game');const scoreDisplay = document.getElementById('score');const startButton = document.getElementById('start');startButton.addEventListener('click', startGame);function startGame(){score = 0;gameActive = true;startButton.disabled = true;scoreDisplay.textContent = 'Score: 0';createBubble();}function createBubble(){if(gameActive){const bubble = document.createElement('div');const size = Math.random() * 30 + 20;const position = Math.random() * 250;const isBlack = Math.random() < 0.3;bubble.classList.add('bubble');bubble.style.width = bubble.style.height = size + 'px';bubble.style.left = position + 'px';bubble.style.top = '430px';bubble.style.backgroundColor = isBlack ? 'black' : 'rgba(0, 128, 255, 0.7)';if(isBlack) bubble.classList.add('black-bubble');gameArea.appendChild(bubble);moveBubble(bubble);}setTimeout(createBubble, 1000);}function moveBubble(bubble){let bubbleInterval = setInterval(() => {const bubbleRect = bubble.getBoundingClientRect();if(bubbleRect.top < 0){clearInterval(bubbleInterval);bubble.remove();}else{bubble.style.top = (bubbleRect.top - 5) + 'px';}if(bubbleRect.top < 0 && gameActive){if(bubble.classList.contains('black-bubble')){score -= 1;scoreDisplay.textContent = 'Score: ' + score;}}}, 30);bubble.addEventListener('click', (event) => {event.stopPropagation();if(gameActive){if(!bubble.classList.contains('black-bubble')){score += 1;scoreDisplay.textContent = 'Score: ' + score;}else{score -= 1;scoreDisplay.textContent = 'Score: ' + score;}bubble.remove();}});}document.addEventListener('mouseleave', () => {gameActive = false;alert('Game Over! Your score is: ' + score);startButton.disabled = false;});</script></body></html>
