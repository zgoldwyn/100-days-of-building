<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Seed Planting Adventure</title><style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background-color:#e0f7fa;flex-direction:column;text-align:center}h1{color:#00796b}button{padding:10px 20px;background-color:#00796b;color:white;border:none;border-radius:5px;cursor:pointer;margin:10px}button:hover{background-color:#004d40}#garden{display:grid;grid-template-columns:repeat(3, 100px);gap:10px;margin-top:20px} .pot{width:100px;height:100px;background-color:#b2dfdb;border:2px solid #00695c;display:flex;justify-content:center;align-items:center;position:relative} .flower{width:30px;height:30px;border-radius:50%;position:absolute;bottom:10px;transition:all 0.5s} .flower.growing{background-color:#ffeb3b} .flower.bloomed{background-color:#ff4081}#message{margin-top:20px;color:#d32f2f}</style></head><body><h1>Whimsical Seed Planting Adventure</h1><button id='plantBtn'>Plant a Seed</button><button id='waterBtn'>Water Plant</button><div id='garden'></div><div id='message'></div><script>const garden = document.getElementById('garden');const message = document.getElementById('message');const plantBtn = document.getElementById('plantBtn');const waterBtn = document.getElementById('waterBtn');let plants=[];function createPot(){const pot = document.createElement('div');pot.classList.add('pot');pot.addEventListener('click', () => growPlant(pot));garden.appendChild(pot);}function growPlant(pot){if(!pot.hasChildNodes()){const flower = document.createElement('div');flower.classList.add('flower');const growthStage = Math.floor(Math.random() * 2);if(growthStage === 0){flower.classList.add('growing');message.textContent='Your plant is sprouting!';} else {flower.classList.add('bloomed');message.textContent='Your plant has bloomed!';}pot.appendChild(flower);plants.push(pot);}}function plantSeed(){if(plants.length < 9){createPot();message.textContent='Seed planted!';}else{message.textContent='Garden is full! Water plants to make space.';}}function waterPlants(){plants.forEach(pot => {if(pot.hasChildNodes()){const flower = pot.lastChild;flower.classList.replace('growing','bloomed');message.textContent='You watered a plant!'}else{message.textContent='You have no plants to water!'}});}plantBtn.addEventListener('click', plantSeed);waterBtn.addEventListener('click', waterPlants);</script></body></html>
