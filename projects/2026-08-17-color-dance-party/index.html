<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Dance Party</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#282c34;color:white;font-family:sans-serif;text-align:center}#game{display:flex;flex-direction:column;align-items:center}#colors{display:flex;justify-content:center;margin-top:20px}div.color{width:80px;height:80px;margin:5px;border-radius:10px;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:transform 0.2s}#score{font-size:24px;margin-top:20px}#start{padding:10px 20px;background-color:#61dafb;color:#282c34;border:none;border-radius:5px;cursor:pointer;transition:background-color 0.2s}#start:hover{background-color:#21a1f1}.hidden{display:none}</style></head><body><div id='game'><h1>Color Dance Party</h1><button id='start'>Start Game</button><div id='colors' class='hidden'></div><div id='score' class='hidden'>Score: 0</div></div><script>const colors=['#ff4d4d','#4dff4d','#4d4dff','#ffff4d'],colorDivs=[],scoreElement=document.getElementById('score'),colorsContainer=document.getElementById('colors'),startButton=document.getElementById('start');let score=0,colorIndex=null,currentColor=null;startButton.addEventListener('click',startGame);function startGame(){score=0;scoreElement.textContent='Score: '+score;startButton.classList.add('hidden');colorsContainer.classList.remove('hidden');createColorDivs();currentColor=colors[Math.floor(Math.random()*colors.length)];setTimeout(showTargetColor,1000);}function createColorDivs(){colorsContainer.innerHTML='';colors.forEach(color=>{const colorDiv=document.createElement('div');colorDiv.classList.add('color');colorDiv.style.backgroundColor=color;colorDiv.addEventListener('click',()=>checkAnswer(color));colorsContainer.appendChild(colorDiv);colorDivs.push(colorDiv);});colorDivs.forEach(div=>{div.style.transform='scale(1)';});}function showTargetColor(){colorIndex=Math.floor(Math.random()*colors.length);colorDivs[colorIndex].style.transform='scale(1.2)';setTimeout(()=>{colorDivs[colorIndex].style.transform='scale(1)'},500);currentColor=colors[colorIndex];setTimeout(showTargetColor,2000);}function checkAnswer(color){if(color===currentColor){score++;scoreElement.textContent='Score: '+score;}else{endGame();}}function endGame(){alert('Game Over! Your score: '+score);resetGame();}function resetGame(){score=0;scoreElement.textContent='Score: '+score;colorsContainer.classList.add('hidden');startButton.classList.remove('hidden');colorDivs.length=0;}setTimeout(()=>{startGame();},500);</script></body></html>
