iv.textContent = 'Score: ' + score; clearInterval(fallAnimation); bottle.remove(); if (score >= 5) { clearInterval(fallInterval); alert('You win! Your score is ' + score); resetGame(); startGame(); } } }, 30); } startGame(); document.body.addEventListener('click', (event) => { if (event.target.classList.contains('bottle') && event.target.style.backgroundColor === targetColorDiv.textContent.split(' ')[1]) { score++; scoreDiv.textContent = 'Score: ' + score; event.target.remove(); if (score >= 5) { clearInterval(fallInterval); alert('You win! Your score is ' + score); resetGame(); startGame(); } } });</script></body></html>
