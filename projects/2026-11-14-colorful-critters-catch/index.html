<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Colorful Critters Catch</title><style>body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f8ff; font-family: Arial, sans-serif; } #game { position: relative; width: 300px; height: 500px; border: 2px solid #333; overflow: hidden; } .critters { position: absolute; width: 30px; height: 30px; } .colorful { background-color: #ff6347; } .gray { background-color: #808080; } #score, #timer { position: absolute; top: 10px; font-size: 20px; } #score { left: 10px; } #timer { right: 10px; } </style></head><body><div id='game'><div id='score'>Score: 0</div><div id='timer'>Time: 30</div></div><script>let score = 0; let timeLeft = 30; let gameInterval; const gameArea = document.getElementById('game'); const scoreDisplay = document.getElementById('score'); const timerDisplay = document.getElementById('timer'); function startGame() { gameInterval = setInterval(generateCritter, 1000); let countdown = setInterval(() => { timeLeft--; timerDisplay.textContent = 'Time: ' + timeLeft; if (timeLeft <= 0) { clearInterval(countdown); clearInterval(gameInterval); alert('Game Over! Your score: ' + score); } }, 1000); } function generateCritter() { const critter = document.createElement('div'); const isColorful = Math.random() > 0.5; critter.classList.add('critters', isColorful ? 'colorful' : 'gray'); critter.style.left = Math.random() * (gameArea.clientWidth - 30) + 'px'; critter.style.top = '0px'; gameArea.appendChild(critter); let fallInterval = setInterval(() => { critter.style.top = critter.offsetTop + 5 + 'px'; if (critter.offsetTop > gameArea.clientHeight) { clearInterval(fallInterval); gameArea.removeChild(critter); } }, 50); critter.onclick = function() { if (isColorful) { score++; scoreDisplay.textContent = 'Score: ' + score; } else { score--; scoreDisplay.textContent = 'Score: ' + score; } gameArea.removeChild(critter); clearInterval(fallInterval); }; } startGame(); </script></body></html>
