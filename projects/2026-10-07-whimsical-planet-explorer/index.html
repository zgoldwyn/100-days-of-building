<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Planet Explorer</title><style>body{margin:0;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#1a1a2e;color:#fff;}canvas{border:2px solid #fff;}#score{font-size:24px;}#instructions{font-size:18px; margin:20px;}button{background-color:#e94560; color:#fff; border:none; padding:10px 20px; font-size:18px; cursor:pointer; border-radius:5px;}button:hover{background-color:#f5a623;}</style></head><body><canvas id='gameCanvas' width='800' height='600'></canvas><div id='score'>Score: 0</div><div id='instructions'>Click to start the game</div><button id='restartButton' style='display:none;'>Restart</button><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');let score=0;let spaceship={x:canvas.width/2-25,y:canvas.height-60,width:50,height:50};let stars=[];let asteroids=[];let gameInterval;let gameStarted=false;function startGame(){gameStarted=true;score=0;stars=[];asteroids=[];document.getElementById('restartButton').style.display='none';document.getElementById('instructions').style.display='none';gameInterval=setInterval(updateGame,50);}function updateGame(){ctx.clearRect(0,0,canvas.width,canvas.height);drawSpaceship();handleStars();handleAsteroids();if(Math.random()<0.05)addStar();if(Math.random()<0.02)addAsteroid();checkCollisions();}function drawSpaceship(){ctx.fillStyle='#ffcc00';ctx.fillRect(spaceship.x,spaceship.y,spaceship.width,spaceship.height;}function handleStars(){for(let i=0;i<stars.length;i++){ctx.fillStyle='#fff';stars[i].y+=2;ctx.beginPath();ctx.arc(stars[i].x,stars[i].y,5,0,Math.PI*2);ctx.fill();if(stars[i].y>canvas.height){stars.splice(i,1);i--;}else if(stars[i].y>spaceship.y&&stars[i].y<spaceship.y+spaceship.height&&stars[i].x>spaceship.x&&stars[i].x<spaceship.x+spaceship.width){score+=10;stars.splice(i,1);i--;}}}function addStar(){stars.push({x:Math.random()*canvas.width,y:0});}function handleAsteroids(){for(let i=0;i<asteroids.length;i++){ctx.fillStyle='rgba(150,150,150,0.5)';asteroids[i].y+=4;ctx.fillRect(asteroids[i].x,asteroids[i].y,40,40);if(asteroids[i].y>canvas.height){asteroids.splice(i,1);i--;}}}function addAsteroid(){asteroids.push({x:Math.random()*canvas.width,y:0});}function checkCollisions(){for(let i=0;i<asteroids.length;i++){if(asteroids[i].y>spaceship.y&&asteroids[i].y<spaceship.y+spaceship.height&&asteroids[i].x>spaceship.x&&asteroids[i].x<spaceship.x+spaceship.width){clearInterval(gameInterval);alert('Game Over! Your score: '+score);document.getElementById('restartButton').style.display='block';}}}document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'&&spaceship.x>0)spaceship.x-=15;if(e.key==='ArrowRight'&&spaceship.x<canvas.width-spaceship.width)spaceship.x+=15;});document.getElementById('restartButton').addEventListener('click',function(){clearInterval(gameInterval);startGame();});document.addEventListener('click',function(){if(!gameStarted)startGame();});</script></body></html>
