<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Connector Canvas</title><style>body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f0f8ff; } canvas { border: 2px solid #4a90e2; background-color: #e6f7ff; } #score { font-size: 24px; } #timer { font-size: 24px; color: red; }</style></head><body><h1>Whimsical Connector Canvas</h1><p id='score'>Score: 0</p><p id='timer'>Time Left: 60</p><canvas id='canvas' width='600' height='400'></canvas><button id='restart' style='display:none;'>Play Again</button><script>const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d'); const scoreElement = document.getElementById('score'); const timerElement = document.getElementById('timer'); const restartButton = document.getElementById('restart'); let score = 0; let timeLeft = 60; let drawing = false; let dots = []; let lines = []; const dotCount = 6; let timer; function setupDots() { dots = []; for (let i = 0; i < dotCount; i++) { const x = Math.random() * canvas.width; const y = Math.random() * canvas.height; dots.push({ x, y }); } drawDots(); } function drawDots() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#4a90e2'; dots.forEach(dot => { ctx.beginPath(); ctx.arc(dot.x, dot.y, 10, 0, Math.PI * 2); ctx.fill(); }); lines.forEach(line => { ctx.beginPath(); ctx.moveTo(line.start.x, line.start.y); ctx.lineTo(line.end.x, line.end.y); ctx.strokeStyle = '#ff4081'; ctx.lineWidth = 3; ctx.stroke(); }); } function startGame() { score = 0; updateScore(); timeLeft = 60; timerElement.textContent = 'Time Left: ' + timeLeft; setupDots(); timer = setInterval(() => { timeLeft--; timerElement.textContent = 'Time Left: ' + timeLeft; if (timeLeft <= 0) endGame(); }, 1000); } function endGame() { clearInterval(timer); alert('Game Over! Your score is: ' + score); restartButton.style.display = 'block'; } function updateScore() { scoreElement.textContent = 'Score: ' + score; } canvas.addEventListener('mousedown', (e) => { const rect = canvas.getBoundingClientRect(); const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top; drawing = true; const currentDot = dots.find(dot => Math.hypot(dot.x - mouseX, dot.y - mouseY) < 10); if (currentDot) { const line = { start: currentDot }; lines.push(line); ctx.beginPath(); ctx.moveTo(currentDot.x, currentDot.y); } }); canvas.addEventListener('mousemove', (e) => { if (drawing) { const rect = canvas.getBoundingClientRect(); const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top; ctx.lineTo(mouseX, mouseY); ctx.stroke(); } }); canvas.addEventListener('mouseup', (e) => { if (drawing) { drawing = false; const rect = canvas.getBoundingClientRect(); const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top; const endDot = dots.find(dot => Math.hypot(dot.x - mouseX, dot.y - mouseY) < 10); if (endDot) { const line = lines[lines.length - 1]; line.end = endDot; score++; updateScore(); drawDots(); } } }); restartButton.addEventListener('click', () => { restartButton.style.display = 'none'; ctx.clearRect(0, 0, canvas.width, canvas.height); lines = []; startGame(); }); startGame();</script></body></html>
