<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Chameleon Challenge</title><style>body{font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f8ff;}h1{color: #ff6347;}#game-container{position: relative; width: 300px; height: 400px; background-color: #fff; border: 2px solid #ff6347; overflow: hidden;}#chameleon{position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 60px; width: 60px; border-radius: 50%; transition: background-color 0.5s;}#scoreboard{margin-top: 20px; font-size: 18px;}#start-button{padding: 10px 20px; background-color: #ff6347; color: white; border: none; border-radius: 5px; cursor: pointer;}#start-button:hover{background-color: #ff4500;}</style></head><body><h1>Color Chameleon Challenge</h1><div id='game-container'><div id='chameleon'></div></div><div id='scoreboard'>Score: <span id='score'>0</span></div><button id='start-button'>Start Game</button><script>const chameleon = document.getElementById('chameleon');const scoreboard = document.getElementById('score');const startButton = document.getElementById('start-button');let score = 0;let timerId;let gameTime = 20;let colors = ['red', 'green', 'blue', 'yellow', 'orange', 'purple'];function startGame(){score = 0;scoreboard.innerHTML = score;gameTime = 20;resetChameleon();startButton.style.display = 'none';timerId = setInterval(handleGameTime, 1000);playGame();}function handleGameTime(){if(gameTime > 0){gameTime--;}else{endGame();}}function endGame(){clearInterval(timerId);startButton.style.display = 'block';alert('Time is up! Your score: ' + score);}function generateBugColor(){return colors[Math.floor(Math.random() * colors.length)];}function resetChameleon(){let randomColor = generateBugColor();chameleon.style.backgroundColor = randomColor;}function playGame(){setTimeout(() => {let bugColor = generateBugColor();if(confirm('A bug of color ' + bugColor + ' is coming! Tap OK to change your chameleon color to match!')){chameleon.style.backgroundColor = bugColor;score++;scoreboard.innerHTML = score;}resetChameleon();playGame();}, 2000);}startButton.addEventListener('click', startGame);</script></body></html>
