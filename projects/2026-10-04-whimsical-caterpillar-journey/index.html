<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Caterpillar Journey</title><style>body{font-family:Arial,sans-serif;background-color:#f0f8ff;margin:0;padding:20px;text-align:center}.game-container{position:relative;width:100%;max-width:600px;margin:auto;overflow:hidden;border:2px solid #2e8b57;border-radius:10px;background-color:#ffffff;box-shadow:0 0 10px rgba(0,0,0,0.2)}.caterpillar{position:absolute;width:50px;height:50px;background-color:#2e8b57;border-radius:20px;transition:transform 0.1s}.leaf{position:absolute;width:30px;height:30px;background-color:#7cfc00;clip-path:polygon(50% 0%, 0% 100%, 100% 100%)}.bug{position:absolute;width:30px;height:30px;background-color:#ff6347;border-radius:50%}.score{font-size:20px;margin:10px 0;}</style></head><body><h1>Whimsical Caterpillar Journey</h1><p>Guide the caterpillar to munch on leaves while avoiding bugs!</p><div class='game-container'><div class='caterpillar' id='caterpillar'></div></div><div class='score'>Score: <span id='score'>0</span></div><button id='start-btn'>Start Game</button><script>let score = 0;let gameInterval;let caterpillar = document.getElementById('caterpillar');let scoreDisplay = document.getElementById('score');let gameContainer = document.querySelector('.game-container');document.getElementById('start-btn').onclick = startGame;function startGame(){resetGame();gameInterval = setInterval(gameLoop, 100);document.addEventListener('keydown', moveCaterpillar);}function resetGame(){score = 0;scoreDisplay.textContent = score;document.querySelectorAll('.leaf, .bug').forEach(el => el.remove());}function moveCaterpillar(event){let left = parseInt(window.getComputedStyle(caterpillar).getPropertyValue('left'));if(event.key === 'ArrowLeft' && left > 0){caterpillar.style.left = (left - 20) + 'px';}if(event.key === 'ArrowRight' && left < (gameContainer.offsetWidth - 50)){caterpillar.style.left = (left + 20) + 'px';}}function spawnLeaf(){let leaf = document.createElement('div');leaf.classList.add('leaf');leaf.style.left = Math.random() * (gameContainer.offsetWidth - 30) + 'px';leaf.style.bottom = '0px';gameContainer.appendChild(leaf);fallLeaf(leaf);}function spawnBug(){let bug = document.createElement('div');bug.classList.add('bug');bug.style.left = Math.random() * (gameContainer.offsetWidth - 30) + 'px';bug.style.bottom = '0px';gameContainer.appendChild(bug);fallBug(bug);}function fallLeaf(leaf){let fallInterval = setInterval(() => {leaf.style.bottom = (parseInt(leaf.style.bottom) + 5) + 'px';if(parseInt(leaf.style.bottom) > gameContainer.offsetHeight){clearInterval(fallInterval);leaf.remove();}if(collideCaterpillar(leaf)){score++;scoreDisplay.textContent = score;clearInterval(fallInterval);leaf.remove();spawnLeaf();}}, 100);}function fallBug(bug){let fallInterval = setInterval(() => {bug.style.bottom = (parseInt(bug.style.bottom) + 5) + 'px';if(parseInt(bug.style.bottom) > gameContainer.offsetHeight){clearInterval(fallInterval);bug.remove();}if(collideCaterpillar(bug)){clearInterval(fallInterval);alert('Game Over! Your score is ' + score);resetGame();}}, 100);}function collideCaterpillar(element){let caterpillarRect = caterpillar.getBoundingClientRect();let elementRect = element.getBoundingClientRect();return!(elementRect.right < caterpillarRect.left ||elementRect.left > caterpillarRect.right ||elementRect.bottom < caterpillarRect.top ||elementRect.top > caterpillarRect.bottom);}function gameLoop(){if(Math.random() < 0.3){spawnLeaf();}if(Math.random() < 0.2){spawnBug();}}</script></body></html>
