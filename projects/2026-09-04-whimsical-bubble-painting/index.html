<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Bubble Painting</title><style>body {display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f8ff; flex-direction: column; font-family: Arial, sans-serif;}canvas {border: 1px solid #ddd; cursor: pointer; margin-top: 20px;}.instructions {margin-bottom: 20px; text-align: center;}h1 {color: #5a5a5a;}h2 {color: #8b8888;}</style></head><body><h1>Whimsical Bubble Painting</h1><p class='instructions'>Click to create paint bubbles and pop them to reveal colors! Try to mix colors and create unique patterns.</p><canvas id='canvas' width='400' height='400'></canvas><h2 id='score'>Score: 0</h2><script>const canvas = document.getElementById('canvas');const ctx = canvas.getContext('2d');let score = 0;let bubbles = [];class Bubble {constructor(x, y, radius, color) {this.x = x;this.y = y;this.radius = radius;this.color = color;this.pop = false;}draw() {ctx.beginPath();ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);ctx.fillStyle = this.color;ctx.fill();ctx.closePath();}update() {if (this.pop) {this.radius -= 1;if (this.radius <= 0) {this.removeBubble();}}}removeBubble() {bubbles = bubbles.filter(bubble => bubble !== this);score++;document.getElementById('score').innerText = 'Score: ' + score;}popBubble(x, y) {if (Math.hypot(this.x - x, this.y - y) < this.radius) {this.pop = true;}}}function createBubble(x, y) {const radius = Math.random() * 30 + 10;const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];const color = colors[Math.floor(Math.random() * colors.length)];const bubble = new Bubble(x, y, radius, color);bubbles.push(bubble);}function draw() {ctx.clearRect(0, 0, canvas.width, canvas.height);bubbles.forEach(bubble => {bubble.draw();bubble.update();});requestAnimationFrame(draw);}canvas.addEventListener('click', (event) => {const rect = canvas.getBoundingClientRect();const x = event.clientX - rect.left;const y = event.clientY - rect.top;createBubble(x, y);});canvas.addEventListener('click', (event) => {const rect = canvas.getBoundingClientRect();const x = event.clientX - rect.left;const y = event.clientY - rect.top;bubbles.forEach(bubble => bubble.popBubble(x, y));});requestAnimationFrame(draw);</script></body></html>
