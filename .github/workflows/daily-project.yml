name: Generate daily mini project

on:
  schedule:
    # 12:17 UTC = 5:17 AM PDT / 4:17 AM PST
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  generate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate mini project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PYTHON'
          import json
          import os
          import pathlib
          import re
          import urllib.request
          from datetime import datetime, timezone

          root = pathlib.Path(".")
          projects_dir = root / "projects"
          projects_dir.mkdir(exist_ok=True)

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # Prevent more than one generated project on the same UTC day.
          existing_today = list(projects_dir.glob(f"{today}-*"))

          if existing_today:
              print(
                  f"A project already exists for {today}: "
                  f"{existing_today[0]}"
              )
              raise SystemExit(0)

          # Read existing project README files so the model can avoid
          # generating duplicate or highly similar projects.
          existing_projects = []

          for project_dir in sorted(projects_dir.iterdir()):
              if not project_dir.is_dir():
                  continue

              readme_path = project_dir / "README.md"

              if readme_path.exists():
                  readme_text = readme_path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )

                  # Limit each README excerpt to control token usage.
                  readme_excerpt = readme_text[:800].strip()

                  existing_projects.append(
                      f"Folder: {project_dir.name}\n"
                      f"README:\n{readme_excerpt}"
                  )
              else:
                  existing_projects.append(
                      f"Folder: {project_dir.name}\n"
                      "README: unavailable"
                  )

          # Only compare against the most recent 100 projects.
          recent_projects = existing_projects[-100:]

          existing_text = "\n\n---\n\n".join(recent_projects)

          if not existing_text:
              existing_text = "No previous projects exist."

          prompt = f"""
          Create one original, extremely small beginner-friendly web project.

          Requirements:
          - Do not duplicate or closely resemble any existing project below.
          - Compare the title, purpose, interaction, and core mechanic.
          - Use only plain HTML, CSS, and JavaScript.
          - Put everything in one index.html file.
          - Do not use packages, external APIs, external images, or build tools.
          - The project must work by opening index.html in a web browser.
          - Keep index.html below 180 lines.
          - Include at least one useful interactive feature.
          - Do not use markdown code fences.
          - Return only valid JSON.

          Required JSON structure:
          {{
            "name": "short-kebab-case-name",
            "title": "Readable Project Title",
            "description": "One-sentence description.",
            "index_html": "<!DOCTYPE html>..."
          }}

          Existing projects and README summaries:

          {existing_text}
          """

          payload = {
              "model": "openai/gpt-4.1-mini",
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You create tiny, safe, self-contained educational "
                          "web projects and return strictly valid JSON."
                      ),
                  },
                  {
                      "role": "user",
                      "content": prompt,
                  },
              ],
              "temperature": 0.9,
              "max_tokens": 2500,
              "response_format": {
                  "type": "json_object"
              },
          }

          request = urllib.request.Request(
              "https://models.github.ai/inference/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": (
                      f"Bearer {os.environ['GITHUB_TOKEN']}"
                  ),
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github+json",
              },
              method="POST",
          )

          with urllib.request.urlopen(
              request,
              timeout=90,
          ) as response:
              api_result = json.loads(
                  response.read().decode("utf-8")
              )

          content = api_result["choices"][0]["message"]["content"]
          project = json.loads(content)

          required_fields = {
              "name",
              "title",
              "description",
              "index_html",
          }

          missing_fields = required_fields - project.keys()

          if missing_fields:
              raise ValueError(
                  f"Model response is missing fields: {missing_fields}"
              )

          name = re.sub(
              r"[^a-z0-9-]",
              "-",
              project["name"].lower(),
          )

          name = re.sub(r"-+", "-", name).strip("-")

          if not name:
              raise ValueError(
                  "The generated project name is invalid."
              )

          folder = projects_dir / f"{today}-{name}"

          if folder.exists():
              raise ValueError(
                  f"Project folder already exists: {folder}"
              )

          html = project["index_html"].strip()

          if not html.lower().startswith("<!doctype html"):
              raise ValueError(
                  "Generated file is not a complete HTML document."
              )

          folder.mkdir()

          index_file = folder / "index.html"
          index_file.write_text(
              html + "\n",
              encoding="utf-8",
          )

          project_readme = (
              f"# {project['title']}\n\n"
              f"{project['description']}\n\n"
              "## Run\n\n"
              "Open `index.html` in a web browser.\n\n"
              "## Generation\n\n"
              f"Generated automatically on {today} "
              "using GitHub Models.\n"
          )

          readme_file = folder / "README.md"
          readme_file.write_text(
              project_readme,
              encoding="utf-8",
          )

          projects_index = projects_dir / "README.md"

          if not projects_index.exists():
              projects_index.write_text(
                  "# Daily Mini Projects\n\n"
                  "Small projects generated as part of a daily "
                  "building experiment.\n",
                  encoding="utf-8",
              )

          with projects_index.open(
              "a",
              encoding="utf-8",
          ) as file:
              file.write(
                  f"\n- [{today}: {project['title']}]"
                  f"(./{folder.name}/) — "
                  f"{project['description']}\n"
              )

          print(f"Created {folder}")
          PYTHON

      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: "zgoldwyn"
          GIT_AUTHOR_EMAIL: "zachgoldwyn@icloud.com"
          GIT_COMMITTER_NAME: "zgoldwyn"
          GIT_COMMITTER_EMAIL: "zachgoldwyn@icloud.com"
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi

          git add projects
          git commit -m "build: add daily mini project $(date -u +'%Y-%m-%d')"
          git push
