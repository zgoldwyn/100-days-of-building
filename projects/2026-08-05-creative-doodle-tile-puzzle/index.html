<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Creative Doodle Tile Puzzle</title><style>body {display: flex;flex-direction: column;align-items: center;justify-content: center;height: 100vh;margin: 0;}h1 {font-family: Arial, sans-serif;}#target {width: 200px;height: 200px;margin-bottom: 20px}#tiles {display: grid;grid-template-columns: repeat(3, 70px);gap: 10px;} .tile {width: 70px;height: 70px;display: flex;align-items: center;justify-content: center;background-color: #f0f0f0;border: 2px solid #ccc;cursor: grab;}.tile.dragging {cursor: grabbing;}</style></head><body><h1>Creative Doodle Tile Puzzle</h1><div id='target'></div><div id='tiles'></div><button id='reset' style='margin-top: 20px;'>Reset Puzzle</button><script>const targetImage = 'https://via.placeholder.com/200';let tiles = [], shuffledTiles = [], blankTileIdx = 11;const tileCount = 12;window.onload = () => {createTiles();drawTarget();shuffleTiles();drawTiles();};function createTiles() {for (let i = 0; i < tileCount; i++) {tiles.push(i === blankTileIdx ? null : i);}}function drawTarget() {const target = document.getElementById('target');target.style.backgroundImage = `url(${targetImage})`;target.style.backgroundSize = 'cover';}function shuffleTiles() {shuffledTiles = [...tiles].sort(() => Math.random() - 0.5);}function drawTiles() {const tilesContainer = document.getElementById('tiles');tilesContainer.innerHTML = '';shuffledTiles.forEach((tile, idx) => {const tileElement = document.createElement('div');tileElement.className = 'tile';tileElement.draggable = true;tileElement.dataset.index = idx;tileElement.innerHTML = tile !== null ? tile : '';tileElement.style.backgroundColor = tile !== null ? '#f0f0f0' : 'transparent';tileElement.addEventListener('dragstart', onDragStart);tileElement.addEventListener('dragover', onDragOver);tileElement.addEventListener('drop', onDrop);tilesContainer.appendChild(tileElement);});}function onDragStart(e) {e.dataTransfer.setData('text/plain', e.target.dataset.index);e.target.classList.add('dragging');}function onDragOver(e) {e.preventDefault();}function onDrop(e) {e.preventDefault();const draggedIdx = e.dataTransfer.getData('text/plain');const targetIdx = e.target.dataset.index;if (targetIdx != blankTileIdx && targetIdx != null) {shuffledTiles[blankTileIdx] = shuffledTiles[targetIdx];shuffledTiles[targetIdx] = null;blankTileIdx = targetIdx;drawTiles();checkWin();}}function checkWin() {if (shuffledTiles.join(',') === tiles.join(',')) {alert('Congratulations! You matched the image!');}}document.getElementById('reset').addEventListener('click', () => {shuffleTiles();drawTiles();});</script></body></html>
