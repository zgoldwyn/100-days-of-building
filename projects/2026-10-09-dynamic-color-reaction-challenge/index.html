<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Dynamic Color Reaction Challenge</title><style>body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; font-family: Arial, sans-serif; } h1 { text-align: center; } #game-container { display: flex; flex-direction: column; align-items: center; } #color-box { width: 200px; height: 200px; margin: 20px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 2em; color: white; } #score { margin-top: 20px; font-size: 1.5em; } #start-btn { padding: 10px 20px; font-size: 1.2em; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; } #start-btn:hover { background-color: #45a049; }</style></head><body><div id='game-container'><h1>Dynamic Color Reaction Challenge</h1><div id='color-box'>Click!</div><button id='start-btn'>Start Game</button><div id='score'>Score: 0</div></div><script>let score = 0; let timeLeft = 30; let colorBox = document.getElementById('color-box'); let scoreDisplay = document.getElementById('score'); let startButton = document.getElementById('start-btn'); let gameInterval; let colorInterval; function startGame() { score = 0; timeLeft = 30; scoreDisplay.textContent = 'Score: ' + score; startButton.disabled = true; changeColor(); gameInterval = setInterval(updateTimer, 1000); } function changeColor() { const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange', 'pink']; colorBox.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]; colorBox.textContent = 'Click!'; colorBox.onclick = function() { score++; scoreDisplay.textContent = 'Score: ' + score; changeColor(); }; colorInterval = setTimeout(() => { colorBox.textContent = 'Time up!'; colorBox.onclick = null; }, 500); } function updateTimer() { timeLeft--; if (timeLeft <= 0) { clearInterval(gameInterval); clearTimeout(colorInterval); colorBox.textContent = 'Your final score: ' + score; startButton.disabled = false; } } startButton.onclick = startGame;</script></body></html>
