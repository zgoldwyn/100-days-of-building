<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Jellyfish Escape Adventure</title><style>body{background-color:#1E3F50;color:white;text-align:center;font-family:Arial,sans-serif;}canvas{border:1px solid white;}#score{font-size:22px;margin-top:10px;}#start-button{padding:10px 20px;background-color:#5DADE2;color:white;border:none;border-radius:5px;cursor:pointer;}.hidden{display:none;}</style></head><body><h1>Jellyfish Escape Adventure</h1><canvas id='gameCanvas' width='400' height='600'></canvas><div id='score'>Score: 0</div><button id='start-button'>Start Game</button><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');let jellyfish={x:150,y:500,width:30,height:30};let orbs=[];let obstacles=[];let score=0;let gameInterval;let orbInterval;let isGameRunning=false;function startGame(){isGameRunning=true;score=0;orbs=[];obstacles=[];jellyfish.y=500;document.getElementById('score').innerText='Score: 0';gameInterval=setInterval(updateGame,20);orbInterval=setInterval(addOrb,1000);document.getElementById('start-button').classList.add('hidden');}function stopGame(){clearInterval(gameInterval);clearInterval(orbInterval);alert('Game Over! Your Score: '+score);isGameRunning=false;document.getElementById('start-button').classList.remove('hidden');}function addOrb(){let orbX=Math.random()*(canvas.width-20);orbs.push({x:orbX,y:0,width:20,height:20});}function updateGame(){ctx.clearRect(0,0,canvas.width,canvas.height);drawJellyfish();moveOrbs();moveObstacles();checkCollisions();}function drawJellyfish(){ctx.fillStyle='pink';ctx.beginPath();ctx.arc(jellyfish.x,jellyfish.y,jellyfish.width/2,0,Math.PI*2);ctx.fill();}function moveOrbs(){for(let i=0;i<orbs.length;i++){orbs[i].y+=2;if(orbs[i].y>canvas.height){orbs.splice(i,1);i--}else{ctx.fillStyle='yellow';ctx.fillRect(orbs[i].x,orbs[i].y,orbs[i].width,orbs[i].height);if(checkCollision(jellyfish,orbs[i])){score++;document.getElementById('score').innerText='Score: '+score;orbs.splice(i,1);i--;}}}}function moveObstacles(){if(Math.random()<0.02){let obsX=Math.random()*(canvas.width-40);obstacles.push({x:obsX,y:0,width:40,height:40})}for(let i=0;i<obstacles.length;i++){obstacles[i].y+=3;if(obstacles[i].y>canvas.height){obstacles.splice(i,1);i--}else{ctx.fillStyle='red';ctx.fillRect(obstacles[i].x,obstacles[i].y,obstacles[i].width,obstacles[i].height);}}}function checkCollision(rect1,rect2){return rect1.x<rect2.x+rect2.width&&rect1.x+rect1.width>rect2.x&&rect1.y<rect2.y+rect2.height&&rect1.y+rect1.height>rect2.y;}function onMouseMove(event){if(isGameRunning){let rect=canvas.getBoundingClientRect();jellyfish.x=event.clientX-rect.left-jellyfish.width/2;}}document.getElementById('start-button').addEventListener('click',startGame);canvas.addEventListener('mousemove',onMouseMove);document.addEventListener('keydown',function(e){if(e.key==='Escape'){stopGame();}});</script></body></html>
