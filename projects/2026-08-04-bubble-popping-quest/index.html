<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Bubble Popping Quest</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#e0f7fa;font-family:sans-serif}.game-container{position:relative;width:300px;height:400px;border:2px solid #00796b;overflow:hidden}.bubble{position:absolute;width:40px;height:40px;border-radius:50%;background-color:rgba(100, 255, 218, 0.7);cursor:pointer;transition:transform 0.2s}.spike{position:absolute;width:30px;height:30px;background-color:rgba(255, 82, 82, 0.7);clip-path:polygon(50% 0%, 0% 100%, 100% 100%);cursor:not-allowed;transition:transform 0.2s}.#score{position:absolute;top:10px;left:10px;font-size:20px;color:#00796b;}.#start{position:absolute;top:50%;left:50%;transform:translate(-50%, -50%);padding:10px 20px;background-color:#00796b;color:#fff;border:none;cursor:pointer;display:none;}.hide{display:none;}</style></head><body><div class='game-container' id='gameContainer'><div id='score'>Score: 0</div><button id='start' class='hide'>Start Game</button></div><script>let score = 0;let gameInterval;function startGame(){document.getElementById('start').classList.add('hide');score = 0;updateScore();gameInterval = setInterval(createBubble, 1000);setTimeout(endGame, 30000);}function createBubble(){const bubble = document.createElement('div');bubble.className = 'bubble';bubble.style.left = Math.random() * (300 - 40) + 'px';bubble.style.top = Math.random() * (400 - 40) + 'px';bubble.onclick = () => {score++;updateScore();bubble.remove();};document.getElementById('gameContainer').appendChild(bubble);const spike = document.createElement('div');spike.className = 'spike';spike.style.left = Math.random() * (300 - 30) + 'px';spike.style.top = Math.random() * (400 - 30) + 'px';spike.onclick = endGame;document.getElementById('gameContainer').appendChild(spike);setTimeout(() => {bubble.remove();spike.remove();}, 2000);}function updateScore(){document.getElementById('score').innerText = 'Score: ' + score;}function endGame(){clearInterval(gameInterval);alert('Game Over! Your final score is: ' + score);document.getElementById('start').classList.remove('hide');}document.getElementById('start').onclick = startGame;window.onload = () => {document.getElementById('start').classList.remove('hide');};</script></body></html>
