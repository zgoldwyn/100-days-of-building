<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Painting Puzzle</title><style>body{font-family:Arial,sans-serif;background-color:#f0f4f8;color:#333;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;}h1{color:#ff6347;}#gameBoard{display:grid;grid-template-columns:repeat(3,100px);grid-gap:5px;opacity:0.8;}#gameBoard img{width:100px;height:100px;object-fit:cover;cursor:pointer;}button{padding:10px 20px;margin-top:20px;background-color:#ff6347;color:white;border:none;border-radius:5px;cursor:pointer;}button:hover{background-color:#ff4500;}#timer{font-size:24px;margin-top:10px;}@media (max-width:400px) {#gameBoard{grid-template-columns:repeat(2,100px);}}@media (max-width:300px) {#gameBoard{grid-template-columns:repeat(1,100px);}}</style></head><body><h1>Whimsical Painting Puzzle</h1><div id='gameBoard'></div><button id='restartBtn'>Restart Game</button><div id='timer'>Time Left: <span id='time'>60</span>s</div><script>const images=['https://via.placeholder.com/100/ff9999/ffffff?text=1','https://via.placeholder.com/100/99ff99/ffffff?text=2','https://via.placeholder.com/100/9999ff/ffffff?text=3','https://via.placeholder.com/100/ffff99/ffffff?text=4','https://via.placeholder.com/100/ff99ff/ffffff?text=5','https://via.placeholder.com/100/99ffff/ffffff?text=6'];let board=document.getElementById('gameBoard');let timerDisplay=document.getElementById('time');let timeLeft=60;let interval;function startGame(){let shuffledImages=images.sort(()=>Math.random()-0.5);board.innerHTML='';shuffledImages.forEach((imgSrc,index)=>{let img=document.createElement('img');img.src=imgSrc;img.dataset.index=index;img.onclick=()=>{onTileClick(img);};board.appendChild(img);});timeLeft=60;timerDisplay.innerText=timeLeft;clearInterval(interval);interval=setInterval(updateTimer,1000);}function onTileClick(img){if(img.parentElement===board){img.style.opacity='0.5';img.onclick=null;checkWin();}}function updateTimer(){timeLeft--;timerDisplay.innerText=timeLeft;if(timeLeft<=0){clearInterval(interval);alert('Time is up!');startGame();}}function checkWin(){let selectedTiles=Array.from(board.children).filter(tile=>tile.style.opacity==='0.5');if(selectedTiles.length===images.length){clearInterval(interval);alert('Congratulations! You completed the puzzle!');startGame();}}document.getElementById('restartBtn').onclick=startGame;startGame();</script></body></html>
