<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Playful Sound Wave Creator</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#f0f0f0;}#canvas{border:2px solid #555;cursor:crosshair;}#controls{position:absolute;top:20px;left:20px;background:#fff;padding:10px;border-radius:5px;box-shadow:0 0 10px rgba(0,0,0,0.1);}label{display:block;margin-bottom:10px;}</style></head><body><div id='controls'><label>Frequency:<input type='range' id='frequency' min='100' max='2000' value='440'></label><label>Amplitude:<input type='range' id='amplitude' min='0' max='100' value='50'></label></div><canvas id='canvas' width='800' height='400'></canvas><script>const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');let drawing=false;let frequency=440;let amplitude=50;let audioContext=new (window.AudioContext||window.webkitAudioContext)();let oscillator=audioContext.createOscillator();oscillator.type='sine';oscillator.frequency.value=frequency;oscillator.start();oscillator.connect(audioContext.destination);function startDrawing(e){drawing=true;draw(e);}function stopDrawing(){drawing=false;ctx.beginPath();}function draw(e){if(!drawing)return;ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#ff5722';ctx.lineTo(e.clientX-canvas.offsetLeft,e.clientY-canvas.offsetTop);ctx.stroke();ctx.beginPath();ctx.moveTo(e.clientX-canvas.offsetLeft,e.clientY-canvas.offsetTop);setWave();}function setWave(){frequency=document.getElementById('frequency').value;amplitude=document.getElementById('amplitude').value;oscillator.frequency.setValueAtTime(frequency,audioContext.currentTime);}canvas.addEventListener('mousedown',startDrawing);canvas.addEventListener('mouseup',stopDrawing);canvas.addEventListener('mousemove',draw);document.getElementById('frequency').addEventListener('input',setWave);document.getElementById('amplitude').addEventListener('input',setWave);</script></body></html>
