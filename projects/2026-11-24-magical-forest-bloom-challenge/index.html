<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Magical Forest Bloom Challenge</title><style>body{background-color:#e3f2fd;color:#342e37;font-family:Arial,sans-serif;text-align:center}h1{font-size:2.5rem;margin:10px}canvas{border:2px solid #342e37;display:block;margin:0 auto;}#score{font-size:1.5rem}#start{padding:10px 20px;background-color:#78c8f3;color:white;border:none;border-radius:5px;cursor:pointer;font-size:1.2rem}#start:hover{background-color:#63a9c7}</style></head><body><h1>Magical Forest Bloom Challenge</h1><button id="start">Start Game</button><p id="score">Score: 0</p><canvas id="gameCanvas" width="400" height="400"></canvas><script>var canvas=document.getElementById('gameCanvas');var ctx=canvas.getContext('2d');var score=0;var raindrops=[];var critters=[];var gameRunning=false;class Raindrop{constructor(){this.x=Math.random()*canvas.width;this.y=0;this.radius=5;}update(){this.y+=3;if(this.y>canvas.height){this.y=0;this.x=Math.random()*canvas.width;}}draw(){ctx.fillStyle='blue';ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fill();}}class Critter{constructor(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.size=20;}update(){this.x+=Math.random()*4-2;this.y+=Math.random()*4-2;if(this.x<0)this.x=0;if(this.x>canvas.width)this.x=canvas.width;if(this.y<0)this.y=0;if(this.y>canvas.height)this.y=canvas.height;}draw(){ctx.fillStyle='red';ctx.fillRect(this.x,this.y,this.size,this.size);}}function spawnObjects(){if(Math.random()<0.1){raindrops.push(new Raindrop());}if(Math.random()<0.05){critters.push(new Critter());}}function updateGameArea(){if(!gameRunning)return;ctx.clearRect(0,0,canvas.width,canvas.height);spawnObjects();raindrops.forEach((drop,index)=>{drop.update();drop.draw();if(drop.y>canvas.height){raindrops.splice(index,1);}});critters.forEach(critter=>{critter.update();critter.draw();});ctx.font='20px Arial';ctx.fillText('Score: '+score,10,30);requestAnimationFrame(updateGameArea);}canvas.addEventListener('click',(event)=>{var rect=canvas.getBoundingClientRect();var x=event.clientX-rect.left;var y=event.clientY-rect.top;raindrops.forEach((drop,index)=>{if(Math.hypot(drop.x-x,drop.y-y)<drop.radius){score+=10;raindrops.splice(index,1);}});critters.forEach((critter,index)=>{if(x>critter.x&&x<critter.x+critter.size&&y>critter.y&&y<critter.y+critter.y+critter.size){score-=5;critters.splice(index,1);}});});document.getElementById('start').addEventListener('click',()=>{score=0;gameRunning=true;raindrops=[];critters=[];updateGameArea();});</script></body></html>
