<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Fluffy Cloud Jump Challenge</title><style>body { font-family: Arial, sans-serif; background: #a1c4fd; margin: 0; overflow: hidden; } #game { position: relative; width: 100%; height: 100vh; overflow: hidden; } .cloud { position: absolute; width: 100px; height: 60px; background: white; border-radius: 50%; box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); } .star { position: absolute; width: 20px; height: 20px; background: gold; border-radius: 50%; } #player { position: absolute; width: 50px; height: 50px; background: orange; border-radius: 50%; bottom: 0; left: calc(50% - 25px); } #score { position: absolute; top: 10px; left: 10px; font-size: 24px; color: #fff; } #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; font-size: 36px; color: #fff; }</style></head><body><div id='game'><div id='player'></div><div id='score'>Score: 0</div><div id='game-over'>Game Over!</div></div><script>const game = document.getElementById('game'); const player = document.getElementById('player'); const scoreDisplay = document.getElementById('score'); const gameOverDisplay = document.getElementById('game-over'); let score = 0; let isGameOver = false; const clouds = []; const stars = []; const lightning = []; function createCloud() { const cloud = document.createElement('div'); cloud.className = 'cloud'; cloud.style.left = Math.random() * (window.innerWidth - 100) + 'px'; cloud.style.top = Math.random() * (window.innerHeight - 100) + 'px'; game.appendChild(cloud); clouds.push(cloud); } function createStar() { const star = document.createElement('div'); star.className = 'star'; star.style.left = Math.random() * (window.innerWidth - 20) + 'px'; star.style.top = Math.random() * (window.innerHeight - 20) + 'px'; game.appendChild(star); stars.push(star); } function createLightning() { const bolt = document.createElement('div'); bolt.className = 'lightning'; bolt.style.left = Math.random() * (window.innerWidth - 100) + 'px'; bolt.style.top = Math.random() * (window.innerHeight - 50) + 'px'; bolt.style.background = 'yellow'; bolt.style.width = '10px'; bolt.style.height = '100px'; bolt.style.position = 'absolute'; bolt.style.transform = 'rotate(30deg)'; game.appendChild(bolt); lightning.push(bolt); } function jump() { if (isGameOver) return; player.style.bottom = (parseInt(player.style.bottom) + 150) + 'px'; setTimeout(() => { player.style.bottom = (parseInt(player.style.bottom) - 150) + 'px'; checkForStar(); checkForLightning(); }, 400); } function checkForStar() { stars.forEach((star, index) => { if (isElementInView(player, star)) { score++; scoreDisplay.innerText = 'Score: ' + score; star.remove(); stars.splice(index, 1); } }); } function checkForLightning() { lightning.forEach((bolt, index) => { if (isElementInView(player, bolt)) { gameOver(); } }); } function isElementInView(el1, el2) { const rect1 = el1.getBoundingClientRect(); const rect2 = el2.getBoundingClientRect(); return !(rect1.right < rect2.left || rect1.left > rect2.right || rect1.bottom < rect2.top || rect1.top > rect2.bottom); } function gameOver() { isGameOver = true; gameOverDisplay.style.display = 'block'; } function gameLoop() { if (isGameOver) return; if (Math.random() < 0.05) createCloud(); if (Math.random() < 0.02) createStar(); if (Math.random() < 0.01) createLightning(); requestAnimationFrame(gameLoop); } document.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); }); gameLoop(); </script></body></html>
