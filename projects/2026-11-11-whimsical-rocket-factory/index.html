<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Rocket Factory</title><style>body { font-family: Arial, sans-serif; background-color: #f0f8ff; text-align: center; } #game { border: 2px dashed #ff69b4; padding: 20px; margin: 20px auto; width: 400px; position: relative; } .rocket { position: absolute; width: 50px; height: 100px; background-color: #4caf50; border-radius: 5px; bottom: 0; left: calc(50% - 25px); } .cloud { position: absolute; width: 70px; height: 40px; background-color: #ffffff; border-radius: 30%; animation: float 4s linear infinite; } @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0); } } #score { margin-top: 20px; } </style></head><body><h1>Whimsical Rocket Factory</h1><div id='game'><div id='rocket' class='rocket'></div></div><div id='score'>Score: <span id='scoreValue'>0</span></div><button id='startBtn'>Start Game</button><script>let score = 0; let gameActive = false; const rocket = document.getElementById('rocket'); const scoreValue = document.getElementById('scoreValue'); const startBtn = document.getElementById('startBtn'); const gameArea = document.getElementById('game'); const clouds = []; function startGame() { score = 0; gameActive = true; scoreValue.textContent = score; document.getElementById('startBtn').disabled = true; createCloud(); } function moveCloud() { clouds.forEach((cloud, index) => { cloud.style.left = (parseInt(cloud.style.left) - 5) + 'px'; if (parseInt(cloud.style.left) < -70) { cloud.remove(); clouds.splice(index, 1); score++; scoreValue.textContent = score; } }); } function createCloud() { if (gameActive) { const cloud = document.createElement('div'); cloud.classList.add('cloud'); cloud.style.left = '100%'; cloud.style.top = Math.random() * gameArea.offsetHeight + 'px'; gameArea.appendChild(cloud); clouds.push(cloud); setTimeout(createCloud, 2000); } } function resetGame() { gameActive = false; clouds.forEach(cloud => cloud.remove()); clouds.length = 0; document.getElementById('startBtn').disabled = false; alert('Game Over! Your score is ' + score); } function checkCollision() { clouds.forEach(cloud => { const cloudRect = cloud.getBoundingClientRect(); const rocketRect = rocket.getBoundingClientRect(); if (!(cloudRect.right < rocketRect.left || cloudRect.left > rocketRect.right || cloudRect.bottom < rocketRect.top || cloudRect.top > rocketRect.bottom)) { resetGame(); } }); } function gameLoop() { if (gameActive) { moveCloud(); checkCollision(); requestAnimationFrame(gameLoop); } } startBtn.addEventListener('click', startGame); requestAnimationFrame(gameLoop); </script></body></html>
