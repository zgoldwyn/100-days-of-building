<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Ice Racer</title><style>body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #e0f7fa; font-family: Arial, sans-serif; } #gameCanvas { border: 2px solid #004d40; background: #ffffff; } h1 { text-align: center; } button { padding: 10px 20px; margin-top: 20px; background: #00695c; color: #ffffff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; } button:hover { background: #004d40; }</style></head><body><div><h1>Whimsical Ice Racer</h1><canvas id='gameCanvas' width='400' height='400'></canvas><button id='startButton'>Start Game</button><p id='scoreDisplay'>Score: 0</p></div><script>const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const skater = { x: 200, y: 350, width: 20, height: 20 }; const gems = []; const snowmen = []; let score = 0; let gameInterval; let isGameOver = false; function drawSkater() { ctx.fillStyle = '#ff4081'; ctx.fillRect(skater.x, skater.y, skater.width, skater.height); } function spawnGem() { const gemX = Math.random() * (canvas.width - 15); gems.push({ x: gemX, y: 0, width: 15, height: 15 }); } function spawnSnowman() { const snowmanX = Math.random() * (canvas.width - 30); snowmen.push({ x: snowmanX, y: 0, width: 30, height: 30 }); } function drawGems() { ctx.fillStyle = '#ffd600'; gems.forEach(gem => { ctx.fillRect(gem.x, gem.y, gem.width, gem.height); gem.y += 3; if (collision(gem, skater)) { score += 10; gems.splice(gems.indexOf(gem), 1); } }); } function drawSnowmen() { ctx.fillStyle = '#ffffff'; snowmen.forEach(snowman => { ctx.fillRect(snowman.x, snowman.y, snowman.width, snowman.height); snowman.y += 2; if (collision(snowman, skater)) { endGame(); } }); } function collision(a, b) { return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y; } function endGame() { clearInterval(gameInterval); isGameOver = true; alert('Game Over! Your score: ' + score); } function update() { ctx.clearRect(0, 0, canvas.width, canvas.height); drawSkater(); drawGems(); drawSnowmen(); } function moveSkater(e) { if (!isGameOver) { if (e.key === 'ArrowLeft' && skater.x > 0) skater.x -= 15; if (e.key === 'ArrowRight' && skater.x < canvas.width - skater.width) skater.x += 15; } } function startGame() { score = 0; gems.length = 0; snowmen.length = 0; isGameOver = false; gameInterval = setInterval(() => { update(); if (Math.random() < 0.02) spawnGem(); if (Math.random() < 0.02) spawnSnowman(); }, 100); document.getElementById('scoreDisplay').innerText = 'Score: ' + score; } document.getElementById('startButton').addEventListener('click', startGame); document.addEventListener('keydown', moveSkater); </script></body></html>
