<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Color Jump Challenge</title><style>body { font-family: Arial, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f8ff; } #gameArea { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: linear-gradient(to top, #87ceeb, #f0f8ff); } #player { position: absolute; bottom: 50px; width: 50px; height: 50px; border-radius: 50%; background-color: red; } .obstacle { position: absolute; width: 50px; height: 50px; bottom: 0; } h1 { position: absolute; top: 20px; left: 20px; color: #ff4500; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); } #score { position: absolute; top: 60px; left: 20px; font-size: 20px; color: #ff4500; }</style></head><body><div id="gameArea"><h1>Color Jump Challenge</h1><div id="score">Score: 0</div><div id="player"></div></div><script>const player = document.getElementById('player'); const scoreDisplay = document.getElementById('score'); const gameArea = document.getElementById('gameArea'); const colors = ['red', 'green', 'blue', 'yellow', 'purple']; let score = 0, interval, currentColor, jumping = false; function startGame() { document.addEventListener('keydown', jump); generateObstacle(); } function jump(event) { if (event.code === 'Space' && !jumping) { jumping = true; player.style.transition = 'bottom 0.5s'; player.style.bottom = '150px'; setTimeout(() => { player.style.bottom = '50px'; jumping = false; }, 500); } } function generateObstacle() { const obstacle = document.createElement('div'); const randomColor = colors[Math.floor(Math.random() * colors.length)]; obstacle.classList.add('obstacle'); obstacle.style.backgroundColor = randomColor; obstacle.style.left = '100vw'; obstacle.style.zIndex = '1'; gameArea.appendChild(obstacle); moveObstacle(obstacle, randomColor); } function moveObstacle(obstacle, color) { let position = gameArea.clientWidth; obstacle.style.left = position + 'px'; interval = setInterval(() => { position -= 5; obstacle.style.left = position + 'px'; if (position < 0) { clearInterval(interval); gameArea.removeChild(obstacle); generateObstacle(); } if (position < 60 && position > 10 && currentColor === color) { score++; scoreDisplay.innerText = 'Score: ' + score; gameArea.removeChild(obstacle); generateObstacle(); } if (position < 60 && position > 10 && currentColor !== color) { alert('Game Over! Your score: ' + score); location.reload(); } }, 30); } function changePlayerColor() { const randomIndex = Math.floor(Math.random() * colors.length); currentColor = colors[randomIndex]; player.style.backgroundColor = currentColor; } setInterval(changePlayerColor, 1000); startGame(); </script></body></html>
