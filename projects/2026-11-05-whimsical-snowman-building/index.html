<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Snowman Building</title><style>body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #add8e6; font-family: Arial, sans-serif; margin: 0; } #game { position: relative; width: 300px; height: 500px; background-color: #fff; border: 3px solid #000; overflow: hidden; } #snowman { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); } .snowball { width: 50px; height: 50px; background-color: #fff; border-radius: 50%; position: absolute; } #score { position: absolute; top: 10px; left: 10px; font-size: 20px; }</style></head><body><div id="game"><div id="score">Score: 0</div><div id="snowman"></div></div><script>let score = 0; let snowman = document.getElementById('snowman'); let gameArea = document.getElementById('game'); let fallingIceChunks = []; let gameInterval; let iceChunkInterval; let direction = 0; function createSnowball() { const snowball = document.createElement('div'); snowball.className = 'snowball'; snowball.style.bottom = `${score * 50}px`; snowball.style.left = '50%'; snowball.style.transform = 'translateX(-50%)'; snowman.appendChild(snowball); } function spawnIceChunks() { const iceChunk = document.createElement('div'); iceChunk.className = 'snowball'; iceChunk.style.width = '30px'; iceChunk.style.height = '30px'; iceChunk.style.backgroundColor = 'rgba(135,206,235,0.8)'; iceChunk.style.position = 'absolute'; iceChunk.style.top = '0'; iceChunk.style.left = `${Math.random() * (gameArea.clientWidth - 30)}px`; fallingIceChunks.push(iceChunk); gameArea.appendChild(iceChunk); } function moveIceChunks() { for (let i = 0; i < fallingIceChunks.length; i++) { const ice = fallingIceChunks[i]; ice.style.top = `${ice.offsetTop + 5}px`; if (ice.offsetTop > gameArea.clientHeight) { gameArea.removeChild(ice); fallingIceChunks.splice(i, 1); i--; } if (ice.offsetTop + 30 >= gameArea.clientHeight && direction === 0) { clearInterval(gameInterval); clearInterval(iceChunkInterval); alert('Game Over! Your score: ' + score); } if ((ice.offsetLeft < snowman.offsetLeft + 25) && (ice.offsetLeft + 30 > snowman.offsetLeft - 25) && (ice.offsetTop + 30 >= snowman.offsetTop)) { clearInterval(gameInterval); clearInterval(iceChunkInterval); alert('Game Over! Your score: ' + score); } } } function startGame() { createSnowball(); gameInterval = setInterval(() => { score++; document.getElementById('score').innerText = 'Score: ' + score; createSnowball(); }, 1000); iceChunkInterval = setInterval(spawnIceChunks, 2000); } document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { direction = -1; snowman.style.left = Math.max(0, snowman.offsetLeft - 10) + 'px'; } else if (e.key === 'ArrowRight') { direction = 1; snowman.style.left = Math.min(gameArea.clientWidth - 50, snowman.offsetLeft + 10) + 'px'; } }); startGame(); setInterval(moveIceChunks, 100); </script></body></html>
