<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Hopping Bunny Challenge</title><style>body {font-family: Arial, sans-serif; background-color: #f1f1f1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;}#game-container {position: relative; width: 100%; max-width: 600px; height: 400px; border: 2px solid #888; overflow: hidden; background-color: #e3f2fd;}#bunny {position: absolute; bottom: 10px; width: 50px; height: 50px; background-color: #ffcc80; border-radius: 50%; transition: transform 0.3s;}#carrot {position: absolute; width: 30px; height: 30px; background-color: #add8e6; border-radius: 50%; display: none;}#score {position: absolute; top: 10px; left: 10px; font-size: 18px; color: #333;}button {position: absolute; top: 10px; right: 10px; font-size: 18px; padding: 5px 10px;}</style></head><body><div id='game-container'><div id='bunny'></div><div id='score'>Score: 0</div><div id='carrot'></div><button onclick='startGame()'>Start Game</button></div><script>let bunny = document.getElementById('bunny');let carrot = document.getElementById('carrot');let scoreElement = document.getElementById('score');let gameContainer = document.getElementById('game-container');let score = 0;let gameInterval;let isJumping = false;function startGame() {score = 0;scoreElement.innerText = 'Score: ' + score;carrot.style.display = 'none';bunny.style.bottom = '10px';randomCarrotPosition();gameInterval = setInterval(gameLoop, 100);document.addEventListener('keydown', bunnyJump);}function gameLoop() {let carrotTop = parseInt(getComputedStyle(carrot).top);let bunnyBottom = parseInt(getComputedStyle(bunny).bottom);if (bunnyBottom < 50 && carrotTop < 50 && carrotTop > 0) {score++;scoreElement.innerText = 'Score: ' + score;randomCarrotPosition();}if (bunnyBottom <= 0) {endGame();}}function bunnyJump(event) {if (event.key === ' ') {if (!isJumping) {isJumping = true;bunny.style.transform = 'translateY(-100px)';setTimeout(() => {bunny.style.transform = 'translateY(0)';isJumping = false;}, 300);}}}function randomCarrotPosition() {let randomX = Math.floor(Math.random() * (gameContainer.clientWidth - 30));carrot.style.left = randomX + 'px';carrot.style.top = Math.floor(Math.random() * (gameContainer.clientHeight - 100)) + 'px';carrot.style.display = 'block';}function endGame() {clearInterval(gameInterval);alert('Game Over! Your score: ' + score);carrot.style.display = 'none';}document.addEventListener('DOMContentLoaded', () => {startGame();});</script></body></html>
