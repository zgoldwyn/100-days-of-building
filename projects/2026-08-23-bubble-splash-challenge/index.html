<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bubble Splash Challenge</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;background-color:#f0f8ff;flex-direction:column;}#game-area{display:grid;grid-template-columns:repeat(6, 1fr);gap:10px;} .bubble{width:50px;height:50px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:24px;cursor:pointer;transition:transform 0.2s;}h1,p{font-family:sans-serif;}#score{font-weight:bold;}</style></head><body><h1>Bubble Splash Challenge</h1><p>Pop as many bubbles as you can within the time limit!</p><div id="score">Score: 0</div><div id="timer">Time: 30</div><div id="game-area"></div><script>const gameArea = document.getElementById('game-area');const scoreDisplay = document.getElementById('score');const timerDisplay = document.getElementById('timer');let score = 0;let timeLeft = 30;let bubbleCount = 12;let bubbleInterval;function createBubbles() {gameArea.innerHTML = '';const bubbles = [];for (let i = 0; i < bubbleCount; i++) {bubbles.push(`<div class='bubble' style='background-color:${randomColor()};'>💧</div>`);}gameArea.innerHTML = bubbles.join('');const bubbleElements = document.querySelectorAll('.bubble');bubbleElements.forEach(bubble => {bubble.addEventListener('click', popBubble);});}function randomColor() {const letters = '0123456789ABCDEF';let color = '#';for (let i = 0; i < 6; i++) {color += letters[Math.floor(Math.random() * 16)];}return color;}function popBubble(event) {score++;scoreDisplay.innerText = 'Score: ' + score;event.target.style.display = 'none';}function updateTimer() {timeLeft--;timerDisplay.innerText='Time: ' + timeLeft;if (timeLeft <= 0) {clearInterval(bubbleInterval);alert('Time up! Your score is: ' + score);localStorage.setItem('highScore', Math.max(score, localStorage.getItem('highScore') || 0));}}function startGame() {createBubbles();bubbleInterval = setInterval(updateTimer, 1000);}document.addEventListener('DOMContentLoaded', () => {startGame();});</script></body></html>
