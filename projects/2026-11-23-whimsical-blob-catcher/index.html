<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Blob Catcher</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;background-color:#f3f3f3;margin:0;}#gameArea{position:relative;width:300px;height:500px;border:2px solid #333;background-color:#fff;overflow:hidden;}.blob{position:absolute;width:50px;height:50px;background-color:#6c63ff;border-radius:50%;}.shape{position:absolute;width:40px;height:40px;}.score{position:absolute;top:10px;left:10px;font-size:24px;font-weight:bold;}#startButton{position:absolute;bottom:10px;width:100%;padding:10px;background-color:#28a745;color:#fff;font-size:16px;border:none;cursor:pointer;}</style></head><body><div id='gameArea'><div class='score'>Score: 0</div><button id='startButton'>Start Game</button></div><script>const gameArea = document.getElementById('gameArea');const scoreDisplay = document.querySelector('.score');const startButton = document.getElementById('startButton');let score = 0;let isGameRunning = false;let blob;let fallingShape;function startGame(){score = 0;isGameRunning = true;scoreDisplay.textContent = 'Score: ' + score;startButton.style.display = 'none';createBlob();spawnShape();}function createBlob(){blob = document.createElement('div');blob.className = 'blob';blob.style.left = '125px';gameArea.appendChild(blob;);document.addEventListener('mousemove',moveBlob);}function spawnShape(){if(!isGameRunning)return;const shapeTypes = ['circle','square'];const shapeType = shapeTypes[Math.floor(Math.random()*shapeTypes.length)];fallingShape = document.createElement('div');fallingShape.className = 'shape';fallingShape.style.left = Math.random() * 260 + 'px';fallingShape.style.top = '0px';fallingShape.style.backgroundColor = shapeType === 'circle' ? 'red' : 'blue';gameArea.appendChild(fallingShape);fallingShape.animate([{top: '0px'},{top: '500px'}],{duration: 2000,easing: 'linear',fill: 'forwards'});fallingShape.addEventListener('animationend',shapeFallEnd);}function moveBlob(event){const mouseX = event.clientX - gameArea.getBoundingClientRect().left;blob.style.left = mouseX - 25 + 'px';}function shapeFallEnd(){if(isGameRunning){if(fallingShape.style.backgroundColor === 'red'){score++;scoreDisplay.textContent = 'Score: ' + score;}else{alert('Game Over! Final Score: ' + score);isGameRunning = false;document.removeEventListener('mousemove',moveBlob);startButton.style.display = 'block';}fallingShape.remove();spawnShape();}}startButton.addEventListener('click',startGame);</script></body></html>
