<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Sound Symphony</title><style>body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fafafa; } .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; } .tile { width: 80px; height: 80px; border: 2px solid #333; cursor: pointer; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 24px; } .red { background-color: #e57373; } .green { background-color: #81c784; } .blue { background-color: #64b5f6; } .yellow { background-color: #ffe082; } .purple { background-color: #ba68c8; } .cyan { background-color: #4dd0e1; } .orange { background-color: #ffb74d; } .pink { background-color: #f48fb1; }</style></head><body><div class='grid'><div class='tile red' data-note='C'>C</div><div class='tile green' data-note='D'>D</div><div class='tile blue' data-note='E'>E</div><div class='tile yellow' data-note='F'>F</div><div class='tile purple' data-note='G'>G</div><div class='tile cyan' data-note='A'>A</div><div class='tile orange' data-note='B'>B</div><div class='tile pink' data-note='C5'>C5</div></div><script>const tiles = document.querySelectorAll('.tile'); function playSound(note) { const audio = new Audio(); audio.src = 'data:audio/wav;base64,UklGRjwAAABXQVZFZm10IBAAAAABAAEAAQAAeAABABAAAAABAAEAAQAAewAAAABAAAAAAQAAeAAQAAAAAAQAAAAAAAADifQAAABQAAAAAAAAAAAAAAwAAAAAAFAAAAAAAACAAAAAAMAAAAAB4AAQAAeAABAAQAAQAAQQAFAAAAAAAABAABAQEAAQcAAIAAAQAAAABAAAAAAEAAAEAAEAAABZBgAA' + note.charCodeAt(0); audio.play(); } tiles.forEach(tile => tile.addEventListener('click', () => { playSound(tile.dataset.note); }));</script></body></html>
