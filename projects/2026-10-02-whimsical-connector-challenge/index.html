<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Connector Challenge</title><style>body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; justify-content: center; background-color: #f0f8ff; } canvas { border: 2px solid #4a90e2; border-radius: 10px; } #score { font-size: 24px; margin: 20px; } #start-btn { padding: 10px 20px; font-size: 18px; cursor: pointer; background-color: #4a90e2; color: white; border: none; border-radius: 5px; } #start-btn:hover { background-color: #357ab8; }</style></head><body><h1>Whimsical Connector Challenge</h1><div id='score'>Score: 0</div><button id='start-btn'>Start Game</button><canvas id='gameCanvas' width='500' height='500'></canvas><script>const canvas = document.getElementById('gameCanvas');const context = canvas.getContext('2d');let score = 0;let dots = [];let timer;let gameActive = false;function startGame() { score = 0; dots = []; gameActive = true; document.getElementById('score').innerText = 'Score: ' + score; generateDots(); draw(); manageTimer(); }function manageTimer() { let timeLeft = 30; timer = setInterval(() => { timeLeft--; if (timeLeft <= 0) { endGame(); } }, 1000); }function generateDots() { for (let i = 0; i < 5; i++) { const x = Math.random() * 480 + 10; const y = Math.random() * 480 + 10; const color = '#' + Math.floor(Math.random()*16777215).toString(16); dots.push({ x, y, color }); } }function draw() { context.clearRect(0, 0, canvas.width, canvas.height); dots.forEach(dot => { context.beginPath(); context.arc(dot.x, dot.y, 10, 0, Math.PI * 2); context.fillStyle = dot.color; context.fill(); context.closePath(); }); }canvas.addEventListener('click', (event) => { const rect = canvas.getBoundingClientRect(); const mouseX = event.clientX - rect.left; const mouseY = event.clientY - rect.top; const clickedDot = dots.find(dot => Math.sqrt(Math.pow(dot.x - mouseX, 2) + Math.pow(dot.y - mouseY, 2)) < 10); if (clickedDot) { score++; dots = dots.filter(dot => dot !== clickedDot); generateDots(); document.getElementById('score').innerText = 'Score: ' + score; draw(); } });function endGame() { gameActive = false; clearInterval(timer); alert('Game Over! Your score: ' + score); }document.getElementById('start-btn').addEventListener('click', startGame);</script></body></html>
