<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Wind Chime Symphony</title><style>body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: linear-gradient(to top, #abcdef, #123456); font-family: Arial, sans-serif; } #container { text-align: center; } #chimes { display: flex; justify-content: space-around; width: 80%; margin-top: 20px; } .chime { width: 60px; height: 150px; background: #f0f0f0; border: 2px solid #bbb; border-radius: 10px; position: relative; cursor: pointer; transition: background 0.3s; } .chime:hover { background: #e0e0e0; } .chime:active { background: #ccc; } #score { font-size: 24px; margin-top: 20px; } </style></head><body><div id='container'><h1>Whimsical Wind Chime Symphony</h1><p>Tap on the wind chimes to create a melody!</p><div id='chimes'><div class='chime' data-sound='sound1.mp3'></div><div class='chime' data-sound='sound2.mp3'></div><div class='chime' data-sound='sound3.mp3'></div><div class='chime' data-sound='sound4.mp3'></div></div><div id='score'>Score: 0</div></div><script>const chimes = document.querySelectorAll('.chime'); const scoreDisplay = document.getElementById('score'); let score = 0; chimes.forEach(chime => { chime.addEventListener('click', () => { const sound = new Audio(chime.dataset.sound); sound.play(); score++; scoreDisplay.textContent = 'Score: ' + score; chime.style.transform = 'translateY(-10px)'; setTimeout(() => { chime.style.transform = 'translateY(0)'; }, 300); }); });</script></body></html>
