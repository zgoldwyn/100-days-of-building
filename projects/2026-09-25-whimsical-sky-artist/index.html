<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Sky Artist</title><style>body{font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background: linear-gradient(to top, #87CEFA, #E6E6FA);}canvas{border: 2px solid #fff; border-radius: 15px;}#controls{margin-top: 15px;}button{padding: 10px 15px; margin: 5px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer;}#colorPicker{width: 60px; height: 30px; border: 2px solid #fff; border-radius: 5px;}</style></head><body><h1>Whimsical Sky Artist</h1><p>Use the brush to paint clouds and sprinkle stars to create your own sky art!</p><canvas id="canvas" width="600" height="400"></canvas><div id="controls"><input type="color" id="colorPicker" value="#FFFFFF"><button id="clearBtn">Clear Sky</button><button id="saveBtn">Save Art</button></div><script>const canvas=document.getElementById("canvas");const ctx=canvas.getContext("2d");let painting=false;let brushColor="white";const drawCloud=(x,y)=>{ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.fillStyle=brushColor;ctx.fill();ctx.closePath();};const placeStar=(x,y)=>{ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<5;i++){ctx.lineTo(x+Math.cos((i*2*Math.PI)/5)*10,y+Math.sin((i*2*Math.PI)/5)*10);ctx.lineTo(x+Math.cos(((i*2+1)*Math.PI)/5)*5,y+Math.sin(((i*2+1)*Math.PI)/5)*5);}ctx.fillStyle="gold";ctx.fill();ctx.closePath();};const startPosition=(e)=>{painting=true;draw(e);};const endPosition=()=>{painting=false;ctx.beginPath();};const draw=(e)=>{if(!painting)return;const rect=canvas.getBoundingClientRect();const x=e.clientX-rect.left;const y=e.clientY-rect.top;drawCloud(x,y);};const colorPicker=document.getElementById("colorPicker");colorPicker.addEventListener("input",(e)=>{brushColor=e.target.value;});canvas.addEventListener("mousedown",startPosition);canvas.addEventListener("mouseup",endPosition);canvas.addEventListener("mousemove",draw);canvas.addEventListener("click",(e)=>{placeStar(e.clientX-canvas.getBoundingClientRect().left,e.clientY-canvas.getBoundingClientRect().top);});document.getElementById("clearBtn").addEventListener("click",()=>{ctx.clearRect(0,0,canvas.width,canvas.height);});document.getElementById("saveBtn").addEventListener("click",()=>{const link=document.createElement('a');link.download='my-sky-art.png';link.href=canvas.toDataURL();link.click();});</script></body></html>
