<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Fluffy Bunny Time Challenge</title><style>body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #b3e0ff; } #game-container { position: relative; width: 400px; height: 600px; border: 2px solid #fff; overflow: hidden; background: linear-gradient(to bottom, #cce7ff, #ffffff); } .platform { position: absolute; width: 100px; height: 20px; background-color: #ffcc80; border-radius: 10px; } #bunny { position: absolute; width: 50px; height: 50px; background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUA
AAABCAIAAACZhkTzAAAAAElFTkSuQmCC'); background-size: cover; } h1 { text-align: center; } #score { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 20px; } #timer { position: absolute; top: 10px; right: 10px; color: #fff; font-size: 20px; }</style></head><body><div id='game-container'><div id='score'>Score: 0</div><div id='timer'>Time: 30</div><div id='bunny'></div></div><h1>Fluffy Bunny Time Challenge</h1><script>const gameContainer = document.getElementById('game-container'); const bunny = document.getElementById('bunny'); const scoreDisplay = document.getElementById('score'); const timerDisplay = document.getElementById('timer'); let score = 0; let timeLeft = 30; let timer; let platforms = []; const startGame = () => { createPlatforms(); document.addEventListener('keydown', jump); timer = setInterval(update, 1000); }; const createPlatforms = () => { for (let i = 0; i < 5; i++) { const platform = document.createElement('div'); platform.classList.add('platform'); platform.style.bottom = (i * 120) + 'px'; platform.style.left = Math.random() * (gameContainer.clientWidth - 100) + 'px'; platforms.push(platform); gameContainer.appendChild(platform); } }; const jump = (e) => { if (e.keyCode === 32) { bunny.style.bottom = '100px'; setTimeout(() => { bunny.style.bottom = '0'; score++; scoreDisplay.innerText = 'Score: ' + score; }, 300); } }; const update = () => { timeLeft--; timerDisplay.innerText = 'Time: ' + timeLeft; if (timeLeft <= 0) { clearInterval(timer); alert('Game Over! Your score is: ' + score); document.location.reload(); } }; startGame(); </script></body></html>
