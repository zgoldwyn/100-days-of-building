<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Music Matching Mosaic</title><style>body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f0f0; } h1 { color: #333; } .grid { display: grid; grid-template-columns: repeat(4, 100px); grid-gap: 10px; } .tile { width: 100px; height: 100px; background-color: #aeeeee; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border-radius: 10px; transition: transform 0.1s; } .tile:hover { transform: scale(1.1); } .matched { background-color: #90ee90; } .disabled { background-color: #d3d3d3; cursor: not-allowed; }</style></head><body><h1>Music Matching Mosaic</h1><div class='grid' id='grid'></div><p id='message'></p><button id='reset'>Reset</button><script>const melodies = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H']; const grid = document.getElementById('grid'); const messageEl = document.getElementById('message'); const resetButton = document.getElementById('reset'); let firstTile = null; let secondTile = null; let hasFlippedTile = false; let lockBoard = false; let matches = 0; let totalPairs = 4; function createGrid() { const shuffledMelodies = [...melodies.slice(0, totalPairs), ...melodies.slice(0, totalPairs)].sort(() => 0.5 - Math.random()); shuffledMelodies.forEach(melody => { const tile = document.createElement('div'); tile.textContent = melody; tile.classList.add('tile'); tile.addEventListener('click', flipTile); grid.appendChild(tile); }); } function flipTile() { if (lockBoard || this === firstTile) return; this.classList.add('matched'); this.style.pointerEvents = 'none'; if (!hasFlippedTile) { hasFlippedTile = true; firstTile = this; playSound(firstTile.textContent); } else { secondTile = this; playSound(secondTile.textContent); checkForMatch(); } } function checkForMatch() { const isMatch = firstTile.textContent === secondTile.textContent; if (isMatch) { matches++; resetTiles(); if (matches === totalPairs) setTimeout(() => alert('You matched all pairs!'), 500); } else { lockBoard = true; setTimeout(() => { firstTile.classList.remove('matched'); secondTile.classList.remove('matched'); firstTile.style.pointerEvents = ''; secondTile.style.pointerEvents = ''; resetTiles(); }, 1000); } } function resetTiles() { [hasFlippedTile, lockBoard] = [false, false]; [firstTile, secondTile] = [null, null]; } function playSound(note) { const audio = new Audio('data:audio/wav;base64,UklGRhYBAABXQVZFZm10IBAAAAABABAgAABAAUAAABAAEAgAY+' + note.charCodeAt(0) + 'A'); audio.play(); } resetButton.addEventListener('click', () => { grid.innerHTML = ''; matches = 0; createGrid(); messageEl.textContent = ''; }); createGrid(); </script></body></html>
