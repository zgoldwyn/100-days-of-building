<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Totem Creator</title><style>body{font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background-color:#f3f3f3;margin:0}#game{display:flex;flex-direction:column;align-items:center}#canvas{border:2px solid #ccc;margin:10px;position:relative;}`.totem{position:absolute;cursor:pointer;transition:transform 0.2s;z-index:99;}.start-btn{padding:10px 20px;font-size:16px;cursor:pointer;}</style></head><body><div id='game'><h1>Whimsical Totem Creator</h1><button class='start-btn' id='start'>Start Game</button><div id='canvas' style='width:300px;height:400px;'><div id='totem'></div></div><div id='timer' style='font-size:24px;'></div><div id='score' style='font-size:24px;'>Score: 0</div></div><script>const colors=['#ff5733','#33ff57','#3357ff','#ff33a1','#f7ff33'];let score=0,timer,interval;document.getElementById('start').onclick=function(){startGame();};function startGame(){score=0;clearInterval(timer);let timeLeft=30;const displayTimer=document.getElementById('timer');displayTimer.textContent='Time: '+timeLeft;interval=setInterval(()=>{timeLeft--;displayTimer.textContent='Time: '+timeLeft;if(timeLeft<=0){clearInterval(interval);alert('Time is up! Your total score is: '+score);}},1000);createTotem();}function createTotem(){const totem=document.getElementById('totem');totem.innerHTML='';const shapeCount=Math.floor(Math.random()*5)+1;for(let i=0;i<shapeCount;i++){const shape=document.createElement('div');shape.className='totem';shape.style.width=(Math.random()*80+20)+'px';shape.style.height=(Math.random()*80+20)+'px';shape.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];shape.style.bottom=(i*30)+'px';shape.style.left=(Math.random()*200)+'px';shape.onclick=function(){score++;document.getElementById('score').textContent='Score: '+score;this.style.transform='scale(1.1)';setTimeout(()=>{this.style.transform='scale(1)';},200);};totem.appendChild(shape);}setTimeout(createTotem,2000);} </script></div></body></html>
