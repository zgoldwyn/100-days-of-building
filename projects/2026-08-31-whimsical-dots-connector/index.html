<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Dots Connector</title><style>body { font-family: Arial, sans-serif; background-color: #f7f7f7; text-align: center; } canvas { border: 1px solid #4CAF50; margin: 10px; } #game-controls { margin: 20px; } #score, #timer { font-size: 20px; } #start-btn { padding: 10px 20px; font-size: 16px; } </style></head><body><h1>Whimsical Dots Connector</h1><p>Connect the dots to create beautiful patterns while avoiding obstacles! Try to do it before time runs out!</p><div id="game-controls"><button id="start-btn">Start Game</button></div><div id="score">Score: 0</div><div id="timer">Time: 30</div><canvas id="gameCanvas" width="400" height="400"></canvas><script>const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); let dots = []; let score = 0; let timeLeft = 30; let gameInterval; let timerInterval; let gameActive = false; function randomPosition() { return { x: Math.random() * canvas.width, y: Math.random() * canvas.height }; } function drawDot(dot) { ctx.beginPath(); ctx.arc(dot.x, dot.y, 5, 0, Math.PI * 2); ctx.fillStyle = 'blue'; ctx.fill(); ctx.closePath(); } function drawObstacle() { ctx.fillStyle = 'red'; ctx.fillRect(Math.random() * (canvas.width - 50), Math.random() * (canvas.height - 50), 50, 50); } function startGame() { score = 0; timeLeft = 30; gameActive = true; dots = Array.from({ length: 5 }, randomPosition); ctx.clearRect(0, 0, canvas.width, canvas.height); dots.forEach(drawDot); drawObstacle(); document.getElementById('score').innerText = 'Score: ' + score; document.getElementById('timer').innerText = 'Time: ' + timeLeft; gameInterval = setInterval(spawnObstacles, 2000); timerInterval = setInterval(updateTimer, 1000); } function updateTimer() { if (timeLeft === 0) { endGame(); } else { timeLeft--; document.getElementById('timer').innerText = 'Time: ' + timeLeft; } } function endGame() { clearInterval(gameInterval); clearInterval(timerInterval); gameActive = false; alert('Game Over! Your final score is: ' + score); } function spawnObstacles() { ctx.clearRect(0, 0, canvas.width, canvas.height); dots.forEach(drawDot); drawObstacle(); } canvas.addEventListener('click', (e) => { if (!gameActive) return; const rect = canvas.getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top; const hitDot = dots.find(dot => Math.hypot(dot.x - x, dot.y - y) < 5); if (hitDot) { score++; dots = dots.filter(dot => dot !== hitDot); drawDot(hitDot); document.getElementById('score').innerText = 'Score: ' + score; if (dots.length === 0) { clearInterval(gameInterval); alert('All dots connected! Your score is: ' + score); endGame(); } } }); document.getElementById('start-btn').onclick = startGame;</script></body></html>
