<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Shape Shifter Challenge</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #gameArea {
            position: relative;
            width: 300px;
            height: 300px;
            border: 2px solid #333;
            overflow: hidden;
            background-color: white;
        }
        .shape {
            position: absolute;
            border: 2px solid transparent;
        }
        #targetShape {
            margin: 20px;
            font-size: 42px;
            text-align: center;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #score {
            margin-top: 20px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <h1>Shape Shifter Challenge</h1>
    <div id='targetShape'></div>
    <div id='gameArea'></div>
    <div id='score'>Score: 0</div>
    <button id='startButton'>Start Game</button>
    <script>
        const shapes = ['🔴', '🟠', '🟡', '🟢', '🔵', '🟣', '⚫', '⚪'];
        const gameArea = document.getElementById('gameArea');
        const targetShapeDiv = document.getElementById('targetShape');
        const scoreDiv = document.getElementById('score');
        const startButton = document.getElementById('startButton');
        let score = 0;
        let timer;
        let gameActive = false;

        startButton.addEventListener('click', () => {
            gameActive = true;
            score = 0;
            scoreDiv.textContent = 'Score: ' + score;
            startGame();
        });

        function startGame() {
            resetGameArea();
            const targetShape = pickRandomShape();
            targetShapeDiv.textContent = targetShape;
            timer = setInterval(() => {
                if (gameActive) {
                    spawnShape();
                }
            }, 1000);
            setTimeout(() => {
                endGame();
            }, 30000); // 30 seconds game duration
        }

        function pickRandomShape() {
            return shapes[Math.floor(Math.random() * shapes.length)];
        }

        function spawnShape() {
            const shape = document.createElement('div');
            shape.textContent = pickRandomShape();
            shape.classList.add('shape');
            shape.style.width = '40px';
            shape.style.height = '40px';
            shape.style.borderColor = 'black';
            shape.style.top = Math.random() * 260 + 'px';
            shape.style.left = Math.random() * 260 + 'px';
            shape.addEventListener('click', () => handleShapeClick(shape));
            gameArea.appendChild(shape);

            setTimeout(() => {
                if (gameActive) {
                    shape.remove();
                }
            }, 2000); // Shape disappears after 2 seconds
        }

        function handleShapeClick(shape) {
            if (gameActive) {
                const clickedShape = shape.textContent;
                const targetShape = targetShapeDiv.textContent;
                if (clickedShape === targetShape) {
                    score++;
                    scoreDiv.textContent = 'Score: ' + score;
                }
                shape.remove();
            }
        }

        function endGame() {
            clearInterval(timer);
            gameActive = false;
            alert('Game over! Your score: ' + score);
            resetGameArea();
        }

        function resetGameArea() {
            while (gameArea.firstChild) {
                gameArea.removeChild(gameArea.firstChild);
            }
            targetShapeDiv.textContent = '';
        }
    </script>
</body>
</html>
