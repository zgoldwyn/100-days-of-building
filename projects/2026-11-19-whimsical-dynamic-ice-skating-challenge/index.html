<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Dynamic Ice Skating Challenge</title><style>body{font-family:Arial,sans-serif;background-color:#ADD8E6;margin:0;padding:20px}.game-container{position:relative;width:100%;max-width:600px;height:400px;margin:auto;border:2px solid #FFFFFF;border-radius:10px;overflow:hidden;background:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAABRAAAACCAIAAADsc2MRAAAAAXRFWHRTb2Z0d2FyZQBNYWdpY05QRSBNZWt3aXJlIE1pbmltYWxhdGVyIHZlciAxLjMuMTgaRFiQAAAAGElEQVR42mL0hZ6AQAAPwJdAhaxFcCDAHAAAArQMWuWixsMAAAAABJRU5ErkJggg==' ) no-repeat;background-size:cover;}.star{width:20px;height:20px;background-color:gold;position:absolute;border-radius:50%;}.ice-skater{width:50px;height:50px;background-color:red;position:absolute;bottom:10px;l:left:50%;transform:translate(-50%,-100%);border-radius:50%;animation:skate 1s infinite;}.obstacle{width:30px;height:30px;background-color:black;position:absolute;}</style></head><body><h1 style='text-align:center;'>Whimsical Dynamic Ice Skating Challenge</h1><div class='game-container' id='gameContainer'><div class='ice-skater' id='skater'></div></div><h2 style='text-align:center;' id='score'>Score: 0</h2><script>let score = 0;const skater = document.getElementById('skater');const gameContainer = document.getElementById('gameContainer');const scoreDisplay = document.getElementById('score');let isJumping = false;function jump() {if(!isJumping) {isJumping = true;skater.style.bottom = '100px';setTimeout(() => {skater.style.bottom = '10px';isJumping = false;}, 500);}}function addStar() {const star = document.createElement('div');star.classList.add('star');star.style.left = Math.random() * 100 + '%';star.style.bottom = '370px';gameContainer.appendChild(star);let fallInterval = setInterval(() => {if (parseInt(star.style.bottom) < -20) {clearInterval(fallInterval);gameContainer.removeChild(star);score++;scoreDisplay.innerText = 'Score: ' + score;} else {star.style.bottom = parseInt(star.style.bottom) - 2 + 'px';}}, 20);}function addObstacle() {const obstacle = document.createElement('div');obstacle.classList.add('obstacle');obstacle.style.left = Math.random() * 100 + '%';obstacle.style.bottom = '400px';gameContainer.appendChild(obstacle);let moveInterval = setInterval(() => {if (parseInt(obstacle.style.bottom) < -30) {clearInterval(moveInterval);gameContainer.removeChild(obstacle);} else {!isJumping && parseInt(obstacle.style.bottom) < 40 && Math.abs(parseFloat(obstacle.style.left) - parseFloat(skater.style.left)) < 30 ? (alert('Game Over! Your score was: ' + score), clearInterval(moveInterval), clearInterval(fallInterval)) : obstacle.style.bottom = parseInt(obstacle.style.bottom) - 5 + 'px';}}, 20);}document.addEventListener('keydown', (event) => {if (event.code === 'Space') jump();});setInterval(addStar, 1200);setInterval(addObstacle, 2000);</script></body></html>
