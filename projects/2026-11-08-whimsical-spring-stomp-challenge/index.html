<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Spring Stomp Challenge</title><style>body{font-family:Arial,sans-serif;background-color:#f0f8ff;text-align:center;margin:0;padding:0}.container{position:relative;width:100%;max-width:800px;margin:auto}.spring{width:80px;height:20px;background-color:#9cda9a;position:absolute;border-radius:10px;bottom:50px;transition:transform 0.2s;z-index:1}.star{width:20px;height:20px;background-color:gold;border-radius:50%;position:absolute;z-index:2;display:none}.bouncyCritter{width:30px;height:30px;background-color:salmon;border-radius:50%;position:absolute;animation:move 2s linear infinite;z-index:3}@keyframes move{0%{transform:translateY(0)}50%{transform:translateY(-30px)}100%{transform:translateY(0)}}.hidden{display:none}#scoreboard{font-size:24px;position:relative;top:20px;z-index:2}#startBtn{padding:10px 20px;border:none;background-color:#4caf50;color:white;font-size:16px;border-radius:5px;cursor:pointer}</style></head><body><h1>Whimsical Spring Stomp Challenge</h1><div id='scoreboard'>Score: <span id='score'>0</span></div><button id='startBtn'>Start Game</button><div class='container' id='gameArea'></div><script>let score=0;let gameInterval;const gameArea=document.getElementById('gameArea');const scoreDisplay=document.getElementById('score');const startBtn=document.getElementById('startBtn');startBtn.onclick=function(){startGame()};function startGame(){score=0;scoreDisplay.textContent=score;gameArea.innerHTML='';startBtn.classList.add('hidden');createSprings();createStars();createBouncyCritters();gameInterval=setInterval(runGame,100);}function createSprings(){for(let i=0;i<5;i++){const spring=document.createElement('div');spring.className='spring';spring.style.left=(i*160)+'px';gameArea.appendChild(spring);spring.addEventListener('click',()=>{jump(spring);});}}function createStars(){setInterval(()=>{const star=document.createElement('div');star.className='star';star.style.left=Math.random()*700+'px';star.style.bottom='100px';star.style.display='block';gameArea.appendChild(star);setTimeout(()=>{star.remove();},2000);star.addEventListener('animationend',()=>{star.style.display='none';});},1500);}function createBouncyCritters(){setInterval(()=>{const critter=document.createElement('div');critter.className='bouncyCritter';critter.style.left=Math.random()*700+'px';gameArea.appendChild(critter);setTimeout(()=>{critter.remove();},2000);},2000);}function jump(spring){spring.style.transform='translateY(-50px)';setTimeout(()=>{spring.style.transform='translateY(0)';},200);let stars=document.querySelectorAll('.star');stars.forEach(star=>{if(star.offsetLeft<spring.offsetLeft+80&&star.offsetLeft>spring.offsetLeft){score++;star.style.display='none';star.remove();scoreDisplay.textContent=score;}});}function runGame(){if(score>=10){clearInterval(gameInterval);alert('You win! Your score is: '+score);resetGame();}else if(score<0){clearInterval(gameInterval);alert('Game over! Your score is: '+score);resetGame();}}function resetGame(){gameArea.innerHTML='';startBtn.classList.remove('hidden');}};</script></body></html>
