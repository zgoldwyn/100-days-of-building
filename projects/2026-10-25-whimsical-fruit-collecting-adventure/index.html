<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Fruit Collecting Adventure</title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;overflow:hidden}#gameContainer{width:100vw;height:100vh;position:relative;background-color:#87CEEB;display:flex;justify-content:center;align-items:flex-end}#fruit{position:absolute;width:50px;height:50px;background-color:red;border-radius:50%;display:none;transition:transform 0.5s}#cloud{position:absolute;width:100px;height:60px;background-color:white;border-radius:50%;opacity:0.8;display:none}#score{position:absolute;top:10px;font-size:24px;color:white}</style></head><body><div id='gameContainer'><div id='fruit'></div><div id='cloud'></div><div id='score'>Score: 0</div></div><script>let score=0;let gameContainer=document.getElementById('gameContainer');let fruit=document.getElementById('fruit');let cloud=document.getElementById('cloud');let scoreDisplay=document.getElementById('score');let fruitFallInterval=setInterval(dropFruit,1000);let cloudFallInterval=setInterval(dropCloud,1500);document.addEventListener('mousemove',moveFruit);function moveFruit(event){fruit.style.transform='translate('+event.clientX+'px,'+(window.innerHeight-100)+'px)';}function dropFruit(){let randomX=Math.random()*(window.innerWidth-50);fruit.style.left=randomX+'px';fruit.style.display='block';fruit.style.top='-50px';fruit.style.transition='top 1s';fruit.style.top=window.innerHeight+'px';setTimeout(function(){if(fruit.offsetTop>window.innerHeight){fruit.style.display='none';}},2000);document.body.addEventListener('click',function(){if(fruit.style.display==='block'){score++;scoreDisplay.innerText='Score: '+score;fruit.style.display='none';}});}function dropCloud(){let randomX=Math.random()*(window.innerWidth-100);cloud.style.left=randomX+'px';cloud.style.display='block';cloud.style.top='-60px';cloud.style.transition='top 1s';cloud.style.top=window.innerHeight+'px';setTimeout(function(){if(cloud.offsetTop>window.innerHeight){cloud.style.display='none';}},3000);if(cloud.offsetTop>fruit.offsetTop-50&&cloud.offsetLeft<fruit.offsetLeft+50&&cloud.offsetLeft+100>fruit.offsetLeft){gameOver();}}function gameOver(){clearInterval(fruitFallInterval);clearInterval(cloudFallInterval);alert('Game Over! Your score was: '+score);location.reload();}</script></body></html>
