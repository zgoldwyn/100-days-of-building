<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Rocket Color Mission</title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;background-color:#f0f8ff;flex-direction:column;}#gameCanvas{border:2px solid #333;background-color:#e0ffff;position:relative;}h1{text-align:center;color:#333;}#scoreboard{font-size:1.2em;color:#333;}</style></head><body><h1>Whimsical Rocket Color Mission</h1><div id='scoreboard'>Score: <span id='score'>0</span></div><canvas id='gameCanvas' width='600' height='400'></canvas><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');const colors=['red','green','blue','yellow','purple'];let rocket={x:300,y:350,width:30,height:40};let stars=[];let score=0;let currentColor='';let gameInterval;let timer;let timeLimit=10;const numberOfStars=10;function drawRocket(){ctx.fillStyle='black';ctx.fillRect(rocket.x,rocket.y,rocket.width,rocket.height);ctx.fillStyle=currentColor;ctx.fillRect(rocket.x,rocket.y,rocket.width,rocket.height);ctx.fill();}function createStars(){stars=[];for(let i=0;i<numberOfStars;i++){let star={x:Math.random()*canvas.width,y:Math.random()*canvas.height,width:20,height:20,color:colors[Math.floor(Math.random()*colors.length)]};stars.push(star);}}function drawStars(){for(let star of stars){ctx.fillStyle=star.color;ctx.fillRect(star.x,star.y,star.width,star.height);}}function updateScore(){document.getElementById('score').innerText=score;}function collisionDetection(){stars=stars.filter(star=>{if(rocket.x<star.x+star.width&&rocket.x+rocket.width>star.x&&rocket.y<star.y+star.height&&rocket.y+rocket.height>star.y){if(star.color===currentColor){score+=10;}else{score-=5;}return false;}return true;});}function updateGameArea(){ctx.clearRect(0,0,canvas.width,canvas.height);drawRocket();drawStars();collisionDetection();updateScore();}function changeRocketColor(){currentColor=colors[Math.floor(Math.random()*colors.length)];}function startGame(){createStars();changeRocketColor();gameInterval=setInterval(updateGameArea,100);timer=setInterval(function(){if(timeLimit<=0){clearInterval(gameInterval);clearInterval(timer);alert('Game Over! Your Score: '+score);document.location.reload();}else{timeLimit-=1;}},1000);}addEventListener('keydown',function(event){if(event.key==='ArrowLeft'&&rocket.x>0){rocket.x-=15;}else if(event.key==='ArrowRight'&&rocket.x<canvas.width-rocket.width){rocket.x+=15;}else if(event.key==='ArrowUp'){changeRocketColor();}});startGame();</script></body></html>
