<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Glowing Spring Tap Dance</title><style>body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #282c34; font-family: Arial, sans-serif; } h1 { color: #61dafb; } .game-container { text-align: center; } .spring { width: 100px; height: 100px; border-radius: 50%; margin: 20px; display: inline-block; transition: transform 0.2s; } .hidden { display: none; } #start, #restart { background-color: #61dafb; color: #282c34; border: none; padding: 10px 20px; cursor: pointer; } #score { font-size: 24px; color: white; }</style></head><body><div class='game-container'><h1>Glowing Spring Tap Dance</h1><div id='score'>Score: 0</div><div id='springs'></div><button id='start'>Start Game</button><div id='game-over' class='hidden'><h2>Game Over!</h2><button id='restart'>Play Again</button></div></div><script>const springsColor = ['#ff4d4f', '#ffec3b', '#73d13d', '#40a9ff']; let score = 0; let activeSpring; let timer; function startGame() { score = 0; document.getElementById('score').innerText = 'Score: 0'; document.getElementById('game-over').classList.add('hidden'); const springsDiv = document.getElementById('springs'); springsDiv.innerHTML = ''; for (let i = 0; i < 4; i++) { const spring = document.createElement('div'); spring.className = 'spring'; spring.style.backgroundColor = springsColor[i]; spring.onclick = () => tapSpring(i); springsDiv.appendChild(spring); } nextSpring(); } function nextSpring() { activeSpring = Math.floor(Math.random() * 4); const springs = document.querySelectorAll('.spring'); springs.forEach((spring, index) => { spring.style.transform = ''; spring.style.opacity = '0.5'; if (index === activeSpring) { spring.style.opacity = '1'; } }); timer = setTimeout(() => { gameOver(); }, 2000); } function tapSpring(index) { if (index === activeSpring) { score++; document.getElementById('score').innerText = 'Score: ' + score; clearTimeout(timer); nextSpring(); } } function gameOver() { document.getElementById('game-over').classList.remove('hidden'); const springsDiv = document.getElementById('springs'); springsDiv.innerHTML = ''; } document.getElementById('start').onclick = startGame; document.getElementById('restart').onclick = startGame;</script></body></html>
