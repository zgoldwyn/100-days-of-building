<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Garden Gatherer</title><style>body { font-family: Arial, sans-serif; background-color: #fafafa; text-align: center; margin: 0; padding: 20px;} canvas { border: 1px solid #ccc; display: block; margin: 0 auto; } h1 { color: #4CAF50; } #score { font-size: 20px; } #startBtn { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; } #startBtn:hover { background-color: #45a049; }</style></head><body><h1>Whimsical Garden Gatherer</h1><canvas id='gameCanvas' width='800' height='400'></canvas><div id='score'>Score: 0</div><button id='startBtn'>Start Game</button><script>let canvas = document.getElementById('gameCanvas'); let ctx = canvas.getContext('2d'); let score = 0; let plants = []; let weeds = []; let gameInterval; let gameActive = false; class Plant { constructor(x, y) { this.x = x; this.y = y; this.width = 30; this.height = 30; this.color = '#4CAF50'; } draw() { ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.width, this.height); } } class Weed { constructor(x, y) { this.x = x; this.y = y; this.width = 20; this.height = 20; this.color = '#FF0000'; } draw() { ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.width, this.height); } } function startGame() { score = 0; plants = []; weeds = []; gameActive = true; document.getElementById('score').innerText = 'Score: ' + score; gameInterval = setInterval(gameLoop, 100); createWeeds(); } function endGame() { clearInterval(gameInterval); gameActive = false; alert('Game Over! Your score: ' + score); } function createWeeds() { for (let i = 0; i < 5; i++) { weeds.push(new Weed(Math.random() * (canvas.width - 20), Math.random() * (canvas.height - 20))); } } function gameLoop() { ctx.clearRect(0, 0, canvas.width, canvas.height); if (Math.random() < 0.01) { plants.push(new Plant(Math.random() * (canvas.width - 30), canvas.height - 30)); } weeds.forEach(weed => weed.draw()); plants.forEach((plant, index) => { plant.draw(); if (plant.y < canvas.height - 30) { plant.y += 2; } else { endGame(); } if (collides(plant, weeds)) { endGame(); } }); } function collides(plant, weeds) { return weeds.some(weed => plant.x < weed.x + weed.width && plant.x + plant.width > weed.x && plant.y < weed.y + weed.height && plant.y + plant.height > weed.y); } document.getElementById('startBtn').onclick = function() { startGame(); }; canvas.addEventListener('click', function(event) { if (!gameActive) return; const rect = canvas.getBoundingClientRect(); const mouseX = event.clientX - rect.left; const mouseY = event.clientY - rect.top; plants.forEach((plant, index) => { if (mouseX > plant.x && mouseX < plant.x + plant.width && mouseY > plant.y && mouseY < plant.y + plant.height) { plants.splice(index, 1); score += 10; document.getElementById('score').innerText = 'Score: ' + score; } }); }); </script></body></html>
