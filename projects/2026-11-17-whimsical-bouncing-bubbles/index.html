<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Bubble Bounce</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#f0f8ff;font-family:sans-serif;}h1{font-size:2rem;}#gameArea{position:relative;width:300px;height:500px;border:2px solid #444;background-color:white;overflow:hidden;}#bubble{position:absolute;width:50px;height:50px;border-radius:50%;background-color:lightblue;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;user-select:none;}#star{color:gold;display:none;}#spike{position:absolute;width:30px;height:30px;background-color:red;transform:rotate(45deg);}#score{margin-top:10px;font-size:1.5rem;}#startBtn{padding:10px 20px;cursor:pointer;}</style></head><body><h1>Whimsical Bubble Bounce</h1><div id='gameArea'><div id='bubble'>💧</div><div id='spike'></div></div><div id='score'>Score: 0</div><button id='startBtn'>Start Game</button><script>const bubble=document.getElementById('bubble');const spike=document.getElementById('spike');const scoreDisplay=document.getElementById('score');const startBtn=document.getElementById('startBtn');let score=0;let gameInterval;let spikeInterval;let bubbleY=450;let bubbleX=125;let isGameActive=false;function startGame(){isGameActive=true;startBtn.style.display='none';score=0;scoreDisplay.innerText='Score: '+score;bubbleY=450;bubbleX=Math.random()*250;bubble.style.left=bubbleX+'px';gameInterval=setInterval(bounceBubble,100);spikeInterval=setInterval(dropSpike,1000);}function bounceBubble(){if(!isGameActive)return;if(bubbleY>0){bubbleY-=10;bubble.style.bottom=bubbleY+'px';}else{resetBubble();}checkCollision();}function resetBubble(){bubbleY=450;bubbleX=Math.random()*250;bubble.style.left=bubbleX+'px';}function dropSpike(){if(!isGameActive)return;const spikeX=Math.random()*270;spike.style.left=spikeX+'px';spike.style.bottom='-30px';spike.style.display='block';let spikeFall=setInterval(()=>{let spikeBottom=parseInt(spike.style.bottom);if(spikeBottom<500){spike.style.bottom=(spikeBottom+5)+'px';}else{clearInterval(spikeFall);resetSpike();}},50);}function resetSpike(){spike.style.display='none';}function checkCollision(){const bubbleRect=bubble.getBoundingClientRect();const spikeRect=spike.getBoundingClientRect();if(bubbleRect.bottom>=spikeRect.top&&bubbleRect.left<=spikeRect.right&&bubbleRect.right>=spikeRect.left){alert('Game Over! Final Score: '+score);clearInterval(gameInterval);clearInterval(spikeInterval);isGameActive=false;startBtn.style.display='block';}else if(bubbleY===0){score++;scoreDisplay.innerText='Score: '+score;}}bubble.addEventListener('click',resetBubble);startBtn.addEventListener('click',startGame);</script></body></html>
