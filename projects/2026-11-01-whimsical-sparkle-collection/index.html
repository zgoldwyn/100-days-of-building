<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Sparkle Collection</title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:linear-gradient(to bottom, #87CEFA, #FFB6C1);}canvas{border:1px solid #000;}.hidden{display:none;}.button{padding:10px 20px;margin-top:20px;background-color:#FF69B4;color:white;border:none;border-radius:5px;cursor:pointer;}.button:hover{background-color:#FF1493;}</style></head><body><h1>Whimsical Sparkle Collection</h1><canvas id='gameCanvas' width='400' height='400'></canvas><div class='hidden' id='gameOver'><h2>Game Over!</h2><button class='button' onclick='restartGame()'>Play Again</button></div><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');let sparkleCount=0;let obstacles=[];const character={x:200,y:350,width:30,height:30,speed:5};let gameInterval;function init() {document.addEventListener('keydown',moveCharacter);generateObstacles();gameInterval=setInterval(updateGame,100);resetGame();}function resetGame() {sparkleCount=0;obstacles=[];character.x=200;character.y=350;}function moveCharacter(e) {if(e.key==='ArrowLeft'&&character.x>0) character.x-=character.speed;if(e.key==='ArrowRight'&&character.x<canvas.width-character.width) character.x+=character.speed;}function generateObstacles() {for(let i=0;i<5;i++) {obstacles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-50,width:50,height:50});}}function drawCharacter() {ctx.fillStyle='#FFD700';ctx.fillRect(character.x,character.y,character.width,character.height);}function drawObstacles() {ctx.fillStyle='red';for(let obstacle of obstacles) ctx.fillRect(obstacle.x,obstacle.y,obstacle.width,obstacle.height);}function drawSparkles() {ctx.fillStyle='#FFC0CB';ctx.beginPath();ctx.arc(Math.random()*canvas.width,Math.random()*canvas.height,10,0,Math.PI*2);ctx.fill();sparkleCount++;}function checkCollisions() {for(let obstacle of obstacles) {if(character.x<obstacle.x+obstacle.width&&character.x+character.width>obstacle.x&&character.y<obstacle.y+obstacle.height&&character.y+character.height>obstacle.y) endGame();}}function endGame() {clearInterval(gameInterval);document.getElementById('gameOver').classList.remove('hidden');}function updateGame() {ctx.clearRect(0,0,canvas.width,canvas.height);drawCharacter();checkCollisions();drawObstacles();drawSparkles();}function restartGame() {document.getElementById('gameOver').classList.add('hidden');resetGame();init();}init();</script></body></html>
