<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Moonlight Dance</title><style>body {background-color: #282c34; color: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;} h1 {margin-bottom: 20px;} .dance-steps {font-size: 2rem; margin-bottom: 20px;} .btn {background-color: #61dafb; color: #282c34; border: none; padding: 10px 20px; cursor: pointer; font-size: 1rem;} #score {font-size: 2rem; margin-top: 20px;}</style></head><body><h1>Whimsical Moonlight Dance</h1><div class='dance-steps' id='danceStep'>Click to Start!</div><button class='btn' id='startBtn'>Start Dance</button><div id='score'>Score: 0</div><script>const danceSteps = ['🕺', '💃', '🌙', '✨']; let score = 0; let currentStep = ''; let timer; const danceStepElement = document.getElementById('danceStep'); const scoreElement = document.getElementById('score'); const startBtn = document.getElementById('startBtn'); startBtn.addEventListener('click', startDance); function startDance() {score = 0; scoreElement.innerText = 'Score: ' + score; nextStep();} function nextStep() {clearTimeout(timer); const step = danceSteps[Math.floor(Math.random() * danceSteps.length)]; currentStep = step; danceStepElement.innerText = step; timer = setTimeout(() => {danceStepElement.innerText = 'Missed!'; nextStep();}, 2000);} document.body.addEventListener('click', (event) => {if (event.target.id === 'danceStep' && currentStep !== '') {score++; scoreElement.innerText = 'Score: ' + score; nextStep();}});</script></body></html>
