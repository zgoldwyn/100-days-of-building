<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Iceberg Skip Game</title><style>body { font-family: Arial, sans-serif; background-color: #E0F7FA; color: #333; text-align: center; } #gameArea { position: relative; width: 100%; height: 500px; overflow: hidden; background: linear-gradient(to top, #b2ebf2, #80deea); border: 5px solid #004d40; } .iceberg { position: absolute; background-color: #ffffff; border-radius: 50%; } .snowflake { position: absolute; background-color: #fff; border-radius: 50%; opacity: 0.7; } #score { font-size: 24px; font-weight: bold; margin: 20px 0; } .button { padding: 10px 20px; margin-top: 10px; background: #00796b; color: white; border: none; border-radius: 5px; cursor: pointer; } .button:hover { background: #004d40; }</style></head><body><h1>Whimsical Iceberg Skip Game</h1><p>Skip stones across the icebergs! Avoid falling snowflakes.</p><div id='score'>Score: 0</div><div id='gameArea'></div><button class='button' id='startBtn'>Start Game</button><script>let score = 0; let gameInterval; let snowflakeInterval; const gameArea = document.getElementById('gameArea'); const scoreDisplay = document.getElementById('score'); const startBtn = document.getElementById('startBtn'); function startGame() { score = 0; scoreDisplay.innerHTML = 'Score: ' + score; gameArea.innerHTML = ''; createIceberg(); snowflakeInterval = setInterval(createSnowflake, 1500); gameInterval = setInterval(() => { if (Math.random() < 0.5) createIceberg(); }, 500); } function createIceberg() { const iceberg = document.createElement('div'); iceberg.className = 'iceberg'; iceberg.style.width = Math.random() * 100 + 30 + 'px'; iceberg.style.height = iceberg.style.width; iceberg.style.left = Math.random() * (gameArea.clientWidth - 100) + 'px'; iceberg.style.bottom = Math.random() * 50 + 100 + 'px'; gameArea.appendChild(iceberg); iceberg.onclick = () => { score++; scoreDisplay.innerHTML = 'Score: ' + score; iceberg.remove(); }; setTimeout(() => { iceberg.remove(); }, 2000); } function createSnowflake() { const snowflake = document.createElement('div'); snowflake.className = 'snowflake'; snowflake.style.width = Math.random() * 10 + 10 + 'px'; snowflake.style.height = snowflake.style.width; snowflake.style.left = Math.random() * (gameArea.clientWidth - 50) + 'px'; snowflake.style.top = '0px'; gameArea.appendChild(snowflake); let fallInterval = setInterval(() => { let top = parseInt(snowflake.style.top); if (top < 500) { snowflake.style.top = top + 5 + 'px'; } else { clearInterval(fallInterval); snowflake.remove(); } }, 100); snowflake.onclick = () => { alert('You were hit by a snowflake! Game Over!'); clearInterval(gameInterval); clearInterval(snowflakeInterval); }; } startBtn.onclick = () => { startGame(); startBtn.style.display = 'none'; }; </script></body></html>
