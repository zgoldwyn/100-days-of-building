<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Forest Maze</title><style>body { font-family: Arial, sans-serif; background-color: #e0f7fa; text-align: center; padding: 20px; } #maze { margin: 20px auto; border: 5px solid #4caf50; width: 300px; height: 300px; position: relative; } .item { width: 20px; height: 20px; background-color: #ffa726; border-radius: 50%; position: absolute; } .player { width: 20px; height: 20px; background-color: #ff4081; border-radius: 50%; position: absolute; } #score { font-size: 24px; margin: 20px; }</style></head><body><h1>Whimsical Forest Maze</h1><p>Use arrow keys to move through the maze and collect magical items!</p><div id='maze'></div><div id='score'>Score: 0</div><script>const maze = document.getElementById('maze'); const scoreDisplay = document.getElementById('score'); const player = document.createElement('div'); player.className = 'player'; maze.appendChild(player); let score = 0; let playerPosition = { x: 0, y: 0 }; const items = []; function createItem(x, y) { const item = document.createElement('div'); item.className = 'item'; item.style.left = x + 'px'; item.style.top = y + 'px'; maze.appendChild(item); items.push({ element: item, collected: false }); } function drawPlayer() { player.style.left = playerPosition.x + 'px'; player.style.top = playerPosition.y + 'px'; checkCollision(); } function checkCollision() { items.forEach((item, index) => { if (!item.collected && item.element.getBoundingClientRect().left === player.getBoundingClientRect().left && item.element.getBoundingClientRect().top === player.getBoundingClientRect().top) { item.collected = true; item.element.style.display = 'none'; score += 10; scoreDisplay.innerText = 'Score: ' + score; } }); } function movePlayer(event) { switch (event.key) { case 'ArrowUp': playerPosition.y = Math.max(playerPosition.y - 20, 0); break; case 'ArrowDown': playerPosition.y = Math.min(playerPosition.y + 20, 280); break; case 'ArrowLeft': playerPosition.x = Math.max(playerPosition.x - 20, 0); break; case 'ArrowRight': playerPosition.x = Math.min(playerPosition.x + 20, 280); break; } drawPlayer(); } document.addEventListener('keydown', movePlayer); for (let i = 0; i < 5; i++) { createItem(Math.floor(Math.random() * 14) * 20, Math.floor(Math.random() * 14) * 20); } drawPlayer();</script></body></html>
