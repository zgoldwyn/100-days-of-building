<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Blob Challenge</title><style>body { font-family: Arial, sans-serif; background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; } h1 { color: #333; } #score { font-size: 24px; margin: 20px; } .blob { position: absolute; border-radius: 50%; transition: transform 0.2s; } .pink { background-color: pink; } .blue { background-color: lightblue; } .black { background-color: black; } #start-button { padding: 10px 20px; font-size: 18px; cursor: pointer; }</style></head><body><h1>Color Blob Challenge</h1><div id='score'>Score: 0</div><button id='start-button'>Start Game</button><script>let score = 0; let gameInterval; const scoreDisplay = document.getElementById('score'); const startButton = document.getElementById('start-button'); const colors = ['pink', 'blue', 'black']; startButton.addEventListener('click', startGame); function startGame() { score = 0; scoreDisplay.innerText = 'Score: ' + score; startButton.style.display = 'none'; gameInterval = setInterval(createBlob, 1000); } function createBlob() { const blob = document.createElement('div'); const color = colors[Math.floor(Math.random() * colors.length)]; blob.className = 'blob ' + color; blob.style.width = blob.style.height = Math.random() * 50 + 20 + 'px'; blob.style.left = Math.random() * (window.innerWidth - 50) + 'px'; blob.style.top = Math.random() * (window.innerHeight - 50) + 'px'; blob.addEventListener('click', () => { if (color !== 'black') { score += 10; } else { score -= 5; } scoreDisplay.innerText = 'Score: ' + score; blob.remove(); }); document.body.appendChild(blob); setTimeout(() => { if (document.body.contains(blob)) blob.remove(); }, 2000); } window.addEventListener('load', () => { if (localStorage.getItem('highScore')) { scoreDisplay.innerText = 'High Score: ' + localStorage.getItem('highScore'); } }); setInterval(() => { if (score > 0 && score > localStorage.getItem('highScore', score)) { localStorage.setItem('highScore', score); } }, 1000); </script></body></html>
