name: Daily progress update

on:
  schedule:
    # Runs daily at 12:17 UTC.
    # GitHub's contribution calendar is based on UTC.
    - cron: "17 12 * * *"

  # Lets you test it manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add today's entry
        shell: bash
        run: |
          TODAY="$(date -u +'%Y-%m-%d')"

          # Do nothing if today's entry already exists.
          if grep -q "^## ${TODAY}$" progress.md 2>/dev/null; then
            echo "An entry already exists for ${TODAY}."
            exit 0
          fi

          {
            echo ""
            echo "## ${TODAY}"
            echo ""
            echo "- Daily repository check-in."
            echo "- Status: active"
          } >> progress.md

      - name: Commit and push
        shell: bash
        env:
          GIT_AUTHOR_NAME: "zgoldwyn"
          GIT_AUTHOR_EMAIL: "zachgoldwyn@icloud.com"
          GIT_COMMITTER_NAME: "zgoldwyn"
          GIT_COMMITTER_EMAIL: "zachgoldwyn@icloud.com"
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git add progress.md
          git commit -m "chore: daily progress update $(date -u +'%Y-%m-%d')"
          git push