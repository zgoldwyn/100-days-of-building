<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Pattern Tile Puzzle</title><style>body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: Arial, sans-serif; background-color: #f0f8ff; } h1 { color: #333; } #target-pattern { display: flex; margin-bottom: 20px; } .tile { width: 50px; height: 50px; margin: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; } .instructions { margin-bottom: 20px; } .success { color: green; font-weight: bold; }</style></head><body><h1>Color Pattern Tile Puzzle</h1><div class='instructions'>Rearrange the tiles to match the target pattern!</div><div id='target-pattern'></div><div id='current-pattern'></div><div><button id='shuffle'>Shuffle Tiles</button></div><div id='message' class='success'></div><script>const colors = ['🔴', '🟡', '🟢', '🔵', '🟣', '⚪️']; const numTiles = 6; let targetPattern = []; let currentPattern = []; const targetDiv = document.getElementById('target-pattern'); const currentDiv = document.getElementById('current-pattern'); const messageDiv = document.getElementById('message'); const shuffleButton = document.getElementById('shuffle'); function createPattern() { targetPattern = Array.from({ length: numTiles }, () => colors[Math.floor(Math.random() * colors.length)]); currentPattern = [...targetPattern]; renderPatterns(); } function renderPatterns() { targetDiv.innerHTML = ''; currentDiv.innerHTML = ''; targetPattern.forEach(color => { const tile = document.createElement('div'); tile.className = 'tile'; tile.textContent = color; tile.onclick = () => tileClick(color); targetDiv.appendChild(tile); }); currentPattern.forEach(color => { const tile = document.createElement('div'); tile.className = 'tile'; tile.textContent = color; currentDiv.appendChild(tile); }); checkWin(); } function tileClick(clickedColor) { const index = currentPattern.indexOf(clickedColor); if (index !== -1) { const newColor = prompt('Enter a new color (🔴, 🟡, 🟢, 🔵, 🟣, ⚪️):'); if (newColor && colors.includes(newColor)) { currentPattern[index] = newColor; renderPatterns(); } } } function checkWin() { if (JSON.stringify(targetPattern) === JSON.stringify(currentPattern)) { messageDiv.textContent = 'Congratulations! You matched the pattern!'; } else { messageDiv.textContent = ''; } } shuffleButton.onclick = () => { createPattern(); }; createPattern();</script></body></html>
