<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Rocket Jump</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#87CEEB;overflow:hidden;font-family:sans-serif}.container{position:relative;width:400px;height:800px;border:2px solid #fff;border-radius:10px;overflow:hidden}.rocket{position:absolute;width:30px;height:60px;background:red;border-radius:50%;bottom:0;left:50%;transform:translateX(-50%)}.cloud{position:absolute;background:white;border-radius:50%;opacity:0.8}.star{position:absolute;background:yellow;border-radius:50%;width:15px;height:15px;display:none}.scoreboard{position:absolute;top:10px;right:10px;color:white;font-size:24px;z-index:1}</style></head><body><div class="container"><div id="rocket" class="rocket"></div><div id="scoreboard" class="scoreboard">Score: 0</div></div><script>const rocket=document.getElementById("rocket");const container=document.querySelector(".container");const scoreboard=document.getElementById("scoreboard");let score=0;let isJumping=false;function createCloud(){const cloud=document.createElement("div");cloud.classList.add("cloud");cloud.style.width=Math.random()*60+60+"px";cloud.style.height=Math.random()*30+15+"px";cloud.style.left=Math.random()*350+"px";cloud.style.top=Math.random()*-100+"px";container.appendChild(cloud);moveCloud(cloud);}function moveCloud(cloud){let cloudInterval=setInterval(()=>{if(parseFloat(cloud.style.top)>(container.offsetHeight)){clearInterval(cloudInterval);cloud.remove();}else{cloud.style.top=parseFloat(cloud.style.top)+3+"px";}},20);}function createStar(){const star=document.createElement("div");star.classList.add("star");star.style.left=Math.random()*350+"px";star.style.top=Math.random()*-100+"px";container.appendChild(star);star.style.display="block";moveStar(star);}function moveStar(star){let starInterval=setInterval(()=>{if(parseFloat(star.style.top)>(container.offsetHeight)){clearInterval(starInterval);star.remove();}else{star.style.top=parseFloat(star.style.top)+5+"px";if(parseFloat(star.style.top) + 15 > container.offsetHeight && parseFloat(star.style.left) < parseFloat(rocket.style.left) + 30 && parseFloat(star.style.left) + 15 > parseFloat(rocket.style.left)){score++;scoreboard.textContent="Score: " + score;star.remove();}}},20);}function jump(){if(isJumping)return;isJumping=true;let jumpHeight=0;let upInterval=setInterval(()=>{if(jumpHeight>=150){clearInterval(upInterval);let downInterval=setInterval(()=>{if(jumpHeight<=0){clearInterval(downInterval);isJumping=false;}else{jumpHeight-=5;rocket.style.bottom=(parseInt(rocket.style.bottom)+5)+"px";jumpHeight-=5;}} ,20);}else{jumpHeight+=5;rocket.style.bottom=(parseInt(rocket.style.bottom)+5)+"px";}} ,20);}document.addEventListener("keydown",(e)=>{if(e.code==="Space"){jump();}});setInterval(()=>{createCloud();createStar();},1500);</script></body></html>
