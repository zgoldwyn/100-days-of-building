<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Snowflake Dance</title><style>body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1e3a78; color: white; font-family: Arial, sans-serif; } #gameArea { position: relative; width: 100%; max-width: 600px; height: 400px; border: 2px solid #fff; overflow: hidden; background: linear-gradient(to bottom, #005f99, #2073b5); } .snowflake { position: absolute; width: 30px; height: 30px; background-color: white; border-radius: 50%; animation: dance 1s infinite alternate; } @keyframes dance { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } } .star { position: absolute; background-color: yellow; width: 15px; height: 15px; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); } .icicle { position: absolute; background-color: #99ccff; width: 10px; height: 30px; border-radius: 5px; } #score { position: absolute; top: 10px; left: 10px; font-size: 24px; } </style></head><body><div id='gameArea'><div id='score'>Score: 0</div></div><script>const gameArea = document.getElementById('gameArea'); const scoreDisplay = document.getElementById('score'); let score = 0; let snowflake; let interval, icicleInterval; const createSnowflake = () => { snowflake = document.createElement('div'); snowflake.className = 'snowflake'; snowflake.style.left = Math.random() * (gameArea.clientWidth - 30) + 'px'; snowflake.style.bottom = '0px'; gameArea.appendChild(snowflake); moveSnowflake(); }; const moveSnowflake = () => { const move = setInterval(() => { snowflake.style.bottom = (parseFloat(snowflake.style.bottom) + 3) + 'px'; if (parseFloat(snowflake.style.bottom) > gameArea.clientHeight) { clearInterval(move); gameArea.removeChild(snowflake); } }, 20); }; const createIcicle = () => { const icicle = document.createElement('div'); icicle.className = 'icicle'; icicle.style.left = Math.random() * (gameArea.clientWidth - 10) + 'px'; icicle.style.top = '0px'; gameArea.appendChild(icicle); const moveIcicle = setInterval(() => { icicle.style.top = (parseFloat(icicle.style.top) + 5) + 'px'; if (parseFloat(icicle.style.top) > gameArea.clientHeight) { clearInterval(moveIcicle); gameArea.removeChild(icicle); } else if (isCollision(snowflake, icicle)) { clearInterval(moveIcicle); gameArea.removeChild(icicle); gameOver(); } }, 20); }; const isCollision = (a, b) => { const rectA = a.getBoundingClientRect(); const rectB = b.getBoundingClientRect(); return !((rectA.top > rectB.bottom) || (rectA.bottom < rectB.top) || (rectA.right < rectB.left) || (rectA.left > rectB.right)); }; const gameOver = () => { clearInterval(interval); clearInterval(icicleInterval); alert('Game Over! Your Score: ' + score); resetGame(); }; const resetGame = () => { score = 0; scoreDisplay.innerText = 'Score: 0'; while (gameArea.firstChild) { gameArea.removeChild(gameArea.firstChild); } startGame(); }; const startGame = () => { interval = setInterval(createSnowflake, 1000); icicleInterval = setInterval(createIcicle, 1500); }; document.addEventListener('keydown', (event) => { if (event.key === 'ArrowLeft' && snowflake) { snowflake.style.left = (parseFloat(snowflake.style.left) - 20) + 'px'; } if (event.key === 'ArrowRight' && snowflake) { snowflake.style.left = (parseFloat(snowflake.style.left) + 20) + 'px'; } if (event.key === 'Space' && snowflake) { score++; scoreDisplay.innerText = 'Score: ' + score; gameArea.removeChild(snowflake); createSnowflake(); } }); startGame(); </script></body></html>
