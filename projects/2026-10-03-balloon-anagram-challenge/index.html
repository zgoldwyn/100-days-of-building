<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Balloon Anagram Challenge</title><style>body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#e0f7fa;color:#006064;font-family:Arial,sans-serif;}h1{margin-bottom:20px;}#balloons{position:relative;width:90%;min-height:400px;overflow:hidden;}.balloon{position:absolute;width:60px;height:80px;background-color:#f44336;color:white;display:flex;align-items:center;justify-content:center;border-radius:20px;cursor:pointer;animation:float 1.2s ease-in-out infinite;}.letter{font-size:24px;}@keyframes float{0%{transform:translateY(0);}50%{transform:translateY(-10px);}100%{transform:translateY(0);}#instruction{margin:20px;}</style></head><body><h1>Balloon Anagram Challenge</h1><div id='instruction'>Pop balloons to collect letters and form words!</div><div id='balloons'></div><button id='start' onclick='startGame()'>Start Game</button><div id='scoreboard' style='margin-top:20px;'>Score: <span id='score'>0</span></div><script>let score=0;let letters=[];function startGame(){document.getElementById('score').innerText=score;letters=[];document.getElementById('balloons').innerHTML='';for(let i=0;i<10;i++){createBalloon();}setTimeout(endGame,30000);}function createBalloon(){const balloon=document.createElement('div');balloon.className='balloon';balloon.style.left=Math.random()*80+'vw';balloon.innerHTML='<div class="letter">'+getRandomLetter()+'</div>';balloon.onclick=()=>{popBalloon(balloon);};document.getElementById('balloons').appendChild(balloon);setTimeout(()=>{balloon.remove();},4000);}function popBalloon(balloon){score+=1;letters.push(balloon.innerText);document.getElementById('score').innerText=score;balloon.remove();}function endGame(){if(letters.length>0){const anagram=letters.join('').toLowerCase();alert('You collected: ' + letters.join(' ') + '\nFormed an anagram: ' + anagram);}else{alert('No letters collected!');}}function getRandomLetter(){return String.fromCharCode(65+Math.floor(Math.random()*26));}</script></body></html>
