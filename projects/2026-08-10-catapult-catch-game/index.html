<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Catapult Catch Game</title><style>body{font-family:Arial,sans-serif;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;background-color:#f0f0f0}.game-container{position:relative;width:300px;height:400px;border:2px solid #333;overflow:hidden;background-color:#fff}.catapult{position:absolute;bottom:0;width:60px;height:20px;background-color:#666;border-radius:10px;left:50%;transform:translateX(-50%)}.object{position:absolute;width:30px;height:30px;}.score{font-size:24px;position:absolute;top:10px;left:10px;}button{padding:10px 20px;margin-top:20px;cursor:pointer;}</style></head><body><h1>Catapult Catch Game</h1><div class='score'>Score: <span id='score'>0</span></div><div class='game-container'><div class='catapult' id='catapult'></div></div><button id='startBtn'>Start Game</button><script>let score = 0;let gameInterval;const scoreDisplay = document.getElementById('score');const catapult = document.getElementById('catapult');const startBtn = document.getElementById('startBtn');const gameContainer = document.querySelector('.game-container');function startGame(){score = 0;scoreDisplay.textContent = score;startBtn.disabled = true;gameInterval = setInterval(dropObject, 1000);}function dropObject(){const object = document.createElement('div');const isBomb = Math.random() < 0.3;object.className = 'object';object.style.backgroundColor = isBomb ? 'red' : 'green';object.style.top = '0px';object.style.left = Math.random() * (gameContainer.clientWidth - 30) + 'px';gameContainer.appendChild(object);let dropInterval = setInterval(() => {let objectTop = parseInt(object.style.top);if(objectTop > gameContainer.clientHeight){clearInterval(dropInterval);gameContainer.removeChild(object);return;}object.style.top = objectTop + 5 + 'px';if(objectTop + 30 >= gameContainer.clientHeight - 20 && objectTop + 30 <= gameContainer.clientHeight - 10){if(catapult.offsetLeft <= parseInt(object.style.left) && catapult.offsetLeft + 60 >= parseInt(object.style.left)){if(!isBomb){score++;scoreDisplay.textContent = score;}else{endGame();}}}});setTimeout(() => {clearInterval(dropInterval);gameContainer.removeChild(object);}, 3000);}function endGame(){clearInterval(gameInterval);alert('Game Over! Your score: ' + score);startBtn.disabled = false;startBtn.textContent = 'Restart Game';}document.addEventListener('mousemove', (e) => {const containerRect = gameContainer.getBoundingClientRect();let mouseX = e.clientX - containerRect.left;mouseX = Math.max(0, Math.min(containerRect.width - 60, mouseX));catapult.style.left = mouseX + 'px';});startBtn.addEventListener('click', startGame);</script></body></html>
