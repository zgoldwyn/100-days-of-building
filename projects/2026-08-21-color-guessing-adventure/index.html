<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Guessing Adventure</title><style>body { font-family: Arial, sans-serif; text-align: center; background: #f0f0f0; padding: 20px; } h1 { color: #333; } #canvas { border: 1px solid #000; margin: 20px auto; cursor: pointer; } #buttons { margin: 20px 0; } button { padding: 10px 20px; margin: 5px; font-size: 16px; }</style></head><body><h1>Color Guessing Adventure</h1><div id='game'><canvas id='canvas' width='300' height='300'></canvas><div id='buttons'><button id='red'>Red</button><button id='blue'>Blue</button><button id='yellow'>Yellow</button></div><h2 id='result'></h2><h3 id='timer'>Time: <span id='time'>30</span> seconds</h3></div><script>let colors = ['#ff0000', '#0000ff', '#ffff00']; let score = 0; let timeLeft = 30; let interval; const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d'); const result = document.getElementById('result'); const timeDisplay = document.getElementById('time'); function drawColor() { ctx.clearRect(0, 0, canvas.width, canvas.height); let color = colors[Math.floor(Math.random() * colors.length)]; ctx.fillStyle = color; ctx.fillRect(0, 0, canvas.width, canvas.height); return color; } function startGame() { score = 0; timeLeft = 30; result.textContent = ''; drawColor(); if (interval) clearInterval(interval); interval = setInterval(() => { timeLeft--; timeDisplay.textContent = timeLeft; if (timeLeft <= 0) endGame(); }, 1000); } function endGame() { clearInterval(interval); result.textContent = 'Game Over! Your Score: ' + score; localStorage.setItem('highScore', Math.max(score, localStorage.getItem('highScore') || 0)); } function checkColor(selectedColor) { let displayedColor = ctx.fillStyle; if (selectedColor === displayedColor) { score++; drawColor(); } else { score--; } } document.getElementById('red').addEventListener('click', () => checkColor('#ff0000')); document.getElementById('blue').addEventListener('click', () => checkColor('#0000ff')); document.getElementById('yellow').addEventListener('click', () => checkColor('#ffff00')); startGame(); </script></body></html>
