<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Plant Garden</title><style>body{font-family: Arial, sans-serif; background: #e0f7fa; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;}#garden{display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 10px;} .plant{width: 100px; height: 100px; background: #4caf50; border: 2px solid #388e3c; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;} .plant:hover{transform: scale(1.05);} #controls{margin-top: 20px; text-align: center;} button{padding: 10px 20px; margin: 5px; background: #ff9800; border: none; border-radius: 5px; cursor: pointer; color: white;} button:hover{background: #f57c00;}</style></head><body><h1>Whimsical Plant Garden</h1><div id='garden'></div><div id='controls'><button id='addPlant'>Add Plant</button><button id='waterPlants'>Water All Plants</button></div><script>let garden = [];const plantTypes = ['🌼','🌿','🌺','🌻','🍀'];const gardenGrid = document.getElementById('garden');const addPlantButton = document.getElementById('addPlant');const waterPlantsButton = document.getElementById('waterPlants');function renderGarden() {gardenGrid.innerHTML = '';garden.forEach((plant, index) => {const plantDiv = document.createElement('div');plantDiv.classList.add('plant');plantDiv.textContent = plantTypes[plant];plantDiv.onclick = () => choosePlant(index);gardenGrid.appendChild(plantDiv);});}function choosePlant(index) {alert('You selected plant: ' + plantTypes[garden[index]]);garden[index] = (garden[index] + 1) % plantTypes.length;renderGarden();}addPlantButton.onclick = () => {const randomPlant = Math.floor(Math.random() * plantTypes.length);garden.push(randomPlant);renderGarden();};waterPlantsButton.onclick = () => {alert('All plants have been watered!');};</script></body></html>
