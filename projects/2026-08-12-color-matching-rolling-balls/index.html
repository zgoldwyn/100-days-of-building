<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Matching Rolling Balls</title><style>body { display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f0f0f0; flex-direction: column; font-family: Arial, sans-serif; } #game { display: grid; grid-template-columns: repeat(5, 60px); grid-gap: 10px; margin-bottom: 20px; } .ball { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; } #controls { margin-top: 20px; } button { padding: 10px 20px; font-size: 16px; cursor: pointer; }</style></head><body><h1>Color Matching Rolling Balls</h1><div id='game'></div><div id='controls'><button id='start-btn'>Start Game</button><p id='status'></p><p>High Score: <span id='high-score'>0</span></p></div><script>const colors = ['red', 'blue', 'green', 'yellow', 'purple']; let balls = [], targetColor, score = 0; const gameContainer = document.getElementById('game'); const startBtn = document.getElementById('start-btn'); const statusText = document.getElementById('status'); const highScoreText = document.getElementById('high-score'); let highScore = localStorage.getItem('highScore') || 0; highScoreText.innerText = highScore; function createBall(color) { const ball = document.createElement('div'); ball.classList.add('ball'); ball.style.backgroundColor = color; ball.innerText = '?'; ball.addEventListener('click', () => checkBall(color, ball)); return ball; } function setTargetColor() { targetColor = colors[Math.floor(Math.random() * colors.length)]; statusText.innerText = `Match the color: ${targetColor.toUpperCase()}`; } function checkBall(color, ball) { if (color === targetColor) { score += 1; ball.innerText = '✔'; ball.style.pointerEvents = 'none'; if (score > highScore) { highScore = score; localStorage.setItem('highScore', highScore); highScoreText.innerText = highScore; } setTimeout(resetGame, 1000); } else { endGame(); } } function endGame() { statusText.innerText = 'Game Over!'; balls.forEach(ball => ball.style.pointerEvents = 'none'); } function resetGame() { score = 0; balls.forEach(ball => ball.innerText = '?'); balls.forEach(ball => ball.style.pointerEvents = 'auto'); setTargetColor(); } function startGame() { gameContainer.innerHTML = ''; balls = colors.map(color => createBall(color)); balls.forEach(ball => gameContainer.appendChild(ball)); resetGame(); } startBtn.addEventListener('click', startGame); </script></body></html>
