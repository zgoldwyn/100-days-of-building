<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Jellybean Collector</title><style>body{font-family:sans-serif;padding:0;margin:0;background:linear-gradient(to top right,#ffcc00,#ff99cc);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}#game{position:relative;width:400px;height:600px;border:5px solid #ff3399;overflow:hidden;background:#fff;}#jellybean{position:absolute;width:40px;height:40px;background:#ff6699;border-radius:50%;</style></head><body><div id="game"><div id="jellybean"></div></div><script>const gameArea=document.getElementById("game"),jellybean=document.getElementById("jellybean");let score=0;const jellybeans=[];let isGameActive=true;function startGame(){document.addEventListener("keydown",moveJellybean);setInterval(generateObstacle,1000);setInterval(updateScore,100);setInterval(checkCollision,50);}function moveJellybean(event){if(!isGameActive)return;const jellybeanStyle=jellybean.style;const step=10;switch(event.key){case "ArrowLeft":if(parseInt(jellybeanStyle.left)<step)break;jellybeanStyle.left=(parseInt(jellybeanStyle.left)-step)+"px";break;case "ArrowRight":if(parseInt(jellybeanStyle.left)>gameArea.clientWidth-50)break;jellybeanStyle.left=(parseInt(jellybeanStyle.left)+step)+"px";break;case "ArrowUp":if(parseInt(jellybeanStyle.top)<=0)break;jellybeanStyle.top=(parseInt(jellybeanStyle.top)-step)+"px";break;case "ArrowDown":if(parseInt(jellybeanStyle.top)>gameArea.clientHeight-50)break;jellybeanStyle.top=(parseInt(jellybeanStyle.top)+step)+"px";break;}}function generateObstacle(){if(!isGameActive)return;const obstacle=document.createElement("div");obstacle.className="obstacle";obstacle.style.position="absolute";obstacle.style.width="50px";obstacle.style.height="50px";obstacle.style.background="#333";obstacle.style.left=Math.floor(Math.random()*350)+"px";obstacle.style.top="0px";gameArea.appendChild(obstacle);jellybeans.push(obstacle);let fallInterval=setInterval(()=>{obstacle.style.top=parseInt(obstacle.style.top)+5+"px";if(parseInt(obstacle.style.top)>gameArea.clientHeight){clearInterval(fallInterval);gameArea.removeChild(obstacle);jellybeans.splice(jellybeans.indexOf(obstacle),1);score++;}if(checkCollision(obstacle)){clearInterval(fallInterval);endGame();}},50); }function updateScore(){if(!isGameActive)return;document.title=`Score: ${score}`;}function checkCollision(obstacle){const jellybeanRect=jellybean.getBoundingClientRect();const obstacleRect=obstacle.getBoundingClientRect();return!(jellybeanRect.right<obstacleRect.left||jellybeanRect.left>obstacleRect.right||jellybeanRect.bottom<obstacleRect.top||jellybeanRect.top>obstacleRect.bottom);}function endGame(){isGameActive=false;alert(`Game Over! Your score: ${score}`); window.location.reload();}startGame();</script></body></html>
