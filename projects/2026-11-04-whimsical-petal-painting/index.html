<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Petal Painting</title><style>body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#f0f8ff;font-family:sans-serif}.canvas-container{position:relative;}.canvas{border:2px solid #000;background-color:#e0f7fa;cursor:crosshair;}.color-palette{display:flex;justify-content:center;margin-top:10px}.color-box{width:30px;height:30px;border:2px solid white;cursor:pointer;margin:0 5px;}.timer{font-size:24px;}</style></head><body><h1>Whimsical Petal Painting</h1><div class='timer'>Time Left: <span id='time'>30</span>s</div><div class='canvas-container'><canvas id='canvas' width='500' height='300' class='canvas'></canvas></div><div class='color-palette'><div class='color-box' style='background-color:red' onclick="setColor('red')"></div><div class='color-box' style='background-color:blue' onclick="setColor('blue')"></div><div class='color-box' style='background-color:yellow' onclick="setColor('yellow')"></div><div class='color-box' style='background-color:green' onclick="setColor('green')"></div></div><script>let canvas=document.getElementById('canvas');let ctx=canvas.getContext('2d');let color='red';canvas.addEventListener('click',draw);let timeLeft=30;let timer=setInterval(updateTimer,1000);function setColor(newColor){color=newColor;}function draw(e){let rect=canvas.getBoundingClientRect();let x=e.clientX-rect.left;let y=e.clientY-rect.top;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();}function updateTimer(){if(timeLeft>0){timeLeft--;document.getElementById('time').innerText=timeLeft;}else{clearInterval(timer);alert('Time is up! You created a beautiful masterpiece!');}}</script></body></html>
