<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whirlwind Collector Challenge</title><style>body{font-family: Arial, sans-serif; background: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;} #game{position:relative; width:300px; height:500px; border:2px solid #000; overflow:hidden; background: #e6f7ff;} #whirlwind{position:absolute; width:50px; height:50px; background: radial-gradient(circle at 50% 50%, #ffcc00, transparent); border-radius:50%;}</style></head><body><div id='game'><div id='whirlwind'></div></div><div><h1>Whirlwind Collector</h1><p>Use arrow keys to control the whirlwind.</p><p>Collect items while avoiding obstacles!</p><h2>Score: <span id='score'>0</span></h2><button id='restart' style='display:none;'>Restart</button></div><script>const game = document.getElementById('game'); const whirlwind = document.getElementById('whirlwind'); const scoreDisplay = document.getElementById('score'); const restartButton = document.getElementById('restart'); let score = 0; let whirlwindPosition = { x: 125, y: 425 }; let items = []; let obstacles = []; let gameActive = false; const startGame = () => { score = 0; scoreDisplay.textContent = score; whirlwind.style.left = whirlwindPosition.x + 'px'; whirlwind.style.top = whirlwindPosition.y + 'px'; items = []; obstacles = []; gameActive = true; createItems(); createObstacles(); document.addEventListener('keydown', controlWhirlwind); gameLoop(); }; const controlWhirlwind = (event) => { if(!gameActive) return; switch(event.key) { case 'ArrowLeft': whirlwindPosition.x = Math.max(0, whirlwindPosition.x - 10); break; case 'ArrowRight': whirlwindPosition.x = Math.min(250, whirlwindPosition.x + 10); break; case 'ArrowUp': whirlwindPosition.y = Math.max(0, whirlwindPosition.y - 10); break; case 'ArrowDown': whirlwindPosition.y = Math.min(450, whirlwindPosition.y + 10); break; } whirlwind.style.left = whirlwindPosition.x + 'px'; whirlwind.style.top = whirlwindPosition.y + 'px'; checkCollision(); }; const createItems = () => { for(let i = 0; i < 5; i++){ let item = document.createElement('div'); item.className = 'item'; item.style.position = 'absolute'; item.style.background = 'green'; item.style.width = '20px'; item.style.height = '20px'; item.style.top = Math.random() * (game.clientHeight - 20) + 'px'; item.style.left = Math.random() * (game.clientWidth - 20) + 'px'; game.appendChild(item); items.push(item); } }; const createObstacles = () => { for(let i = 0; i < 3; i++){ let obstacle = document.createElement('div'); obstacle.className = 'obstacle'; obstacle.style.position = 'absolute'; obstacle.style.background = 'red'; obstacle.style.width = '30px'; obstacle.style.height = '30px'; obstacle.style.top = Math.random() * (game.clientHeight - 30) + 'px'; obstacle.style.left = Math.random() * (game.clientWidth - 30) + 'px'; game.appendChild(obstacle); obstacles.push(obstacle); } }; const checkCollision = () => { items.forEach((item, index) => { let itemRect = item.getBoundingClientRect(); let whirlwindRect = whirlwind.getBoundingClientRect(); if(itemRect.left < whirlwindRect.right && itemRect.right > whirlwindRect.left && itemRect.top < whirlwindRect.bottom && itemRect.bottom > whirlwindRect.top) { score++; scoreDisplay.textContent = score; game.removeChild(item); items.splice(index, 1); } }); obstacles.forEach(obstacle => { let obstacleRect = obstacle.getBoundingClientRect(); let whirlwindRect = whirlwind.getBoundingClientRect(); if(obstacleRect.left < whirlwindRect.right && obstacleRect.right > whirlwindRect.left && obstacleRect.top < whirlwindRect.bottom && obstacleRect.bottom > whirlwindRect.top) { endGame(); } }); }; const endGame = () => { gameActive = false; alert('Game Over! Your score: ' + score); restartButton.style.display = 'block'; }; const gameLoop = () => { if(gameActive){ requestAnimationFrame(gameLoop); } }; restartButton.addEventListener('click', () => { restartButton.style.display = 'none'; startGame(); }); startGame(); </script></body></html>
