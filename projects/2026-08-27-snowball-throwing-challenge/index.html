<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Snowball Throwing Challenge</title><style>body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #e0f7fa; margin: 0; font-family: Arial, sans-serif; } #gameContainer { text-align: center; } #target { position: absolute; width: 50px; height: 50px; background: #ff1744; border-radius: 50%; } #scoreBoard { margin: 20px; font-size: 24px; } button { padding: 10px 20px; font-size: 18px; cursor: pointer; } </style></head><body><div id="gameContainer"><div id="scoreBoard">Score: <span id="score">0</span></div><div id="target"></div><button id="startButton">Start Game</button><div id="timerDisplay">Time: <span id="timer">30</span> seconds</div><div id="gameOver" style="display: none;">Game Over! Final Score: <span id="finalScore"></span></div></div><script>let score = 0; let timeLeft = 30; let gameInterval; let target; function startGame() { score = 0; timeLeft = 30; document.getElementById('score').innerText = score; document.getElementById('timer').innerText = timeLeft; document.getElementById('gameOver').style.display = 'none'; target = document.getElementById('target'); target.style.display = 'block'; moveTarget(); gameInterval = setInterval(updateTimer, 1000); } function moveTarget() { const randX = Math.floor(Math.random() * (window.innerWidth - 50)); const randY = Math.floor(Math.random() * (window.innerHeight - 50)); target.style.left = randX + 'px'; target.style.top = randY + 'px'; } function updateTimer() { timeLeft--; document.getElementById('timer').innerText = timeLeft; if (timeLeft <= 0) { clearInterval(gameInterval); endGame(); } } function throwSnowball() { score++; document.getElementById('score').innerText = score; moveTarget(); } function endGame() { target.style.display = 'none'; document.getElementById('finalScore').innerText = score; document.getElementById('gameOver').style.display = 'block'; } target.addEventListener('click', throwSnowball); document.getElementById('startButton').addEventListener('click', startGame); </script></body></html>
