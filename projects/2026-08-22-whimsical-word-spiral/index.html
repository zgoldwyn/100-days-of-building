<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Word Spiral</title><style>body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f8ff; color: #333; } h1 { margin-top: 20px; } #game-container { margin: auto; width: 80%; max-width: 600px; border: 1px solid #ddd; padding: 20px; border-radius: 10px; background-color: white; } #spiral { margin-top: 20px; height: 300px; overflow: hidden; position: relative; } .word { position: absolute; white-space: nowrap; } .hidden { display: none; } #start-button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; } #start-button:hover { background-color: #45a049; } </style></head><body><h1>Whimsical Word Spiral</h1><div id='game-container'><p>Match the word sequence before time runs out!</p><div id='spiral'></div><input type='text' id='user-input' placeholder='Type your word here...' class='hidden'><button id='start-button'>Start Game</button><p id='timer' class='hidden'>Time Left: <span id='time'>30</span>s</p><p id='message' class='hidden'></p></div><script>let timer; let timeLeft = 30; let sequence = []; let userInput = document.getElementById('user-input'); let spiralContainer = document.getElementById('spiral'); let timerDisplay = document.getElementById('time'); let messageDisplay = document.getElementById('message'); let startButton = document.getElementById('start-button'); startButton.addEventListener('click', startGame); function startGame() { sequence = []; timeLeft = 30; userInput.classList.remove('hidden'); document.getElementById('start-button').classList.add('hidden'); document.getElementById('timer').classList.remove('hidden'); messageDisplay.classList.add('hidden'); userInput.value = ''; userInput.focus(); generateWord(); timer = setInterval(updateTimer, 1000); } function updateTimer() { timeLeft--; timerDisplay.textContent = timeLeft; if (timeLeft <= 0) { endGame('Time is up!'); } } function generateWord() { const words = ['whimsical', 'spiral', 'fun', 'playful', 'creative']; let nextWord = words[Math.floor(Math.random() * words.length)]; sequence.push(nextWord); displaySpiral(); userInput.addEventListener('keydown', checkInput); } function displaySpiral() { spiralContainer.innerHTML = ''; sequence.forEach((word, index) => { let position = index * 30; let wordElement = document.createElement('div'); wordElement.textContent = word; wordElement.className = 'word'; wordElement.style.transform = 'rotate(' + position + 'deg) translateX(50px)'; spiralContainer.appendChild(wordElement); }); } function checkInput(event) { if (event.key === 'Enter') { if (userInput.value === sequence[sequence.length - 1]) { userInput.value = ''; generateWord(); } else { endGame('Wrong word! Try again.'); } } } function endGame(message) { clearInterval(timer); userInput.classList.add('hidden'); messageDisplay.textContent = message; messageDisplay.classList.remove('hidden'); } </script></body></html>
