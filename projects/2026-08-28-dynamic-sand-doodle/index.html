<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Dynamic Sand Doodle</title><style>body {display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; font-family: Arial, sans-serif;}canvas {border: 2px solid #333; background-color: #fff;}#controls {position: absolute; bottom: 20px; display: flex; gap: 10px;}button {padding: 10px 15px; font-size: 16px; cursor: pointer;}</style></head><body><canvas id='sandCanvas' width='800' height='600'></canvas><div id='controls'><button id='startBtn'>Start</button><button id='resetBtn'>Reset</button></div><script>const canvas = document.getElementById('sandCanvas');const ctx = canvas.getContext('2d');const gravity = 0.1;let particles = [];let running = false;let reset = false;function Particle(x, y) {this.x = x;this.y = y;this.radius = Math.random() * 5 + 2;this.color = 'gold';this.velocityX = (Math.random() - 0.5) * 2;this.velocityY = 1;}Particle.prototype.update = function() {this.velocityY += gravity;if (this.y + this.radius + this.velocityY > canvas.height) {this.y = canvas.height - this.radius;this.velocityY *= -0.3;} else {this.velocityY *= 0.99;}this.x += this.velocityX;this.y += this.velocityY;};Particle.prototype.draw = function() {ctx.beginPath();ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);ctx.fillStyle = this.color;ctx.fill();ctx.closePath();};function handleObstacles() {const cols = canvas.width / 100;const rows = canvas.height / 100;for (let i = 0; i < cols; i++) {for (let j = 0; j < rows; j++) {if (Math.random() < 0.1) {ctx.fillStyle = 'brown';ctx.fillRect(i * 100, j * 100, 100, 10);}}}}function animate() {ctx.clearRect(0, 0, canvas.width, canvas.height);if (reset) {handleObstacles();reset = false;}particles.forEach((particle, index) => {particle.update();particle.draw();if (particle.y > canvas.height) particles.splice(index, 1);});if (running) {requestAnimationFrame(animate);}}function startDrawing() {running = true;particles.push(new Particle(Math.random() * canvas.width, 0));animate();}document.getElementById('startBtn').addEventListener('click', startDrawing);document.getElementById('resetBtn').addEventListener('click', () => {reset = true;particles = [];handleObstacles();});</script></body></html>
