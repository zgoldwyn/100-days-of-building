<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Sound Wave Dash</title><style>body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f8ff; color: #333;} h1 { margin-bottom: 20px; } canvas { border: 2px solid #333; } #score { font-size: 24px; margin-top: 20px; }</style></head><body><h1>Whimsical Sound Wave Dash</h1><p>Use your arrow keys to navigate through the sound waves. Collect notes and avoid the cacophonic waves!</p><canvas id='gameCanvas' width='800' height='400'></canvas><div id='score'>Score: 0</div><script>const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); let score = 0; let waveWidth = 100; let waveHeight = 40; let playerY = canvas.height / 2; let notes = []; let obstacles = []; let frameCount = 0; let gameSpeed = 2; const player = { width: 30, height: 30 }; document.addEventListener('keydown', (e) => { if (e.key === 'ArrowUp') playerY -= 20; else if (e.key === 'ArrowDown') playerY += 20; }); function generateWaves() { if (frameCount % 40 === 0) { const noteX = canvas.width; const noteY = Math.random() * (canvas.height - waveHeight); notes.push({ x: noteX, y: noteY, width: 20, height: 20 }); } if (frameCount % 60 === 0) { const obstacleX = canvas.width; const obstacleY = Math.random() * (canvas.height - waveHeight); obstacles.push({ x: obstacleX, y: obstacleY, width: waveWidth, height: waveHeight }); } } function update() { if (playerY < 0) playerY = 0; else if (playerY > canvas.height - player.height) playerY = canvas.height - player.height; frameCount++; ctx.clearRect(0, 0, canvas.width, canvas.height); generateWaves(); ctx.fillStyle = 'blue'; ctx.fillRect(50, playerY, player.width, player.height); notes = notes.filter(note => { if (note.x > -20) { note.x -= gameSpeed; ctx.fillStyle = 'gold'; ctx.fillRect(note.x, note.y, note.width, note.height); if (note.x < 70 && note.x + note.width > 50 && note.y < playerY + player.height && note.y + note.height > playerY) { score += 10; return false; } return true; } else return false; }); obstacles = obstacles.filter(obstacle => { if (obstacle.x > -waveWidth) { obstacle.x -= gameSpeed; ctx.fillStyle = 'red'; ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height); if (obstacle.x < 70 && obstacle.x + obstacle.width > 50 && obstacle.y < playerY + player.height && obstacle.y + obstacle.height > playerY) { alert('Game Over!'); document.location.reload(); } return true; } else return false; }); document.getElementById('score').innerText = 'Score: ' + score; requestAnimationFrame(update); } update();</script></body></html>
