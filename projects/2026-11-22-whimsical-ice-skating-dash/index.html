<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Ice Skating Dash</title><style>body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; background-color: #e0f7fa; } canvas { border: 2px solid #00796b; border-radius: 10px; } #score { font-size: 24px; margin: 10px; } #startButton { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #00796b; color: white; border: none; border-radius: 5px; } #startButton:hover { background-color: #004d40; }</style></head><body><h1>Whimsical Ice Skating Dash</h1><div id="score">Score: 0</div><canvas id="gameCanvas" width="600" height="400"></canvas><button id="startButton">Start Game</button><script>const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const startButton = document.getElementById('startButton'); let player, obstacles = [], gems = [], score = 0, gameOver = false, gameStarted = false, frame; function resetGame() { obstacles = []; gems = []; score = 0; gameOver = false; player = { x: 50, y: canvas.height / 2, width: 30, height: 30 }; } function startGame() { resetGame(); gameStarted = true; draw(); } function draw() { if (gameOver) return; ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#ffffff'; ctx.fillRect(player.x, player.y, player.width, player.height); drawObstacles(); drawGems(); ctx.fillStyle = '#000'; ctx.font = '20px Arial'; ctx.fillText(`Score: ${score}`, 10, 30); frame = requestAnimationFrame(draw); } function drawObstacles() { if (Math.random() < 0.02) { obstacles.push({ x: canvas.width, y: Math.random() * (canvas.height - 20), width: 20, height: 20 }); } obstacles.forEach((obstacle, index) => { obstacle.x -= 3; ctx.fillStyle = '#f44336'; ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height); if (isColliding(player, obstacle)) { gameOver = true; alert('Game Over! Your score is: ' + score); cancelAnimationFrame(frame); } if (obstacle.x + obstacle.width < 0) { obstacles.splice(index, 1); } }); } function drawGems() { if (Math.random() < 0.01) { gems.push({ x: canvas.width, y: Math.random() * (canvas.height - 10), width: 15, height: 15 }); } gems.forEach((gem, index) => { gem.x -= 3; ctx.fillStyle = '#ffd600'; ctx.fillRect(gem.x, gem.y, gem.width, gem.height); if (isColliding(player, gem)) { score += 10; gems.splice(index, 1); } if (gem.x + gem.width < 0) { gems.splice(index, 1); } }); } function isColliding(rect1, rect2) { return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y; } document.addEventListener('keydown', (event) => { if (event.key === 'ArrowUp' && player.y > 0) player.y -= 20; if (event.key === 'ArrowDown' && player.y < canvas.height - player.height) player.y += 20; }); startButton.addEventListener('click', startGame); </script></body></html>
