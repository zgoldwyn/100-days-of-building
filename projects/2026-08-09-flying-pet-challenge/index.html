<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Flying Pet Challenge</title><style>* { margin: 0; padding: 0; box-sizing: border-box; } body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: Arial, sans-serif; background: #87CEEB; } canvas { border: 1px solid #000; background: #FFFFFF; } h1 { color: #FF6347; } .score { font-size: 24px; margin-top: 10px; } .instructions { margin: 10px; font-size: 18px; }</style></head><body><h1>Flying Pet Challenge</h1><div class='instructions'>Use Arrow Up and Down keys to navigate your pet.</div><canvas id='gameCanvas' width='400' height='600'></canvas><div class='score'>Score: <span id='score'>0</span></div><script>const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); let score = 0; let petY = canvas.height / 2; const petSize = 30; const stars = []; const obstacles = []; let isGameOver = false; let speed = 1; let frame = 0; const starFrequency = 150; const obstacleFrequency = 100; function drawPet() { ctx.fillStyle = '#FF4500'; ctx.fillRect(50, petY, petSize, petSize); } function createStar() { if (frame % starFrequency === 0) { const starY = Math.random() * (canvas.height - petSize); stars.push({ x: canvas.width, y: starY }); } } function createObstacle() { if (frame % obstacleFrequency === 0) { const obstacleY = Math.random() * (canvas.height - petSize); obstacles.push({ x: canvas.width, y: obstacleY }); } } function updateStars() { for (let i = stars.length - 1; i >= 0; i--) { stars[i].x -= 5; if (stars[i].x < 0) stars.splice(i, 1); if (stars[i].x < 50 + petSize && stars[i].y < petY + petSize && stars[i].y + petSize > petY) { score++; document.getElementById('score').innerText = score; stars.splice(i, 1); } } } function updateObstacles() { for (let i = obstacles.length - 1; i >= 0; i--) { obstacles[i].x -= speed; if (obstacles[i].x < 0) obstacles.splice(i, 1); if (obstacles[i].x < 50 + petSize && obstacles[i].y < petY + petSize && obstacles[i].y + petSize > petY) { isGameOver = true; } } } function drawStars() { ctx.fillStyle = '#FFD700'; for (const star of stars) { ctx.fillRect(star.x, star.y, petSize / 2, petSize / 2); } } function drawObstacles() { ctx.fillStyle = '#8B0000'; for (const obstacle of obstacles) { ctx.fillRect(obstacle.x, obstacle.y, petSize, petSize); } } function update() { if (isGameOver) { ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = 'white'; ctx.font = '30px Arial'; ctx.fillText('Game Over', canvas.width / 4, canvas.height / 2); ctx.fillText('Score: ' + score, canvas.width / 4, canvas.height / 2 + 40); return; } ctx.clearRect(0, 0, canvas.width, canvas.height); frame++; createStar(); createObstacle(); drawStars(); drawObstacles(); updateStars(); updateObstacles(); drawPet(); } function gameLoop() { update(); if (!isGameOver) requestAnimationFrame(gameLoop); } document.addEventListener('keydown', (e) => { if (e.key === 'ArrowUp') petY -= 20; else if (e.key === 'ArrowDown') petY += 20; if (petY < 0) petY = 0; if (petY > canvas.height - petSize) petY = canvas.height - petSize; }); gameLoop(); </script></body></html>
