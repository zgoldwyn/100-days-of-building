<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Maze Challenge</title><style>* { box-sizing: border-box; } body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, #f9f9f9, #e0f7fa); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; } h1 { text-align: center; color: #00796b; } #game { position: relative; width: 300px; height: 300px; border: 2px solid #00796b; overflow: hidden; background-color: #ffffff; } .player { width: 20px; height: 20px; background-color: #ff5722; position: absolute; } .star { width: 15px; height: 15px; background-color: #ffeb3b; position: absolute; border-radius: 50%; } .trap { width: 20px; height: 20px; background-color: #f44336; position: absolute; opacity: 0.7; } #score { margin-top: 10px; text-align: center; font-size: 18px; color: #000; }</style></head><body><div><h1>Whimsical Maze Challenge</h1><div id="game"></div><div id="score">Score: 0</div><button onclick="startGame()">Start Game</button></div><script>let gameContainer = document.getElementById('game'); let scoreDisplay = document.getElementById('score'); let player; let score = 0; let traps = []; let stars = []; let gameInterval; function startGame() { score = 0; traps = []; stars = []; clearInterval(gameInterval); createPlayer(); placeStars(3); placeTraps(5); gameInterval = setInterval(gameLoop, 100); } function createPlayer() { player = document.createElement('div'); player.classList.add('player'); player.style.top = '0px'; player.style.left = '0px'; gameContainer.appendChild(player); } function placeStars(count) { for (let i = 0; i < count; i++) { let star = document.createElement('div'); star.classList.add('star'); star.style.top = Math.floor(Math.random() * 280) + 'px'; star.style.left = Math.floor(Math.random() * 280) + 'px'; gameContainer.appendChild(star); stars.push(star); } } function placeTraps(count) { for (let i = 0; i < count; i++) { let trap = document.createElement('div'); trap.classList.add('trap'); trap.style.top = Math.floor(Math.random() * 280) + 'px'; trap.style.left = Math.floor(Math.random() * 280) + 'px'; gameContainer.appendChild(trap); traps.push(trap); } } function gameLoop() { if (checkCollision(player, traps)) { alert('Game Over!'); clearInterval(gameInterval); return; } for (let star of stars) { if (checkCollision(player, [star])) { score++; scoreDisplay.innerText = 'Score: ' + score; gameContainer.removeChild(star); stars = stars.filter(s => s !== star); } } if (stars.length === 0) { alert('You won! Score: ' + score); clearInterval(gameInterval); } } function checkCollision(elem1, elements) { let rect1 = elem1.getBoundingClientRect(); for (let elem of elements) { let rect2 = elem.getBoundingClientRect(); if (!(rect1.right < rect2.left || rect1.left > rect2.right || rect1.bottom < rect2.top || rect1.top > rect2.bottom)) { return true; } } return false; } document.addEventListener('keydown', function(event) { let top = parseInt(player.style.top); let left = parseInt(player.style.left); if (event.key === 'ArrowUp') { player.style.top = Math.max(0, top - 10) + 'px'; } else if (event.key === 'ArrowDown') { player.style.top = Math.min(280, top + 10) + 'px'; } else if (event.key === 'ArrowLeft') { player.style.left = Math.max(0, left - 10) + 'px'; } else if (event.key === 'ArrowRight') { player.style.left = Math.min(280, left + 10) + 'px'; } });</script></body></html>
