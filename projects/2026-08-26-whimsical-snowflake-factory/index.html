<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Snowflake Factory</title><style>body {font-family: Arial, sans-serif; background-color: #e0f7fa; color: #004d40; text-align: center; padding: 20px;} h1 {font-size: 2em; margin-bottom: 20px;} #canvas {border: 1px dashed #00796b; background-color: #fff; margin: 20px auto; display: block;} #controls {margin: 20px;} .button {padding: 10px 20px; background-color: #00796b; color: white; border: none; cursor: pointer; border-radius: 5px;} .button:hover {background-color: #004d40;} .snowflake {display: inline-block; margin: 10px; border: 1px solid #00796b; padding: 10px; border-radius: 10px;}</style></head><body><h1>Whimsical Snowflake Factory</h1><canvas id='canvas' width='300' height='300'></canvas><div id='controls'><button id='clear' class='button'>Clear</button></div><div id='snowflakeContainer'></div><script>const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d'); let snowflakes = []; const patterns = ['❄️', '❅', '❆', '❈']; function drawSnowflake(snowflake) { ctx.save(); ctx.translate(snowflake.x, snowflake.y); ctx.scale(snowflake.scale, snowflake.scale); ctx.rotate(snowflake.rotation); ctx.fillText(snowflake.pattern, 0, 0); ctx.restore(); } function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); snowflakes.forEach(drawSnowflake); } function createSnowflake() { const pattern = patterns[Math.floor(Math.random() * patterns.length)]; const newSnowflake = { x: Math.random() * canvas.width, y: Math.random() * canvas.height, scale: Math.random() * 2 + 0.5, rotation: Math.random() * 2 * Math.PI, pattern: pattern }; snowflakes.push(newSnowflake); draw(); } function clearCanvas() { snowflakes = []; draw(); } document.getElementById('clear').addEventListener('click', clearCanvas); setInterval(createSnowflake, 500); </script></body></html>
