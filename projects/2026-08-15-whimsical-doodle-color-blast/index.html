<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Doodle Color Blast</title><style>*{box-sizing:border-box;margin:0;padding:0}body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#f0f8ff;font-family:Arial,sans-serif}canvas{border:2px dashed #3498db;cursor:pointer}.message{margin-top:20px;color:#2c3e50;font-size:18px}</style></head><body><canvas id='canvas' width='400' height='400'></canvas><div class='message'>Click to draw and create colorful explosions!</div><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let drawing=false,x,y;canvas.addEventListener('mousedown',(e)=>{drawing=true;[x,y]=[e.offsetX,e.offsetY];draw()});canvas.addEventListener('mouseup',()=>drawing=false);canvas.addEventListener('mousemove',(e)=>{if(drawing){ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='hsl('+Math.random()*360+',100%,50%)';ctx.beginPath();ctx.moveTo(x,y);[x,y]=[e.offsetX,e.offsetY];ctx.lineTo(x,y);ctx.stroke()}});canvas.addEventListener('click',(e)=>{const explosionX=e.offsetX,explosionY=e.offsetY;for(let i=0;i<30;i++){ctx.fillStyle='hsl('+Math.random()*360+',100%,50%)';ctx.beginPath();ctx.arc(explosionX,explosionY,Math.random()*25,0,Math.PI*2);ctx.fill()}});function draw(){ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='hsl('+Math.random()*360+',100%,50%)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y);ctx.stroke()}}</script></body></html>
