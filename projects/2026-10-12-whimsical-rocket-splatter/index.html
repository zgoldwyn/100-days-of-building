<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whimsical Rocket Splatter</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f0f8ff;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #333;
            background: #e6e6fa;
            position: relative;
        }
        .button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .score {
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Whimsical Rocket Splatter</h1>
    <canvas id="canvas" width="400" height="400"></canvas>
    <button class="button" id="launchButton">Launch Rocket!</button>
    <div class="score" id="scoreDisplay">Score: 0</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let score = 0;
        let clouds = [];

        class Cloud {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height * 0.5;
                this.size = 20 + Math.random() * 30;
            }
            draw() {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.size, this.size / 2, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createClouds(number) {
            for (let i = 0; i < number; i++) {
                clouds.push(new Cloud());
            }
        }

        function launchRocket() {
            const rocketX = Math.random() * canvas.width;
            const rocketY = canvas.height;
            const splatColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
            ctx.fillStyle = splatColor;
            ctx.beginPath();
            ctx.arc(rocketX, rocketY - 10, 10, 0, Math.PI * 2);
            ctx.fill();
            explodeSplat(rocketX, rocketY - 10);
        }

        function explodeSplat(x, y) {
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 20;
                const splatX = x + Math.cos(angle) * radius;
                const splatY = y + Math.sin(angle) * radius;
                ctx.beginPath();
                ctx.arc(splatX, splatY, 5, 0, Math.PI * 2);
                ctx.fill();
            }
            checkCollision(x, y);
        }

        function checkCollision(rocketX, rocketY) {
            clouds.forEach((cloud, index) => {
                const dist = Math.hypot(cloud.x - rocketX, cloud.y - rocketY);
                if (dist < cloud.size + 10) {
                    score += 10;
                    clouds.splice(index, 1);
                    document.getElementById('scoreDisplay').innerText = `Score: ${score}`;
                }
            });
        }

        document.getElementById('launchButton').addEventListener('click', launchRocket);
        createClouds(10);

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            clouds.forEach(cloud => cloud.draw());
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
