<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Jumping Sandcastle Challenge</title><style>body { font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #87CEEB; margin: 0; } #game { position: relative; width: 300px; height: 500px; border: 2px solid #fff; overflow: hidden; background: #ffcc70; } #castle { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 50px; height: 50px; background-color: #d2b48c; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; } .sand-bucket { position: absolute; width: 30px; height: 30px; background-color: #FFD700; border-radius: 5px; } .beach-ball { position: absolute; width: 30px; height: 30px; background-color: #FF6347; border-radius: 50%; } h1 { color: #fff; } #score { color: #fff; }</style></head><body><div><h1>Jumping Sandcastle Challenge</h1><div id='game'><div id='castle'></div></div><div id='score'>Score: 0</div></div><script>const gameArea = document.getElementById('game'); const castle = document.getElementById('castle'); const scoreDisplay = document.getElementById('score'); let score = 0; let gameInterval; let spawnInterval; let isGameOver = false; function startGame() { score = 0; isGameOver = false; scoreDisplay.innerText = 'Score: ' + score; gameInterval = setInterval(moveEntities, 20); spawnInterval = setInterval(spawnEntities, 1000); } function spawnEntities() { if (isGameOver) return; const random = Math.random(); const newElement = document.createElement('div'); if (random < 0.7) { // Sand bucket const sandBucket = newElement; sandBucket.className = 'sand-bucket'; sandBucket.style.left = Math.random() * (gameArea.clientWidth - 30) + 'px'; gameArea.appendChild(sandBucket); } else { // Beach ball const beachBall = newElement; beachBall.className = 'beach-ball'; beachBall.style.left = Math.random() * (gameArea.clientWidth - 30) + 'px'; gameArea.appendChild(beachBall); } newElement.style.top = '0px'; newElement.fallingInterval = setInterval(() => { const topPosition = parseInt(newElement.style.top); if (topPosition < gameArea.clientHeight) { newElement.style.top = topPosition + 5 + 'px'; } else { clearInterval(newElement.fallingInterval); newElement.remove(); } if (checkCollision(newElement)) { if (newElement.className === 'sand-bucket') { score++; scoreDisplay.innerText = 'Score: ' + score; } else { endGame(); } } }, 50); } function checkCollision(entity) { const entityRect = entity.getBoundingClientRect(); const castleRect = castle.getBoundingClientRect(); return (entityRect.bottom > castleRect.top && entityRect.right > castleRect.left && entityRect.left < castleRect.right); } function moveEntities() { const buckets = document.querySelectorAll('.sand-bucket'); const balls = document.querySelectorAll('.beach-ball'); buckets.forEach(bucket => { const bucketRect = bucket.getBoundingClientRect(); const isOutOfView = bucketRect.top > gameArea.clientHeight; if (isOutOfView) bucket.remove(); }); balls.forEach(ball => { const ballRect = ball.getBoundingClientRect(); const isOutOfView = ballRect.top > gameArea.clientHeight; if (isOutOfView) ball.remove(); }); } function endGame() { clearInterval(gameInterval); clearInterval(spawnInterval); isGameOver = true; alert('Game Over! Your score: ' + score); } document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { const leftPosition = parseInt(castle.style.left) || 50; if (leftPosition > 0) castle.style.left = leftPosition - 15 + 'px'; } else if (e.key === 'ArrowRight') { const leftPosition = parseInt(castle.style.left) || 50; if (leftPosition < gameArea.clientWidth - 50) castle.style.left = leftPosition + 15 + 'px'; } }); startGame();</script></body></html>
