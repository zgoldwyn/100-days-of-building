<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Ice Cream Scooping Game</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#f0f8ff}#game{display:flex;flex-direction:column;align-items:center}#ice-cream-cone{width:100px;height:180px;background-color:#d2a679;border-radius:50px 50px 0 0;position:relative;overflow:hidden}#scoops{position:absolute;bottom:100%;display:flex;flex-direction:column;align-items:center} .scoop{width:80px;height:50px;border-radius:50%;margin:5px;font-size:24px;display:flex;justify-content:center;align-items:center;color:white}#scoreboard{margin-top:20px;font-size:20px}#timer{position:absolute;top:10px;right:10px;font-size:32px;color:#ff69b4}button{font-size:20px;padding:10px 15px;margin-top:20px}</style></head><body><div id="game"><div id="ice-cream-cone"><div id="scoops"></div></div><div id="scoreboard">Score: <span id="score">0</span></div><div id="timer">Time: <span id="time">30</span> sec</div><button id="start">Start Game</button></div><script>let score = 0;let time = 30;let interval;const scoopsColors = ['#ffcccb', '#ffc0cb', '#ffb6c1', '#ff69b4'];const toppingsColors = ['#fff', '#8B4513'];const scoopElement = document.getElementById('scoops');const scoreElement = document.getElementById('score');const timeElement = document.getElementById('time');const startButton = document.getElementById('start');function startGame(){score = 0;time = 30;scoreElement.textContent = score;timeElement.textContent = time;clearInterval(interval);scoopElement.innerHTML = '';interval = setInterval(() => {if(time > 0){createScoop();time--;}else{endGame();}}, 1000);}function createScoop(){const scoop = document.createElement('div');scoop.className = 'scoop';scoop.style.backgroundColor = scoopsColors[Math.floor(Math.random() * scoopsColors.length)];scoop.textContent = '🍦';scoopElement.appendChild(scoop);scoop.style.transform = 'translateY(-100%)';scoop.animate([{transform: 'translateY(-100%)'},{transform: 'translateY(0)'}], {duration: 1000, easing: 'ease-in-out'});setTimeout(() => {scoop.remove();score++;scoreElement.textContent = score;}, 1000);}function endGame(){clearInterval(interval);alert(`Game Over! Your score: ${score}`);scoopElement.innerHTML = ''; scoreElement.textContent = score; timeElement.textContent = 0;}startButton.addEventListener('click', startGame);</script></body></html>
