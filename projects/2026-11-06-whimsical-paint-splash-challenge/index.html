<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Paint Splash Challenge</title><style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#f0f8ff;}canvas{border:2px solid #333;cursor:pointer;}#score{position:absolute;top:10px;left:10px;font-size:24px;color:#333;}</style></head><body><div id='score'>Score: 0</div><canvas id='canvas' width='500' height='500'></canvas><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let score=0;let targets=[];class Target{constructor(x,y){this.x=x;this.y=y;this.radius=20;}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fillStyle='red';ctx.fill();ctx.closePath();}}function createTargets(){for(let i=0;i<5;i++){const x=Math.random()*(canvas.width-40)+20;const y=Math.random()*(canvas.height-40)+20;targets.push(new Target(x,y));}}function drawTargets(){ctx.clearRect(0,0,canvas.width,canvas.height);targets.forEach(target=>target.draw());}function increaseScore(){score+=10;document.getElementById('score').innerText='Score: '+score;}canvas.addEventListener('click',function(event){const rect=canvas.getBoundingClientRect();const mouseX=event.clientX-rect.left;const mouseY=event.clientY-rect.top;targets.forEach((target,index)=>{const dx=mouseX-target.x;const dy=mouseY-target.y;if(Math.sqrt(dx*dx+dy*dy)<target.radius){targets.splice(index,1);increaseScore();}});drawTargets();});createTargets();drawTargets();setInterval(function(){if(targets.length<5){const x=Math.random()*(canvas.width-40)+20;const y=Math.random()*(canvas.height-40)+20;targets.push(new Target(x,y));}},2000);</script></body></html>
