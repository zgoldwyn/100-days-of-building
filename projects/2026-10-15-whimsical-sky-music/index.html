<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Sky Music</title><style>body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #87CEFA; font-family: Arial, sans-serif; } .cloud { width: 100px; height: 60px; background: white; border-radius: 50%; position: relative; cursor: pointer; transition: transform 0.3s; } .cloud::after, .cloud::before { content: ''; width: 80px; height: 40px; background: white; border-radius: 50%; position: absolute; } .cloud::after { top: -30px; left: 10px; } .cloud::before { bottom: -30px; right: 10px; } .play-area { display: flex; gap: 20px; } .score { position: absolute; top: 20px; left: 20px; font-size: 1.5em; } </style></head><body><div class='score'>Score: <span id='score'>0</span></div><div class='play-area' id='playArea'></div><script>const playArea = document.getElementById('playArea'); const scoreDisplay = document.getElementById('score'); let score = 0; const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B']; const sounds = notes.map(note => new Audio(`data:audio/wav;base64,UklGRhAIAABXQW5zFVhZNVBPTIdiRxGQH0JAfDBSYWiGQRgnW3M0AABHLWkgWf//gBMSAAAAAAgv0H5cBAAGLAEAAZgsgAAA=..calculated sound for note ${note}`)); for (let i = 0; i < 5; i++) { const cloud = document.createElement('div'); cloud.className = 'cloud'; cloud.style.transform = `translateY(${Math.random() * 200}px)`; cloud.addEventListener('click', () => playSound(note)); playArea.appendChild(cloud); } function playSound(note) { sounds[note].play(); score++; scoreDisplay.innerText = score; } </script></body></html>
