<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Swap Squares</title><style>body{font-family:Arial,sans-serif;background-color:#f0f0f0;margin:0;padding:20px;text-align:center}.container{margin:0 auto;display:grid;grid-template-columns:repeat(3,100px);grid-gap:10px;justify-content:center}.square{width:100px;height:100px;cursor:pointer;border:2px solid #333;transition:background-color 0.3s}.target{font-size:24px;margin-bottom:20px}.result{font-size:20px;margin-top:20px;color:red}</style></head><body><h1>Color Swap Squares</h1><div class='target'>Match the color: <span id='targetColor'></span></div><div class='container' id='squareContainer'></div><div><button id='startBtn'>Start Game</button></div><div class='result' id='result'></div><script>const colors=['#FF5733','#33FF57','#3357FF','#F1C40F','#9B59B6','#E74C3C'],targetColorDiv=document.getElementById('targetColor'),squareContainer=document.getElementById('squareContainer'),startBtn=document.getElementById('startBtn'),resultDiv=document.getElementById('result');let squares, targetColor, timer;function startGame(){resultDiv.textContent='';resetSquares();targetColor=colors[Math.floor(Math.random()*colors.length)];targetColorDiv.style.color=targetColor;targetColorDiv.textContent=targetColor;timer=10;startTimer();}function startTimer(){let countdown=setInterval(()=>{timer--;if(timer<=0){clearInterval(countdown);resultDiv.textContent='Time is up!';stopGame();}if(timer<6) resultDiv.textContent='Hurry up! You have '+timer+' seconds left!';},1000);}function resetSquares(){squareContainer.innerHTML='';squares=colors.map(color=>{const square=document.createElement('div');square.className='square';square.style.backgroundColor=color;square.addEventListener('click',()=>checkColorMatch(color));squareContainer.appendChild(square);return square;});}function checkColorMatch(color){if(color===targetColor){resultDiv.textContent='You matched the color!';stopGame();}else{resultDiv.textContent='Wrong color! Try again.';}}function stopGame(){clearInterval(timer);}startBtn.addEventListener('click',startGame);</script></body></html>
