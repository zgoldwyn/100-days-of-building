<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Bouncing Ball Challenge</title><style>body{display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background-color:#e0f7fa;overflow:hidden;}canvas{border:2px solid #004d40;}h1{position:absolute;top:10px;color:#004d40;}#score{position:absolute;top:50px;right:20px;color:#004d40;}</style></head><body><h1>Bouncing Ball Challenge</h1><div id='score'>Score: 0</div><canvas id='gameCanvas' width='800' height='600'></canvas><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');let ballRadius=15;let x=ballRadius+50;let y=canvas.height/2;let dx=2;let dy=2;let stars=[];let score=0;let isGameOver=false;let speedIncrement=0.1;for(let i=0;i<5;i++){stars.push({x:Math.random()*(canvas.width-30),y:Math.random()*(canvas.height-30),col:'gold'})}document.addEventListener('keydown',moveBall);function moveBall(event){if(event.key==='ArrowUp'){dy=-2;}else if(event.key==='ArrowDown'){dy=2;}}function detectCollision(){for(let star of stars){if(x+ballRadius>star.x && x-ballRadius<star.x+30 && y+ballRadius>star.y && y-ballRadius<star.y+30){stars.splice(stars.indexOf(star),1);score++;addStar();}}}function addStar(){stars.push({x:Math.random()*(canvas.width-30),y:Math.random()*(canvas.height-30),col:'gold'});if(score%5==0){dx+=speedIncrement;dy+=speedIncrement;}}function drawBall(){ctx.beginPath();ctx.arc(x,y,ballRadius,0,Math.PI*2);ctx.fillStyle='#29b6f6';ctx.fill();ctx.closePath();}function drawStars(){for(let star of stars){ctx.fillStyle=star.col;ctx.fillRect(star.x,star.y,30,30);}}function draw(){if(isGameOver){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillText('Game Over',canvas.width/2,canvas.height/2);return;}ctx.clearRect(0,0,canvas.width,canvas.height);drawBall();drawStars();detectCollision();x+=dx;y+=dy;if(x+ballRadius>canvas.width||x-ballRadius<0){dx=-dx;}if(y+ballRadius>canvas.height||y-ballRadius<0){dy=-dy;}document.getElementById('score').innerText='Score: '+score;requestAnimationFrame(draw);}draw();</script></body></html>
