<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Plant Puzzle</title><style>body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: Arial, sans-serif; background-color: #f0f8ff; } h1 { color: #4caf50; } #game-container { display: flex; flex-wrap: wrap; width: 220px; margin: 20px; } .tile { width: 60px; height: 60px; border: 2px solid #4caf50; background-color: #fff; margin: 2px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: transform 0.2s; } .tile:hover { transform: scale(1.1); } #timer { font-size: 20px; } #score { font-size: 20px; } button { margin-top: 20px; padding: 10px 20px; font-size: 16px; border: none; background-color: #4caf50; color: white; cursor: pointer; } button:hover { background-color: #45a049; }</style></head><body><h1>Whimsical Plant Puzzle</h1><div id="timer">Time: <span id="time">30</span>s</div><div id="score">Score: <span id="score-value">0</span></div><div id="game-container"></div><button id="restart">Restart</button><script>const tiles = ["🌱", "🌿", "🍃", "🌻", "🌼", "🌷", "🍂", "🌳"]; let score = 0; let time = 30; let timer; const gameContainer = document.getElementById('game-container'); const timeDisplay = document.getElementById('time'); const scoreDisplay = document.getElementById('score-value'); const restartButton = document.getElementById('restart'); function startGame() { resetGame(); setTimer(); createTiles(); } function resetGame() { gameContainer.innerHTML = ''; score = 0; time = 30; updateScoreDisplay(); updateTimeDisplay(); clearInterval(timer); } function createTiles() { const shuffledTiles = tiles.sort(() => 0.5 - Math.random()).slice(0, 8); shuffledTiles.forEach((tile) => { const tileElement = document.createElement('div'); tileElement.classList.add('tile'); tileElement.innerText = tile; tileElement.onclick = () => handleTileClick(tileElement); gameContainer.appendChild(tileElement); }); } function handleTileClick(tile) { if (tile.classList.contains('correct')) { score++; updateScoreDisplay(); tile.style.backgroundColor = '#d4edda'; tile.onclick = null; } else { score--; updateScoreDisplay(); } if (score >= 8) { alert('You won!'); clearInterval(timer); } } function setTimer() { timer = setInterval(() => { time--; updateTimeDisplay(); if (time <= 0) { alert('Time up! Game over! Your score: ' + score); clearInterval(timer); } }, 1000); } function updateTimeDisplay() { timeDisplay.innerText = time; } function updateScoreDisplay() { scoreDisplay.innerText = score; } restartButton.onclick = startGame; startGame();</script></body></html>
