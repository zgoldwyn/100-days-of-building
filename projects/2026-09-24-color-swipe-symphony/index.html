<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Swipe Symphony</title><style>body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; margin: 0; } #board { display: flex; flex-wrap: wrap; width: 300px; height: 300px; } .panel { width: 100px; height: 100px; margin: 1px; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; transition: transform 0.2s; } h1 { position: absolute; top: 20px; font-size: 24px; text-align: center; width: 100%; } .pressed { transform: scale(1.1); }</style></head><body><h1>Swipe to Create Music!</h1><div id='board'></div><script>const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange', 'pink', 'cyan']; const sounds = ['note1.mp3', 'note2.mp3', 'note3.mp3', 'note4.mp3', 'note5.mp3', 'note6.mp3', 'note7.mp3', 'note8.mp3']; let board = document.getElementById('board'); for (let i = 0; i < colors.length; i++) { let panel = document.createElement('div'); panel.classList.add('panel'); panel.style.backgroundColor = colors[i]; panel.dataset.sound = sounds[i]; panel.addEventListener('mousedown', playSound); panel.addEventListener('mouseenter', () => panel.classList.add('pressed')); panel.addEventListener('mouseleave', () => panel.classList.remove('pressed')); board.appendChild(panel); } function playSound(e) { let sound = new Audio(e.target.dataset.sound); sound.play(); } board.addEventListener('touchstart', function(event) { event.preventDefault(); let touch = event.touches[0]; let element = document.elementFromPoint(touch.clientX, touch.clientY); if (element.classList.contains('panel')) { playSound({target: element}); } });</script></body></html>
