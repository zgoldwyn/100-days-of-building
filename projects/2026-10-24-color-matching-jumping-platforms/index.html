<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Matching Jumping Platforms</title><style>body { font-family: Arial, sans-serif; background-color: #f0f8ff; overflow: hidden; margin: 0; }#gameCanvas { background: #87ceeb; display: block; margin: 0 auto; border: 2px solid #333; }#score { text-align: center; font-size: 24px; }#startButton { display: block; margin: 20px auto; padding: 10px 20px; font-size: 18px; cursor: pointer; }</style></head><body><div id='score'>Score: 0</div><canvas id='gameCanvas' width='400' height='600'></canvas><button id='startButton'>Start Game</button><script>const canvas = document.getElementById('gameCanvas');const ctx = canvas.getContext('2d');let score = 0;let gameInterval;let platforms = [];let targetColor;const colors = ['red', 'green', 'blue', 'yellow', 'purple'];function startGame() { score = 0; platforms = []; targetColor = chooseColor(); document.getElementById('score').textContent = 'Score: ' + score; document.getElementById('startButton').style.display = 'none'; createPlatforms(); gameInterval = setInterval(updateGame, 1000 / 60); }function chooseColor() { return colors[Math.floor(Math.random() * colors.length)];}function createPlatforms() {for (let i = 0; i < 5; i++) {const platform = { x: Math.random() * (canvas.width - 100), y: i * 100 + 100, color: chooseColor(), width: 100, height: 20 }; platforms.push(platform);}}function updateGame() { ctx.clearRect(0, 0, canvas.width, canvas.height); platforms.forEach((platform) => {ctx.fillStyle = platform.color; ctx.fillRect(platform.x, platform.y, platform.width, platform.height);});ctx.fillStyle = targetColor; ctx.fillRect(10, 10, 30, 30); checkPlatformCollision();}function checkPlatformCollision() { platforms.forEach((platform) => {if (Math.random() < 0.02) {platform.color = chooseColor();} if (Math.random() < 0.01) {platform.y -= 5;} if (platform.y < 0) {platform.y = 600; platform.x = Math.random() * (canvas.width - 100); if (platform.color === targetColor) {score++; document.getElementById('score').textContent = 'Score: ' + score;}}});}document.addEventListener('keydown', (e) => { if (e.key === ' ') { jump();}});function jump() { platforms.forEach((platform) => { if (platform.color === targetColor) { alert('Jump successful! Score: ' + score);}}); targetColor = chooseColor();}document.getElementById('startButton').addEventListener('click', startGame);</script></body></html>
