<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Shape Creator</title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#f0f8ff;}canvas{border:2px solid #2196F3;}#controls{margin-top:20px;}button{padding:10px;cursor:pointer;margin:5px;}</style></head><body><h1>Whimsical Shape Creator</h1><canvas id='canvas' width='500' height='500'></canvas><div id='controls'><button id='rectangle-btn'>Add Rectangle</button><button id='circle-btn'>Add Circle</button><button id='clear-btn'>Clear Canvas</button></div><script>const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');let shapes=[];function drawShapes(){ctx.clearRect(0,0,canvas.width,canvas.height);shapes.forEach(shape=>{ctx.fillStyle=shape.color;ctx.fillRect(shape.x,shape.y,shape.width,shape.height);});}function addCircle(){const radius=Math.floor(Math.random()*50+20);const x=Math.floor(Math.random()*(canvas.width-2*radius)+radius);const y=Math.floor(Math.random()*(canvas.height-2*radius)+radius);shapes.push({x:x-radius,y:y-radius,diameter:radius*2,color:getRandomColor()});drawCircle(x,y,radius);localStorage.setItem('shapes',JSON.stringify(shapes));}function drawCircle(x,y,radius){ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fillStyle=getRandomColor();ctx.fill();ctx.closePath();}function addRectangle(){const width=Math.floor(Math.random()*100+20);const height=Math.floor(Math.random()*100+20);const x=Math.floor(Math.random()*(canvas.width-width));const y=Math.floor(Math.random()*(canvas.height-height));shapes.push({x:x,y:y,width:width,height:height,color:getRandomColor()});drawShapes();localStorage.setItem('shapes',JSON.stringify(shapes));}function clearShapes(){shapes=[];ctx.clearRect(0,0,canvas.width,canvas.height);localStorage.removeItem('shapes');}function getRandomColor(){const letters='0123456789ABCDEF';let color='#';for(let i=0;i<6;i++)color+=letters[Math.floor(Math.random()*16)];return color;}document.getElementById('rectangle-btn').addEventListener('click',addRectangle);document.getElementById('circle-btn').addEventListener('click',addCircle);document.getElementById('clear-btn').addEventListener('click',clearShapes);window.onload=()=>{const savedShapes=localStorage.getItem('shapes');if(savedShapes){shapes=JSON.parse(savedShapes);drawShapes();}};</script></body></html>
