<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Color Flipper Wheel</title><style>body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;background:#f0f0f0;font-family:sans-serif}h1{margin-bottom:0.5em;color:#333}#wheel{width:200px;height:200px;border-radius:50%;border:8px solid #444;box-shadow:0 0 10px rgba(0,0,0,0.2);position:relative;cursor:pointer;transition:border-color 0.3s}#pointer{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:25px solid #444;position:absolute;top:-25px;left:calc(50% - 15px)}#color-code{margin-top:1em;font-size:1.2em;color:#222;user-select:none}#spin-btn{margin-top:1.5em;padding:0.5em 1.2em;background:#444;color:#fff;border:none;border-radius:5px;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,0.2);transition:background 0.3s}#spin-btn:hover{background:#222}</style></head><body><h1>Color Flipper Wheel</h1><div id="wheel" title="Click or Spin button to spin"><div id="pointer"></div></div><button id="spin-btn">Spin</button><div id="color-code">#FFFFFF</div><script>const wheel=document.getElementById('wheel');const spinBtn=document.getElementById('spin-btn');const colorCode=document.getElementById('color-code');const colors=["#e63946","#f1faee","#a8dadc","#457b9d","#1d3557","#ffb703","#fb8500","#023047","#ff6363","#8ecae6","#219ebc","#ffb7b2","#b5ead7","#ffe066","#ff6f91"];let spinning=false;function spinWheel(){if(spinning)return;spinning=true;const segments=colors.length;const rndSpins=Math.floor(Math.random()*3)+3;const rndDegree=Math.floor(Math.random()*360);const totalDegree=360*rndSpins+rndDegree;wheel.style.transition='transform 4s cubic-bezier(0.33, 1, 0.68, 1)';wheel.style.transform=`rotate(${totalDegree}deg)`;setTimeout(()=>{const finalDegree=totalDegree%360;const segmentSize=360/segments;const index=segments-1-Math.floor(finalDegree/segmentSize);const color=colors[index<0?0:index];wheel.style.transition='none';const normalizedDegree=finalDegree - finalDegree % segmentSize + segmentSize/2;wheel.style.transform=`rotate(${normalizedDegree}deg)`;colorCode.textContent=color;document.body.style.backgroundColor=color;spinning=false;},4000);}function drawWheel(){const ctx = document.createElement('canvas').getContext('2d');const size=200;ctx.canvas.width=size;ctx.canvas.height=size;const center=size/2;const radius=center-10;const segmentAngle=(2*Math.PI)/colors.length;ctx.clearRect(0,0,size,size);for(let i=0;i<colors.length;i++){ctx.beginPath();ctx.moveTo(center,center);ctx.arc(center,center,radius,i*segmentAngle,(i+1)*segmentAngle,false);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.stroke();}wheel.style.backgroundImage=`url(${ctx.canvas.toDataURL()})`;wheel.style.backgroundSize='cover';}wheel.addEventListener('click',spinWheel);spinBtn.addEventListener('click',spinWheel);drawWheel();</script></body></html>
