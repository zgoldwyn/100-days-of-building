<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Flower Painter</title><style>body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #e0f7fa; font-family: 'Arial', sans-serif; } h1 { color: #2c3e50; } canvas { border: 2px solid #4a90e2; cursor: pointer; } #tools { margin-top: 20px; display: flex; gap: 10px; } button { padding: 10px 15px; background: #4a90e2; color: white; border: none; border-radius: 5px; cursor: pointer; } button:hover { background: #357ab8; }</style></head><body><h1>Whimsical Flower Painter</h1><canvas id='canvas' width='400' height='400'></canvas><div id='tools'><button id='colorBtn'>Choose Color</button><button id='resetBtn'>Reset</button></div><script>const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d'); let flowerColor = '#ff69b4'; let flowers = []; function drawFlower(x, y, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y); for (let i = 0; i < 8; i++) { ctx.bezierCurveTo(x + 20, y - 10, x + 10, y - 30, x, y); ctx.bezierCurveTo(x - 10, y - 30, x - 20, y - 10, x, y); } ctx.closePath(); ctx.fill(); } function animateFlower(x, y, color) { drawFlower(x, y, color); flowers.push({ x, y, color }); setTimeout(() => { ctx.clearRect(0, 0, canvas.width, canvas.height); flowers.forEach(f => drawFlower(f.x, f.y, f.color)); }, 100); } canvas.addEventListener('click', (e) => { const rect = canvas.getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top; animateFlower(x, y, flowerColor); }); document.getElementById('colorBtn').addEventListener('click', () => { const newColor = prompt('Enter a color (name or hex):', flowerColor); if (newColor) flowerColor = newColor; }); document.getElementById('resetBtn').addEventListener('click', () => { ctx.clearRect(0, 0, canvas.width, canvas.height); flowers = []; });</script></body></html>
