<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Symphonic Doodle Waves</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#d4e157}canvas{border:2px solid #388e3c;cursor:crosshair}#instructions{position:absolute;top:10px;left:10px;background:white;padding:10px;border-radius:5px;box-shadow:0 0 10px rgba(0,0,0,0.3)}#instructions p{margin:0}</style></head><body><div id='instructions'><p>Draw to create sound waves!</p><p>Click to listen to your doodles.</p><p>Clear the canvas with the button.</p><button onclick='clearCanvas()'>Clear</button></div><canvas id='canvas' width='600' height='400'></canvas><script>const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');let drawing=false;const audioContext=new (window.AudioContext||window.webkitAudioContext)();canvas.addEventListener('mousedown',startDrawing);canvas.addEventListener('mouseup',stopDrawing);canvas.addEventListener('mousemove',draw);function startDrawing(e){drawing=true;draw(e);}function stopDrawing(){drawing=false;ctx.beginPath();}function draw(e){if(!drawing)return;ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='blue';ctx.lineTo(e.clientX-canvas.getBoundingClientRect().left,e.clientY-canvas.getBoundingClientRect().top);ctx.stroke();ctx.beginPath();ctx.moveTo(e.clientX-canvas.getBoundingClientRect().left,e.clientY-canvas.getBoundingClientRect().top);playSound((e.clientY-canvas.getBoundingClientRect().top)/canvas.height);}function playSound(frequency){const oscillator=audioContext.createOscillator();oscillator.type='sine';oscillator.frequency=frequency*500;oscillator.connect(audioContext.destination);oscillator.start();oscillator.stop(audioContext.currentTime+0.1);}function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);}</script></body></html>
