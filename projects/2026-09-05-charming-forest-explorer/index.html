<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Charming Forest Explorer</title><style>body { font-family: 'Arial', sans-serif; background-color: #e0f7fa; margin: 0; text-align: center; } h1 { color: #2e7d32; } .forest { height: 400px; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAZklEQVR42mNgGJgDLPUBMRmg5QKAwwhBQABA2WhYx6TQAAAAAElFTkSuQmCC') repeat-x; position: relative; } .item { position: absolute; width: 40px; height: 40px; } .score { font-size: 20px; color: #e64a19; } button { margin: 20px; padding: 10px; font-size: 16px; border: none; background-color: #4caf50; color: white; cursor: pointer; } button:hover { background-color: #45a049; } </style></head><body><h1>Charming Forest Explorer</h1><div class='forest' id='forest'></div><div><span class='score'>Score: <span id='score'>0</span></span></div><button id='restart'>Restart</button><script>let score = 0; let itemCount = 5; const scoreDisplay = document.getElementById('score'); const forest = document.getElementById('forest'); const restartBtn = document.getElementById('restart'); const generateItem = () => { const item = document.createElement('div'); item.className = 'item'; item.style.left = Math.random() * (forest.offsetWidth - 40) + 'px'; item.style.top = Math.random() * (forest.offsetHeight - 40) + 'px'; item.style.backgroundColor = 'orange'; item.onclick = () => { score += 1; scoreDisplay.textContent = score; item.remove(); generateItem(); }; forest.appendChild(item); }; const startGame = () => { score = 0; scoreDisplay.textContent = score; forest.innerHTML = ''; for (let i = 0; i < itemCount; i++) generateItem(); }; restartBtn.onclick = startGame; window.onload = startGame;</script></body></html>
