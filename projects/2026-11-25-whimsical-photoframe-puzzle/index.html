<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Photo Frame Puzzle</title><style>body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f9f9f9; margin: 0; } #game { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 5px; } .tile { width: 100px; height: 100px; background-color: #e2e2e2; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; border: 2px solid #ccc; border-radius: 5px; } .hidden { background-color: transparent; border: none; } #timer { margin-top: 20px; font-size: 24px; } </style></head><body><div id='game'></div><div id='timer'>Time Left: <span id='time'>30</span> seconds</div><script>const grid = document.getElementById('game'); const timerDisplay = document.getElementById('time'); let timeLeft = 30; let blankIndex = 8; const images = ['1', '2', '3', '4', '5', '6', '7', '8', '']; function createTiles() { grid.innerHTML = ''; images.forEach((image, index) => { const tile = document.createElement('div'); tile.className = 'tile' + (image === '' ? ' hidden' : ''); tile.textContent = image; tile.dataset.index = index; tile.addEventListener('click', () => moveTile(index)); grid.appendChild(tile); }); } function moveTile(index) { if (isAdjacent(index, blankIndex)) { [images[index], images[blankIndex]] = [images[blankIndex], images[index]]; blankIndex = index; createTiles(); checkWin(); } } function isAdjacent(index1, index2) { const row1 = Math.floor(index1 / 3), col1 = index1 % 3; const row2 = Math.floor(index2 / 3), col2 = index2 % 3; return (Math.abs(row1 - row2) + Math.abs(col1 - col2) === 1); } function checkWin() { if (images.join('') === '12345678') { alert('Congratulations! You solved the puzzle!'); clearInterval(timerId); } } let timerId = setInterval(() => { timeLeft--; timerDisplay.textContent = timeLeft; if (timeLeft <= 0) { clearInterval(timerId); alert('Time up! Try again!'); resetGame(); } }, 1000); function resetGame() { timeLeft = 30; createTiles(); } resetGame(); </script></body></html>
