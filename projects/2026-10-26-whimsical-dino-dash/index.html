<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Dino Dash</title><style>body { font-family: Arial, sans-serif; background-color: #e0f7fa; margin: 0; overflow: hidden; } h1 { text-align: center; color: #00796b; } canvas { display: block; margin: 0 auto; background-color: #b2dfdb; border: 2px solid #00796b; }</style></head><body><h1>Whimsical Dino Dash</h1><canvas id="gameCanvas" width="800" height="400"></canvas><script>const canvas = document.getElementById('gameCanvas'); const context = canvas.getContext('2d'); let dinoX = 50; let dinoY = 300; let rocks = []; let score = 0; let isJumping = false; const gravity = 0.5; const jumpHeight = -10; let jumpVelocity = 0; let gameOver = false; let frameCount = 0; document.addEventListener('keydown', (e) => { if (e.code === 'Space' && !isJumping) { jumpVelocity = jumpHeight; isJumping = true; } }); function spawnRock() { const rockX = canvas.width; const rockY = 300; rocks.push({ x: rockX, y: rockY }); } function update() { if (gameOver) return; context.clearRect(0, 0, canvas.width, canvas.height); context.fillStyle = '#4db6ac'; context.fillRect(dinoX, dinoY, 50, 50); rocks.forEach((rock, index) => { context.fillStyle = '#795548'; context.fillRect(rock.x, rock.y, 30, 30); rock.x -= 5; if (rock.x < 0) rocks.splice(index, 1); if (rock.x < dinoX + 50 && rock.x + 30 > dinoX && rock.y < dinoY + 50 && rock.y + 30 > dinoY) { gameOver = true; } }); if (isJumping) { dinoY += jumpVelocity; jumpVelocity += gravity; if (dinoY >= 300) { dinoY = 300; isJumping = false; } } if (++frameCount % 100 === 0) { spawnRock(); score++; } context.fillStyle = '#000'; context.font = '20px Arial'; context.fillText('Score: ' + score, 10, 20); if (gameOver) { context.fillText('Game Over! Press R to Restart', canvas.width / 4, canvas.height / 2); } } function gameLoop() { update(); requestAnimationFrame(gameLoop); } gameLoop(); document.addEventListener('keydown', (e) => { if (e.code === 'KeyR' && gameOver) { rocks = []; score = 0; isJumping = false; dinoY = 300; gameOver = false; frameCount = 0; } });</script></body></html>
