<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Color Quest Wizard</title><style>body{font-family:sans-serif;background-color:#f0f8ff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}#game{border:2px solid #654321;border-radius:10px;padding:20px;background:white;box-shadow:0 0 15px rgba(0,0,0,0.2);}h1{font-size:2em;color:#3b5998;}#colors{display:flex;justify-content:space-around;margin:15px 0;}button{width:100px;height:100px;border:none;border-radius:10px;cursor:pointer;}#start{display:block;margin:10px auto;background-color:#3b5998;color:white;}#status{margin-top:15px;}</style></head><body><div id='game'><h1>Color Quest Wizard</h1><div id='colors'></div><button id='start'>Start Game</button><div id='status'></div></div><script>const colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33A1'];let score = 0;let specters = 5;let gameActive = false;const colorsDiv = document.getElementById('colors');const startButton = document.getElementById('start');const statusDiv = document.getElementById('status');function generateColors(){colorsDiv.innerHTML='';colors.forEach((color)=>{const btn=document.createElement('button');btn.style.backgroundColor=color;btn.addEventListener('click',()=>{if(gameActive){castSpell(color);}});colorsDiv.appendChild(btn);});}function castSpell(selectedColor){if(selectedColor===colors[Math.floor(Math.random()*colors.length)]){score+=10;statusDiv.innerText='Spell cast successfully! Your score: '+score;}else{statusDiv.innerText='Spell failed! Try again!';specters-=1;}if(specters<=0){endGame();}}function startGame(){score=0;specters=5;gameActive=true;statusDiv.innerText='Cast your spells!';generateColors();}function endGame(){gameActive=false;statusDiv.innerText='Game over! Final score: '+score;colorsDiv.innerHTML='';}startButton.addEventListener('click',startGame);</script></body></html>
