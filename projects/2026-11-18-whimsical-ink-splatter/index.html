<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Ink Splatter</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#f0f8ff;flex-direction:column;}.canvas-container{border:1px solid #333;position:relative;}.canvas{border:1px solid black;cursor:crosshair;}h1{font-family:sans-serif;color:#333;}.score{font-size:1.5rem;}</style></head><body><h1>Whimsical Ink Splatter</h1><div class="canvas-container"><canvas id="canvas" width="600" height="400" class="canvas"></canvas><div id="inkcritters"></div></div><div class="score">Score: <span id="score">0</span></div><button id="reset">Reset Game</button><script>const canvas = document.getElementById('canvas');const ctx = canvas.getContext('2d');let score = 0;let critters = [];let gameActive = true;const maxCritters = 5;const critterSize = 20;const targetSize = 50;const colors = ['#FF5733','#33FF57','#3357FF','#FF33A1','#FFC300'];function randomColor() {return colors[Math.floor(Math.random() * colors.length)];}function drawInkSplatter(x, y) {ctx.beginPath();ctx.arc(x, y, targetSize, 0, Math.PI * 2);ctx.fillStyle = randomColor();ctx.fill();ctx.closePath();}function drawCritter(x, y) {ctx.beginPath();ctx.arc(x, y, critterSize, 0, Math.PI * 2);ctx.fillStyle = '#000';ctx.fill();ctx.closePath();}function spawnCritters() {while (critters.length < maxCritters) {const x = Math.random() * (canvas.width - critterSize * 2) + critterSize;const y = Math.random() * (canvas.height - critterSize * 2) + critterSize;critters.push({x, y});}}function updateCritters() {ctx.clearRect(0, 0, canvas.width, canvas.height);drawInkSplatter(event.clientX - canvas.offsetLeft, event.clientY - canvas.offsetTop);for (let i = 0; i < critters.length; i++) {const {x, y} = critters[i];drawCritter(x, y);if (Math.hypot(event.clientX - canvas.offsetLeft - x, event.clientY - canvas.offsetTop - y) < critterSize + targetSize) {score++;document.getElementById('score').innerText = score;critters.splice(i, 1);i--;}}}function animate() {if (!gameActive) return;spawnCritters();canvas.addEventListener('mousemove', updateCritters);setTimeout(() => {ctx.clearRect(0, 0, canvas.width, canvas.height);drawInkSplatter(event.clientX - canvas.offsetLeft, event.clientY - canvas.offsetTop);animate();}, 1000/30);}document.getElementById('reset').addEventListener('click', () => {score = 0;critters = [];ctx.clearRect(0, 0, canvas.width, canvas.height);document.getElementById('score').innerText = score;animate();});animate();</script></body></html>
