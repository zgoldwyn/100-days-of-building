name: Generate daily mini project

on:
  schedule:
    # 12:17 UTC = 5:17 AM PDT / 4:17 AM PST
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  generate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate mini project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PYTHON'
          import json
          import os
          import pathlib
          import re
          import urllib.request
          from datetime import datetime, timezone

          root = pathlib.Path(".")
          projects_dir = root / "projects"
          projects_dir.mkdir(exist_ok=True)

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # Prevent more than one generated project on the same UTC day.
          existing_today = list(projects_dir.glob(f"{today}-*"))

          if existing_today:
              print(
                  f"A project already exists for {today}: "
                  f"{existing_today[0]}"
              )
              raise SystemExit(0)

          # Read existing project README files so the model can avoid
          # generating duplicate or highly similar projects.
          existing_projects = []

          for project_dir in sorted(projects_dir.iterdir()):
              if not project_dir.is_dir():
                  continue

              readme_path = project_dir / "README.md"

              if readme_path.exists():
                  readme_text = readme_path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )

                  # Limit each README excerpt to control token usage.
                  readme_excerpt = readme_text[:1000].strip()

                  existing_projects.append(
                      f"Folder: {project_dir.name}\n"
                      f"README:\n{readme_excerpt}"
                  )
              else:
                  existing_projects.append(
                      f"Folder: {project_dir.name}\n"
                      "README: unavailable"
                  )

          # Only compare against the most recent 100 projects.
          recent_projects = existing_projects[-100:]
          existing_text = "\n\n---\n\n".join(recent_projects)

          if not existing_text:
              existing_text = "No previous projects exist."

          prompt = f"""
          Create one original, polished, small browser project that is fun
          to explore.

          Requirements:
          - Do not duplicate or closely resemble any existing project below.
          - Compare the title, purpose, interaction, visual style, and core
            mechanic against previous projects.
          - Choose a project type that adds variety: mini-game, puzzle,
            simulation, creative toy, visualization, productivity tool,
            learning tool, or utility.
          - Prefer playful ideas such as reaction games, timing challenges,
            physics toys, pattern puzzles, drawing tools, memory games,
            generators, and simulations.
          - Avoid basic counters, calculators, to-do lists, color pickers,
            password generators, simple quizzes, and weather-style dashboards
            unless the concept has a genuinely unusual mechanic.
          - Use only plain HTML, CSS, and JavaScript.
          - Put everything in one index.html file.
          - Do not use packages, external APIs, external images, CDNs,
            frameworks, or build tools.
          - The project must work by opening index.html in a browser.
          - Keep the scope manageable for one self-contained file.
          - A typical project may be around 150 to 450 lines, but there is no
            strict line limit.
          - Prioritize a complete, working project over hitting a line count.
          - Include responsive styling and clear instructions.
          - Include at least two meaningful interactions or mechanics.
          - For games, include at least one of: scoring, timer, levels,
            win condition, lose condition, difficulty progression, or replay.
          - Use localStorage when saved settings, progress, or high scores
            would meaningfully improve the project.
          - Make the interface visually distinct from previous projects.
          - Avoid dangerous, deceptive, offensive, or security-sensitive code.
          - Do not use markdown code fences.
          - Return only valid JSON.

          Required JSON structure:
          {{
            "name": "short-kebab-case-name",
            "title": "Readable Project Title",
            "description": "One-sentence description.",
            "project_type": "mini-game, puzzle, simulation, creative-toy, visualization, productivity, learning, or utility",
            "core_mechanics": [
              "short mechanic name",
              "another mechanic"
            ],
            "index_html": "<!DOCTYPE html>..."
          }}

          Existing projects and README summaries:

          {existing_text}
          """

          payload = {
              "model": "openai/gpt-4.1-mini",
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You create polished, safe, self-contained browser "
                          "projects. Return strictly valid JSON with no "
                          "markdown fences or extra commentary."
                      ),
                  },
                  {
                      "role": "user",
                      "content": prompt,
                  },
              ],
              "temperature": 1.0,
              "max_tokens": 4500,
              "response_format": {
                  "type": "json_object"
              },
          }

          request = urllib.request.Request(
              "https://models.github.ai/inference/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": (
                      f"Bearer {os.environ['GITHUB_TOKEN']}"
                  ),
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github+json",
              },
              method="POST",
          )

          with urllib.request.urlopen(
              request,
              timeout=120,
          ) as response:
              api_result = json.loads(
                  response.read().decode("utf-8")
              )

          content = api_result["choices"][0]["message"]["content"]
          project = json.loads(content)

          required_fields = {
              "name",
              "title",
              "description",
              "project_type",
              "core_mechanics",
              "index_html",
          }

          missing_fields = required_fields - project.keys()

          if missing_fields:
              raise ValueError(
                  f"Model response is missing fields: {missing_fields}"
              )

          if not isinstance(project["core_mechanics"], list):
              raise ValueError(
                  "core_mechanics must be a JSON array."
              )

          if len(project["core_mechanics"]) < 2:
              raise ValueError(
                  "The project must include at least two core mechanics."
              )

          name = re.sub(
              r"[^a-z0-9-]",
              "-",
              str(project["name"]).lower(),
          )

          name = re.sub(r"-+", "-", name).strip("-")

          if not name:
              raise ValueError(
                  "The generated project name is invalid."
              )

          folder = projects_dir / f"{today}-{name}"

          if folder.exists():
              raise ValueError(
                  f"Project folder already exists: {folder}"
              )

          html = str(project["index_html"]).strip()

          if not html.lower().startswith("<!doctype html"):
              raise ValueError(
                  "Generated file is not a complete HTML document."
              )

          if "<script" not in html.lower():
              raise ValueError(
                  "Generated project does not contain JavaScript."
              )

          if len(html) < 1000:
              raise ValueError(
                  "Generated project is unexpectedly small."
              )

          folder.mkdir()

          index_file = folder / "index.html"
          index_file.write_text(
              html + "\n",
              encoding="utf-8",
          )

          mechanics = ", ".join(
              str(mechanic)
              for mechanic in project["core_mechanics"]
          )

          project_readme = (
              f"# {project['title']}\n\n"
              f"{project['description']}\n\n"
              f"**Type:** {project['project_type']}\n\n"
              f"**Core mechanics:** {mechanics}\n\n"
              "## Run\n\n"
              "Open `index.html` in a web browser.\n\n"
              "## Generation\n\n"
              f"Generated automatically on {today} "
              "using GitHub Models.\n"
          )

          readme_file = folder / "README.md"
          readme_file.write_text(
              project_readme,
              encoding="utf-8",
          )

          projects_index = projects_dir / "README.md"

          if not projects_index.exists():
              projects_index.write_text(
                  "# Daily Mini Projects\n\n"
                  "Small browser projects generated as part of a daily "
                  "building experiment.\n",
                  encoding="utf-8",
              )

          with projects_index.open(
              "a",
              encoding="utf-8",
          ) as file:
              file.write(
                  f"\n- [{today}: {project['title']}]"
                  f"(./{folder.name}/) — "
                  f"{project['description']} "
                  f"_{project['project_type']}_\n"
              )

          print(f"Created {folder}")
          print(f"Project type: {project['project_type']}")
          print(f"Core mechanics: {mechanics}")
          PYTHON

      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: "zgoldwyn"
          GIT_AUTHOR_EMAIL: "zachgoldwyn@icloud.com"
          GIT_COMMITTER_NAME: "zgoldwyn"
          GIT_COMMITTER_EMAIL: "zachgoldwyn@icloud.com"
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi

          git add projects
          git commit -m "build: add daily mini project $(date -u +'%Y-%m-%d')"
          git push
