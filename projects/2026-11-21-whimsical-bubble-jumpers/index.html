<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Bubble Jumpers</title><style>body {font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #87CEEB; margin: 0;} h1 {text-align: center;} canvas {border: 2px solid #fff;} .hidden {display: none;} .score {font-size: 24px; color: #fff;}</style></head><body><div><h1>Whimsical Bubble Jumpers</h1><canvas id='gameCanvas' width='400' height='600'></canvas><div class='score' id='scoreDisplay'>Score: 0</div><button id='startButton'>Start Game</button></div><script>const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); let bubbles = []; let stars = []; let raindrops = []; let score = 0; let gameInterval; let isGameRunning = false; const bubbleRadius = 20; const starRadius = 10; const raindropHeight = 20; const cloudY = 150; function startGame() {isGameRunning = true; score = 0; bubbles = [{x: canvas.width / 2, y: canvas.height - 50, dx: 2}]; stars = []; raindrops = []; for(let i = 0; i < 5; i++) {stars.push({x: Math.random() * (canvas.width - 30) + 15, y: Math.random() * (canvas.height - cloudY - 30) + 30});} gameInterval = setInterval(updateGame, 50);} function updateGame() {ctx.clearRect(0, 0, canvas.width, canvas.height); drawClouds(); drawBubbles(); drawStars(); drawRaindrops(); checkCollisions(); document.getElementById('scoreDisplay').innerText = 'Score: ' + score;} function drawClouds() {ctx.fillStyle = 'white'; ctx.fillRect(0, cloudY, canvas.width, 20);} function drawBubbles() {bubbles.forEach(bubble => {ctx.beginPath(); ctx.arc(bubble.x, bubble.y, bubbleRadius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(173,216,230,0.8)'; ctx.fill(); ctx.closePath(); bubble.y -= 2; if(bubble.y < 0) bubble.y = canvas.height;});} function drawStars() {stars.forEach(star => {ctx.beginPath(); ctx.arc(star.x, star.y, starRadius, 0, Math.PI * 2); ctx.fillStyle = 'yellow'; ctx.fill(); ctx.closePath();});} function drawRaindrops() {if(raindrops.length < 5) {raindrops.push({x: Math.random() * canvas.width, y: 0});} raindrops.forEach(raindrop => {ctx.fillStyle = 'blue'; ctx.fillRect(raindrop.x, raindrop.y, 5, raindropHeight); raindrop.y += 3; if(raindrop.y > canvas.height) {raindrop.y = 0; raindrop.x = Math.random() * canvas.width;}});} function checkCollisions() {bubbles.forEach((bubble, bubbleIndex) => {stars.forEach((star, starIndex) => {const dx = bubble.x - star.x; const dy = bubble.y - star.y; if(Math.sqrt(dx * dx + dy * dy) < bubbleRadius + starRadius) {score += 10; stars.splice(starIndex, 1); stars.push({x: Math.random() * (canvas.width - 30) + 15, y: Math.random() * (canvas.height - cloudY - 30) + 30});}}); raindrops.forEach(raindrop => {const dx = bubble.x - raindrop.x; if(Math.abs(dx) < bubbleRadius + 5 && bubble.y + bubbleRadius > raindrop.y) {endGame();}});});} function endGame() {clearInterval(gameInterval); isGameRunning = false; alert('Game Over! Your score was ' + score); document.getElementById('scoreDisplay').innerText = 'Score: 0';} document.getElementById('startButton').addEventListener('click', () => {if(!isGameRunning) {startGame();}});</script></body></html>
