<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Watercolor Waves</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;background-color:#f0f9ff;margin:0;}canvas{border:2px solid #3a9bdc;cursor:pointer;}</style></head><body><canvas id="canvas" width="800" height="600"></canvas><script>const canvas=document.getElementById("canvas");const ctx=canvas.getContext("2d");let painting=false;let animationId;let lastX=0,lastY=0;const colors=["#f28e1c", "#3cba54", "#db3236", "#007aff", "#8c3b9d"];function startPosition(e){painting=true;[lastX,lastY]=[e.offsetX,e.offsetY];}function endPosition(){painting=false;cancelAnimationFrame(animationId);}function draw(e){if(!painting)return;ctx.strokeStyle=colors[Math.floor(Math.random()*colors.length)];ctx.lineWidth=10;ctx.lineJoin="round";ctx.globalAlpha=0.5;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();[lastX,lastY]=[e.offsetX,e.offsetY];}function flow(){if(painting){ctx.globalCompositeOperation="destination-out";ctx.fillStyle="#f0f9ff";ctx.beginPath();ctx.arc(lastX,lastY,10,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation="source-over";}animationId=requestAnimationFrame(flow);}canvas.addEventListener("mousedown",startPosition);canvas.addEventListener("mouseup",endPosition);canvas.addEventListener("mousemove",draw);canvas.addEventListener("mouseleave",endPosition);</script></body></html>
