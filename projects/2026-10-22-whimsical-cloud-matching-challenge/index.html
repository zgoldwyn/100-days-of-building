t--;document.getElementById('timer').innerText=timeLeft;if(timeLeft<=0){clearInterval(timerId);document.getElementById('message').innerText='Game Over! Final Score: '+score;}}document.getElementById('startBtn').onclick=startGame;</script></body></html>
