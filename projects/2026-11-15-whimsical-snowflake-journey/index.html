<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Snowflake Journey</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;background-color:#87CEEB;margin:0}canvas{border:2px solid #fff;}</style></head><body><canvas id='gameCanvas' width='800' height='600'></canvas><script>let canvas=document.getElementById('gameCanvas');let ctx=canvas.getContext('2d');let snowflake={x:400,y:300,radius:15};let score=0;let obstacles=[];let gameInterval;let obstacleInterval;let isGameOver=false;function drawSnowflake(){ctx.beginPath();ctx.arc(snowflake.x,snowflake.y,snowflake.radius,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.closePath();}function drawObstacles(){for(let obs of obstacles){ctx.fillStyle='red';ctx.fillRect(obs.x,obs.y,obs.width,obs.height);} }function updateObstacles(){if(Math.random()<0.02){let obsWidth=Math.random()*40+20;let obsHeight=20;obstacles.push({x:Math.random()*canvas.width,y:0,width:obsWidth,height:obsHeight});}for(let i=0;i<obstacles.length;i++){obstacles[i].y+=2;if(obstacles[i].y>canvas.height){obstacles.splice(i,1);score++;}}}function checkCollision(){for(let obs of obstacles){if(snowflake.x+snowflake.radius>obs.x&&snowflake.x-snowflake.radius<obs.x+obs.width&&snowflake.y+snowflake.radius>obs.y&&snowflake.y-snowflake.radius<obs.y+obs.height){clearInterval(gameInterval);clearInterval(obstacleInterval);isGameOver=true;alert('Game Over! Final Score: '+score);}}}function gameLoop(){ctx.clearRect(0,0,canvas.width,canvas.height);drawSnowflake();drawObstacles();updateObstacles();checkCollision();}function moveSnowflake(e){if(!isGameOver){if(e.key==='ArrowLeft'&&snowflake.x>snowflake.radius){snowflake.x-=20;}else if(e.key==='ArrowRight'&&snowflake.x<canvas.width-snowflake.radius){snowflake.x+=20;}}}document.addEventListener('keydown',moveSnowflake);gameInterval=setInterval(gameLoop,1000/60);obstacleInterval=setInterval(updateObstacles,1000/2);</script></body></html>
