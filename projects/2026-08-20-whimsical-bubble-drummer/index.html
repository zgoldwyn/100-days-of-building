<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Bubble Drummer</title><style>body { font-family: Arial, sans-serif; background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; } h1 { color: #333; } #bubble-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 600px; } .bubble { width: 100px; height: 100px; border-radius: 50%; background-color: #ff6b6b; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; cursor: pointer; transition: transform 0.2s; } .bubble:hover { transform: scale(1.1); } @media (max-width: 400px) { .bubble { width: 70px; height: 70px; font-size: 18px; } } </style></head><body><h1>Whimsical Bubble Drummer</h1><p>Tap the bubbles to create music!</p><div id='bubble-container'></div><script>const container = document.getElementById('bubble-container'); const bubbleSounds = ['sound1.mp3', 'sound2.mp3', 'sound3.mp3', 'sound4.mp3', 'sound5.mp3']; function createBubble() { const bubble = document.createElement('div'); bubble.classList.add('bubble'); const soundIndex = Math.floor(Math.random() * bubbleSounds.length); bubble.dataset.sound = bubbleSounds[soundIndex]; bubble.textContent = '🎶'; bubble.addEventListener('click', () => { new Audio(bubble.dataset.sound).play(); bubble.style.backgroundColor = '#' + Math.floor(Math.random() * 16777215).toString(16); }); return bubble; } for (let i = 0; i < 12; i++) { container.appendChild(createBubble()); } </script></body></html>
