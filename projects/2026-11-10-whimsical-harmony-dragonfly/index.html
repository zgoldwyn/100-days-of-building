<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Harmony Dragonfly</title><style>body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #87CEEB; overflow: hidden; } canvas { border: 1px solid #000; background: #fff; }</style></head><body><canvas id='gameCanvas' width='800' height='600'></canvas><script>const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); let dragonfly, flowers, score, obstacles, gameOver; function init() { dragonfly = { x: 100, y: canvas.height / 2, size: 20 }; flowers = []; obstacles = []; score = 0; gameOver = false; spawnFlowers(5); spawnObstacles(3); requestAnimationFrame(update); } function spawnFlowers(count) { for (let i = 0; i < count; i++) { let flower = { x: Math.random() * (canvas.width - 20) + 20, y: Math.random() * (canvas.height - 20) + 20, size: 15 }; flowers.push(flower); } } function spawnObstacles(count) { for (let i = 0; i < count; i++) { let obstacle = { x: Math.random() * canvas.width, y: Math.random() * (canvas.height - 20) + 20, size: Math.random() * 30 + 40 }; obstacles.push(obstacle); } } function update() { ctx.clearRect(0, 0, canvas.width, canvas.height); drawDragonfly(); flowers.forEach(flower => drawFlower(flower)); obstacles.forEach(obstacle => drawObstacle(obstacle)); if (gameOver) { ctx.font = '48px Arial'; ctx.fillStyle = 'red'; ctx.fillText('Game Over! Score: ' + score, canvas.width / 4, canvas.height / 2); return; } detectCollisions(); requestAnimationFrame(update); } function drawDragonfly() { ctx.fillStyle = '#FFA500'; ctx.beginPath(); ctx.arc(dragonfly.x, dragonfly.y, dragonfly.size, 0, Math.PI * 2); ctx.fill(); } function drawFlower(flower) { ctx.fillStyle = '#FF69B4'; ctx.beginPath(); ctx.arc(flower.x, flower.y, flower.size, 0, Math.PI * 2); ctx.fill(); } function drawObstacle(obstacle) { ctx.fillStyle = '#8B0000'; ctx.fillRect(obstacle.x, obstacle.y, obstacle.size, obstacle.size); } function detectCollisions() { flowers = flowers.filter(flower => { if (Math.hypot(dragonfly.x - flower.x, dragonfly.y - flower.y) < dragonfly.size + flower.size) { score++; return false; } return true; }); if (!flowers.length) { spawnFlowers(5); } obstacles.forEach(obstacle => { if (Math.hypot(dragonfly.x - obstacle.x, dragonfly.y - obstacle.y) < dragonfly.size + obstacle.size) { gameOver = true; } }); } function moveDragonfly(event) { const rect = canvas.getBoundingClientRect(); dragonfly.x = event.clientX - rect.left; dragonfly.y = event.clientY - rect.top; } canvas.addEventListener('mousemove', moveDragonfly); init();</script></body></html>
