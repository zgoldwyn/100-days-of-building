<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Spring Flower Dash</title><style>body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #cce7ff; margin: 0; }#game { position: relative; width: 80vw; height: 80vh; overflow: hidden; background: linear-gradient(to top, #ffebcd, #ffd700); border: 3px solid #8b4513; }#player { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 50px; height: 50px; background-color: #ff1493; border-radius: 50%; }#flower { position: absolute; background-color: #ff69b4; border-radius: 10px; z-index: 1; }#bee { position: absolute; background-color: #ff4500; border-radius: 50%; }#score { position: absolute; top: 10px; left: 10px; font-size: 24px; color: #4b0082; }#start { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; background: #8a2be2; color: white; padding: 15px; border-radius: 10px; cursor: pointer; }#game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ff4500; color: white; padding: 15px; border-radius: 10px; }</style></head><body><div id='game'><div id='score'>Score: 0</div><div id='player'></div><div id='start'>Start Game</div><div id='game-over'>Game Over! Score: <span id='final-score'></span><br><button onclick='restartGame()'>Play Again</button></div></div><script>let gameInterval, flowerInterval, beeInterval; const player = document.getElementById('player'); const flowerContainer = document.getElementById('game'); const scoreDisplay = document.getElementById('score'); const startButton = document.getElementById('start'); const gameOverDisplay = document.getElementById('game-over'); let score = 0; let gameWidth = flowerContainer.offsetWidth; let gameHeight = flowerContainer.offsetHeight; document.addEventListener('keydown', movePlayer); startButton.addEventListener('click', startGame); function startGame() { score = 0; scoreDisplay.innerText = 'Score: ' + score; startButton.style.display = 'none'; gameInterval = setInterval(gameLoop, 20); flowerInterval = setInterval(createFlower, 1000); beeInterval = setInterval(createBee, 1500); } function gameLoop() { const bees = document.querySelectorAll('.bee'); bees.forEach(bee => { const beeTop = parseInt(window.getComputedStyle(bee).getPropertyValue('top')); if (beeTop > gameHeight) { bee.remove(); } else { bee.style.top = (beeTop + 3) + 'px'; } if (isCollision(bee, player)) { endGame(); } }); } function createFlower() { const flower = document.createElement('div'); flower.classList.add('flower'); flower.style.width = '30px'; flower.style.height = '30px'; flower.style.position = 'absolute'; flower.style.backgroundColor = '#ff69b4'; flower.style.borderRadius = '10px'; flower.style.bottom = '20px'; flower.style.left = Math.random() * (gameWidth - 30) + 'px'; flowerContainer.appendChild(flower); let fallInterval = setInterval(() => { const flowerTop = parseInt(window.getComputedStyle(flower).getPropertyValue('bottom')); if (flowerTop > gameHeight) { clearInterval(fallInterval); flower.remove(); } else { flower.style.bottom = (flowerTop + 3) + 'px'; } if (isCollision(flower, player)) { score++; scoreDisplay.innerText = 'Score: ' + score; clearInterval(fallInterval); flower.remove(); } }, 20); } function createBee() { const bee = document.createElement('div'); bee.classList.add('bee'); bee.style.width = '20px'; bee.style.height = '20px'; bee.style.position = 'absolute'; bee.style.backgroundColor = '#ff4500'; bee.style.borderRadius = '50%'; bee.style.left = Math.random() * (gameWidth - 20) + 'px'; bee.style.top = '-20px'; flowerContainer.appendChild(bee); } function isCollision(a, b) { const aRect = a.getBoundingClientRect(); const bRect = b.getBoundingClientRect(); return !(aRect.right < bRect.left || aRect.left > bRect.right || aRect.bottom < bRect.top || aRect.top > bRect.bottom); } function endGame() { clearInterval(gameInterval); clearInterval(flowerInterval); clearInterval(beeInterval); gameOverDisplay.style.display = 'block'; document.getElementById('final-score').innerText = score; } function restartGame() { gameOverDisplay.style.display = 'none'; flowerContainer.innerHTML = ''; player.style.bottom = '20px'; startGame(); } startButton.style.display = 'block';</script></body></html>
