<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Color Catch Challenge</title><style>body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; background-color: #f0f0f0; } #game { position: relative; width: 100vw; height: 80vh; overflow: hidden; border: 2px solid #333; } .shape { position: absolute; border-radius: 50%; } #target { margin: 20px; font-size: 24px; }</style></head><body><h1>Color Catch Challenge</h1><div id="target">Target Color: <span id="targetColor">#FF0000</span></div><div id="game"></div><div id="scoreBoard">Score: 0 | Time: <span id="timer">30</span></div><button id="startButton">Start Game</button><script>let score = 0; let time = 30; let targetColor; let interval; const colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFF00", "#FF00FF", "#00FFFF"]; function startGame() { score = 0; time = 30; document.getElementById('scoreBoard').children[0].innerText = 'Score: ' + score; document.getElementById('timer').innerText = time; clearInterval(interval); interval = setInterval(countdown, 1000); generateRandomColor(); spawnShapes(); } function countdown() { time--; document.getElementById('timer').innerText = time; if (time <= 0) endGame(); } function generateRandomColor() { const randomIndex = Math.floor(Math.random() * colors.length); targetColor = colors[randomIndex]; document.getElementById('targetColor').innerText = targetColor; } function spawnShapes() { const shape = document.createElement('div'); const size = Math.random() * 50 + 20; shape.className = 'shape'; shape.style.width = shape.style.height = size + 'px'; shape.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]; shape.style.left = Math.random() * (window.innerWidth - size) + 'px'; shape.style.top = '0px'; shape.onclick = checkColor; document.getElementById('game').appendChild(shape); moveShape(shape); } function moveShape(shape) { const fallDuration = Math.random() * 4000 + 2000; shape.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(' + (window.innerHeight + 50) + 'px)' }], {duration: fallDuration, easing: 'linear', fill: 'forwards'}).onfinish = () => { shape.remove(); if (time > 0) spawnShapes(); }; } function checkColor() { if (this.style.backgroundColor === targetColor) { score++; document.getElementById('scoreBoard').children[0].innerText = 'Score: ' + score; } this.remove(); } function endGame() { clearInterval(interval); alert('Time is up! Your score is: ' + score); document.getElementById('game').innerHTML = ''; } document.getElementById('startButton').onclick = startGame;</script></body></html>
