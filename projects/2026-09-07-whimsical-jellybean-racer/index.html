<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Jellybean Racer</title><style>body{display:flex;flex-direction:column;align-items:center;background-color:#f0f8ff;margin:0;padding:0;font-family:'Arial',sans-serif}h1{text-align:center}canvas{border:2px solid black;position:relative}#score{font-size:24px;margin-top:10px}#restart{display:none;padding:10px 20px;font-size:16px;background-color:#28a745;color:white;border:none;border-radius:5px;cursor:pointer}#restart:hover{background-color:#218838}</style></head><body><h1>Whimsical Jellybean Racer</h1><canvas id='gameCanvas' width='400' height='400'></canvas><div id='score'>Score: 0</div><button id='restart'>Restart</button><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');let score=0;let jellybean={x:50,y:350,width:30,height:30};let obstacles=[];let frameCount=0;let gameActive=true;function createObstacle(){let gap=Math.random()*100+50;let obstacleHeight=Math.random()*20+20;obstacles.push({x:canvas.width,y:canvas.height-obstacleHeight,width:10,height:obstacleHeight});obstacles.push({x:canvas.width,y:canvas.height-obstacleHeight-gap,width:10,height:canvas.height-(canvas.height-obstacleHeight-gap)});obstacles=obstacles.filter(o=>o.x>0)}function drawJellybean(){ctx.fillStyle='pink';ctx.fillRect(jellybean.x,jellybean.y,jellybean.width,jellybean.height)}function drawObstacles(){ctx.fillStyle='brown';for(let o of obstacles){ctx.fillRect(o.x,o.y,o.width,o.height)}}function updateObstacles(){for(let o of obstacles){o.x-=2;if(o.x<0){score+=1;obstacles.splice(obstacles.indexOf(o),1)}}}function checkCollision(){for(let o of obstacles){if(jellybean.x<o.x+o.width&&jellybean.x+jellybean.width>o.x&&jellybean.y<o.y+o.height&&jellybean.y+jellybean.height>o.y){gameActive=false}}}function displayScore(){ctx.fillStyle='black';ctx.font='24px Arial';ctx.fillText('Score: '+score,10,30)}function restartGame(){score=0;obstacles=[];jellybean.y=350;gameActive=true;document.getElementById('restart').style.display='none';loop()}function loop(){ctx.clearRect(0,0,canvas.width,canvas.height);if(gameActive){createObstacle();updateObstacles();checkCollision();drawJellybean();drawObstacles();displayScore();frameCount++;if(frameCount%100===0){score+=1}requestAnimationFrame(loop)}else{ctx.fillStyle='red';ctx.font='48px Arial';ctx.fillText('Game Over',canvas.width/4,canvas.height/2);document.getElementById('restart').style.display='block'}}document.addEventListener('keydown',function(event){if(event.key==='ArrowUp'&&jellybean.y>50){jellybean.y-=50}else if(event.key==='ArrowDown'&&jellybean.y<canvas.height-jellybean.height){jellybean.y+=50}});document.getElementById('restart').addEventListener('click',restartGame);loop();</script></body></html>
