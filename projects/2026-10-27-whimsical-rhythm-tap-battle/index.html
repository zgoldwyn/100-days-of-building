<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Rhythm Tap Battle</title><style>* {box-sizing: border-box;} body {display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f8ff; font-family: 'Arial', sans-serif;}.container {display: grid; grid-template-columns: repeat(3, 100px); gap: 10px;}.tap-icon {width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 50%; cursor: pointer; transition: transform 0.1s;}.tap-icon:hover {transform: scale(1.1);}.scoreboard {margin-top: 20px;}.button {margin: 10px; padding: 10px 20px; border: none; background-color: #4CAF50; color: white; cursor: pointer;}.button:hover {background-color: #45a049;}</style></head><body><h1>Whimsical Rhythm Tap Battle</h1><div class='container' id='iconContainer'></div><div class='scoreboard'><h2>Score: <span id='score'>0</span></h2><button class='button' id='startButton'>Start Game</button><button class='button' id='resetButton'>Reset</button></div><script>let score = 0; let gameInterval; const icons = ['🎶', '🎹', '🎸', '🎻', '🎤']; const iconContainer = document.getElementById('iconContainer'); const scoreDisplay = document.getElementById('score'); const startButton = document.getElementById('startButton'); const resetButton = document.getElementById('resetButton'); function startGame() {score = 0; scoreDisplay.innerText = score; gameInterval = setInterval(() => {const randomIndex = Math.floor(Math.random() * icons.length); const icon = icons[randomIndex]; const tapIcon = document.createElement('div'); tapIcon.className = 'tap-icon'; tapIcon.innerText = icon; tapIcon.onclick = () => {score++; scoreDisplay.innerText = score; tapIcon.remove();}; iconContainer.appendChild(tapIcon); setTimeout(() => {if (tapIcon) tapIcon.remove();}, 1000);}, 1000); startButton.disabled = true; resetButton.disabled = true;} function resetGame() {clearInterval(gameInterval); iconContainer.innerHTML = ''; score = 0; scoreDisplay.innerText = score; startButton.disabled = false; resetButton.disabled = false;} startButton.onclick = startGame; resetButton.onclick = resetGame;</script></body></html>
