<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Sandcastle Build-Off</title><style>body {font-family: Arial, sans-serif; margin: 0; padding: 0; background: #e0f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column;} h1 {color: #00796b;} #game {position: relative; width: 300px; height: 400px; background: #fff; border: 2px solid #00796b; overflow: hidden;}.sandcastle {position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 100px; background: gold; border-radius: 10px; border: 2px solid #a1887f;} .wave {position: absolute; bottom: 0; left: 50%; width: 100%; height: 40px; background: #6ec6ff; transform: translateX(-50%); animation: wave 3s linear infinite;} @keyframes wave {0% {bottom: 0;} 50% {bottom: 30px;} 100% {bottom: 0;}} #start {padding: 10px 20px; margin-top: 20px; background: #00796b; color: white; border: none; cursor: pointer;}</style></head><body><h1>Whimsical Sandcastle Build-Off!</h1><div id='game'><div id='sandcastle' class='sandcastle'></div><div id='wave' class='wave'></div></div><button id='start'>Start Game</button><script>let timer; let score = 0; let isGameActive = false; const startButton = document.getElementById('start'); const sandcastle = document.getElementById('sandcastle'); const wave = document.getElementById('wave'); const resetWave = () => {clearInterval(timer); wave.style.bottom = '0';}; const startGame = () => {resetWave(); score = 0; isGameActive = true; startButton.style.display = 'none'; timer = setInterval(() => {if (isGameActive) {const wavePosition = parseInt(wave.style.bottom); if (wavePosition < 40) {wave.style.bottom = wavePosition + 5 + 'px';} else {clearInterval(timer); isGameActive = false; alert(`Game Over! Your score: ${score}`); startButton.style.display = 'block';}}}, 200);}; const moveSandcastle = (e) => {if (isGameActive) {const gameRect = document.getElementById('game').getBoundingClientRect(); const castleRect = sandcastle.getBoundingClientRect(); const newX = e.clientX - gameRect.left - castleRect.width / 2; if (newX >= 0 && newX <= gameRect.width - castleRect.width) {sandcastle.style.left = newX + 'px'; score++;}}}; startButton.addEventListener('click', startGame); document.addEventListener('mousemove', moveSandcastle);</script></body></html>
