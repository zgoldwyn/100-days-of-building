<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Jump and Color Catch</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background-color:#e0f7fa;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#00796b}h1{text-align:center;margin-bottom:20px}#gameContainer{position:relative;width:300px;height:400px;border:2px solid #00796b;background-color:#ffffff;overflow:hidden}#player{position:absolute;bottom:0;width:50px;height:50px;background-color:#00796b;transition:bottom 0.1s}#block{position:absolute;width:50px;height:50px;transition:top 0.05s}#scoreDisplay{margin-bottom:10px;font-size:24px}#startButton{padding:10px 20px;background-color:#00796b;color:white;border:none;cursor:pointer}#startButton:hover{background-color:#004d40}#endMessage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;display:none}</style></head><body><h1>Whimsical Jump and Color Catch</h1><div id='scoreDisplay'>Score: 0</div><button id='startButton'>Start Game</button><div id='gameContainer'><div id='player'></div><div id='block'></div><div id='endMessage'></div></div><script>let score=0;let gameInterval;let player=document.getElementById('player');let block=document.getElementById('block');let scoreDisplay=document.getElementById('scoreDisplay');let endMessage=document.getElementById('endMessage');let colors=['#FF5733','#33FF57','#3357FF'];let currentColor='';document.getElementById('startButton').onclick=function(){startGame()};function startGame(){score=0;scoreDisplay.textContent='Score: '+score;endMessage.style.display='none';player.style.bottom='0px';block.style.top='-50px';moveBlock();gameInterval=setInterval(moveBlock,1000)}function jump(){if(player.style.bottom==='0px'){player.style.bottom='100px';setTimeout(()=>{player.style.bottom='0px';},300)}}function moveBlock(){currentColor=colors[Math.floor(Math.random()*colors.length)];block.style.backgroundColor=currentColor;block.style.left=Math.random()*250+'px';block.style.top='-50px';let blockFall=setInterval(()=>{let blockTop=parseInt(block.style.top);block.style.top=blockTop+5+'px';if(blockTop>400){clearInterval(blockFall);if(block.style.backgroundColor===player.style.backgroundColor){score++;scoreDisplay.textContent='Score: '+score}else{endGame()}moveBlock()}else if(blockTop>350){document.addEventListener('click',jump)}}},100)}function endGame(){clearInterval(gameInterval);endMessage.textContent='Game Over! Final Score: '+score;endMessage.style.display='block'}document.addEventListener('keydown',function(event){if(event.code==='Space'){jump()}document.getElementById('startButton').onclick=function(){player.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];}});</script></body></html>
