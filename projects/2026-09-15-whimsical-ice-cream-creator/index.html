<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Ice Cream Creator</title><style>body{font-family:Arial,sans-serif;text-align:center;background-color:#f0f8ff}.container{margin-top:20px}.ice-cream-cone{width:100px;height:200px;border:solid 10px #8b4513;border-radius:10px 10px 0 0;background-color:#f5deb3;position:relative;display:inline-block}.ice-cream-ball{width:80px;height:80px;border-radius:50%;position:absolute;top:-40px;left:10px;box-shadow:0 0 10px rgba(0,0,0,0.5)}.ingredients{margin-top:20px}.ingredient{display:inline-block;width:60px;height:60px;margin:10px;cursor:pointer}.ingredient img{width:100%;height:100%}.submit-btn{background-color:#32cd32;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer;}.submit-btn:hover{background-color:#28a745}.output{margin-top:20px;}</style></head><body><h1>Create Your Whimsical Ice Cream!</h1><div class='container'><div class='ice-cream-cone'><div id='ice-cream-ball' class='ice-cream-ball' style='background-color:transparent;'></div></div><div class='ingredients' id='ingredients'><div class='ingredient' data-color='#ffcccb'><img src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjBweHgiIGhlaWdodD0iNjBweHgiIHZpZXdCb3g9IjAgMCA2MCA2MCIgZmlsbD0iI2ZmY2NmYiI+PHBhdGggZD0iTTMgMyB2NTAgMTEgNTAgNjAgODAgODAgMjAgODAgNjAgNjAgNjAgNjAgNTAgNjAgODAgNTEgNzAgNjAgNzAgNjAgNjAgMTAiLz48L3N2Zz4='/>Strawberry</div><div class='ingredient' data-color='#f0e68c'><img src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjBweHgiIGhlaWdodD0iNjBweHgiIHZpZXdCb3g9IjAgMCA2MCA2MCIgZmlsbD0iI2ZmY2NmYiI+PHBhdGggZD0iTTAgMCB2NjAgNiAwIDAgNiA2MCA2MCA2MCA2MCA2MCA2MCA2MCA2MCA2MCA2MCA5IDAgNiAzIDUgNiA1IDQgOC02IDEwIDYgNiA3IDcgNyAxMCA4IDMgOS8zIDN2MCAwIDguNzIgMTAuNDYgMTIuODQgdDAgLjUwMSAxLjQ0IDAgNjAgMCAtLTYtNy45IDUuOCA4LjcwLTYgMC44QzExIDMuNzAgMjQuOSAwIDAgMTAuMTA1LTIwZXQiLz48L3N2Zz4='/>Vanilla</div><div class='ingredient' data-color='#ffe4b5'><img src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjBweHgiIGhlaWdodD0iNjBweHgiIHZpZXdCb3g9IjAgMCA2MCA2MCIgZmlsbD0iI2ZmY2NmYiI+PHBhdGggZD0iTTAgMCB2NjAgNiAwIDAgNiA2MCA2MCA2MCA2MCA2MCA2MCA2MCA2MCA2MCA2MCA5IDAgNiAzIDUgNiA1IDQgOC02IDEwIDYgNiA3IDcgNyAxMCA4IDMgOS8zIDN2MCAwIDguNzIgMTAuNDYgMTIuODQgdDAgLjUwMSAxLjQ0IDAgNjAgMCAtLTYtNy45IDUuOCA4LjcwLTYgMC44QzExIDMuNzAgMjQuOSAwIDAgMTAuMTA1LTIwZXQiLz48L3N2Zz4='/>Lemon</div></div><button class='submit-btn' id='submit-btn'>Create Ice Cream</button></div><div class='output' id='output'></div><script>const ingredientsElem = document.getElementById('ingredients');const iceCreamBall = document.getElementById('ice-cream-ball');const submitBtn = document.getElementById('submit-btn');const output = document.getElementById('output');let selectedColor = 'transparent';ingredientsElem.addEventListener('click', (event) => {if (event.target.classList.contains('ingredient')) {selectedColor = event.target.getAttribute('data-color');iceCreamBall.style.backgroundColor = selectedColor;}});submitBtn.addEventListener('click', () => {const iceCreamColor = iceCreamBall.style.backgroundColor === 'transparent' ? 'no ice cream selected' : iceCreamBall.style.backgroundColor;output.innerHTML = '<h2>Your ice cream is ready!</h2><div style="background-color:' + iceCreamColor + ';width:80px;height:80px;border-radius:50%;margin:auto;"></div>';});</script></body></html>
