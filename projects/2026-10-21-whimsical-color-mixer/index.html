<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Color Mixer</title><style>body { font-family: Arial, sans-serif; background-color: #f0f8ff; text-align: center; margin: 0; } h1 { color: #ff6347; } .color-palette { display: flex; justify-content: center; margin: 20px; } .color { width: 50px; height: 50px; margin: 10px; cursor: pointer; border: 2px solid transparent; transition: border 0.3s; } .color:hover { border: 2px solid #ff6347; } #target-color { margin-top: 20px; font-size: 24px; } #score { font-size: 20px; margin-top: 10px; } #timer { font-size: 20px; color: #ff4500; } .hidden { display: none; } </style></head><body><h1>Whimsical Color Mixer</h1><div class='color-palette'><div class='color' style='background-color: red;' data-color='red'></div><div class='color' style='background-color: blue;' data-color='blue'></div><div class='color' style='background-color: yellow;' data-color='yellow'></div></div><div id='target-color' class='hidden'></div><div id='score'>Score: 0</div><div id='timer'>Time Left: 20</div><button id='start'>Start Game</button><script>let score = 0; let timeLeft = 20; let colorMixGoal; const colors = ['red', 'blue', 'yellow']; document.getElementById('start').onclick = startGame; function startGame() { score = 0; timeLeft = 20; document.getElementById('score').innerText = 'Score: ' + score; document.getElementById('timer').innerText = 'Time Left: ' + timeLeft; generateTargetColor(); document.getElementById('start').classList.add('hidden'); startTimer(); } function startTimer() { const timerInterval = setInterval(() => { timeLeft--; document.getElementById('timer').innerText = 'Time Left: ' + timeLeft; if (timeLeft <= 0) { clearInterval(timerInterval); endGame(); } }, 1000); } function generateTargetColor() { const randomIndex = Math.floor(Math.random() * colors.length); colorMixGoal = colors[randomIndex]; document.getElementById('target-color').innerText = 'Mix to create: ' + colorMixGoal; document.getElementById('target-color').classList.remove('hidden'); } document.querySelectorAll('.color').forEach(color => { color.onclick = e => { mixColors(e.target.dataset.color); }; }); function mixColors(selectedColor) { if (selectedColor === colorMixGoal) { score++; document.getElementById('score').innerText = 'Score: ' + score; generateTargetColor(); } } function endGame() { alert('Time is up! Your score is: ' + score); document.getElementById('start').classList.remove('hidden'); document.getElementById('target-color').classList.add('hidden'); } </script></body></html>
