<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Fractal Bubble Explorer</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#87CEEB;overflow:hidden}.canvas-container{position:relative}.bubble{border-radius:50%;position:absolute;animation:pop 0.5s forwards}.@keyframes pop{from{transform:scale(1)}to{transform:scale(0)}}h1{text-align:center;color:#333;font-family:'Arial',sans-serif}#instructions{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:white;padding:10px;border-radius:5px;box-shadow:0 0 10px rgba(0,0,0,0.5);font-family:'Arial',sans-serif}</style></head><body><div class='canvas-container'><h1>Fractal Bubble Explorer</h1><div id='instructions'>Click to create fractal bubbles! Pop them to explore new patterns.</div></div><script>const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');document.querySelector('.canvas-container').appendChild(canvas);canvas.width=window.innerWidth;canvas.height=window.innerHeight;window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight});let bubbles=[];function createBubble(x,y,radius){const bubble=document.createElement('div');bubble.className='bubble';bubble.style.width=bubble.style.height=`${radius*2}px`;bubble.style.background=`rgba(${Math.floor(Math.random()*256)},${Math.floor(Math.random()*256)},${Math.floor(Math.random()*256)},0.7)`;bubble.style.left=`${x-radius}px`;bubble.style.top=`${y-radius}px`;document.body.appendChild(bubble);bubble.addEventListener('click',()=>{bubble.style.animation='pop 0.5s forwards';setTimeout(()=>{document.body.removeChild(bubble)},500);createFractalBubbles(x,y,radius/1.5)});return bubble}function createFractalBubbles(x,y,radius){if(radius<5)return;for(let i=0;i<6;i++){const angle=(Math.PI/3)*i;const newX=x+Math.cos(angle)*radius*1.5;const newY=y+Math.sin(angle)*radius*1.5;createBubble(newX,newY,radius)}}canvas.addEventListener('click',(e)=>{const rect=canvas.getBoundingClientRect();const x=e.clientX-rect.left;const y=e.clientY-rect.top;const radius=Math.floor(Math.random()*30)+20;createBubble(x,y,radius)});</script></body></html>
