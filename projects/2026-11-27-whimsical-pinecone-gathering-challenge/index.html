<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whimsical Pinecone Gathering Challenge</title><style>* {box-sizing: border-box;}body {font-family: Arial, sans-serif; background-color: #f0f8ff; color: #333; margin: 0; padding: 20px;}canvas {border: 2px solid #4caf50; display: block; margin: 0 auto;}h1 {text-align: center;}#score {font-size: 20px; text-align: center; margin-top: 10px;}#instructions {margin-top: 20px; text-align: center;}</style></head><body><h1>Whimsical Pinecone Gathering Challenge</h1><canvas id="gameCanvas" width="600" height="400"></canvas><div id="score">Score: 0</div><div id="instructions">Use arrow keys to move left and right. Collect pinecones and avoid squirrels!</div><script>let canvas = document.getElementById('gameCanvas');let context = canvas.getContext('2d');let score = 0;let pinecones = [];let squirrels = [];let player = {x: canvas.width / 2, y: canvas.height - 30};let keys = {};let gameOver = false;let gameInterval;function initGame() {document.addEventListener('keydown', (e) => {keys[e.key] = true;});document.addEventListener('keyup', (e) => {keys[e.key] = false;}); spawnPinecone(); spawnSquirrel(); gameInterval = setInterval(updateGameArea, 100); }function updateGameArea() {if (gameOver) return;context.clearRect(0, 0, canvas.width, canvas.height);if (keys['ArrowLeft'] && player.x > 0) player.x -= 5;if (keys['ArrowRight'] && player.x < canvas.width - 30) player.x += 5;drawPlayer();drawPinecones();drawSquirrels();checkCollisions();}function drawPlayer() {context.fillStyle = '#38761d';context.fillRect(player.x, player.y, 30, 30);}function drawPinecones() {for (let i = 0; i < pinecones.length; i++) {context.fillStyle = '#9b7653';context.fillRect(pinecones[i].x, pinecones[i].y, 15, 15);pinecones[i].y += 2; if (pinecones[i].y > canvas.height) pinecones.splice(i, 1);}}function drawSquirrels() {for (let i = 0; i < squirrels.length; i++) {context.fillStyle = '#ffcc00';context.fillRect(squirrels[i].x, squirrels[i].y, 20, 20);squirrels[i].y += 3; if (squirrels[i].y > canvas.height) squirrels.splice(i, 1);}}function spawnPinecone() {let pinecone = {x: Math.random() * (canvas.width - 15), y: 0};pinecones.push(pinecone);setTimeout(spawnPinecone, 1500);}function spawnSquirrel() {let squirrel = {x: Math.random() * (canvas.width - 20), y: 0};squirrels.push(squirrel);setTimeout(spawnSquirrel, 2000);}function checkCollisions() {for (let i = 0; i < pinecones.length; i++) {if (player.x < pinecones[i].x + 15 && player.x + 30 > pinecones[i].x && player.y < pinecones[i].y + 15 && player.y + 30 > pinecones[i].y) {score++;document.getElementById('score').innerText = 'Score: ' + score;pinecones.splice(i, 1);}}for (let i = 0; i < squirrels.length; i++) {if (player.x < squirrels[i].x + 20 && player.x + 30 > squirrels[i].x && player.y < squirrels[i].y + 20 && player.y + 30 > squirrels[i].y) {gameOver = true;clearInterval(gameInterval);alert('Game Over! Your score: ' + score);}}}initGame();</script></body></html>
