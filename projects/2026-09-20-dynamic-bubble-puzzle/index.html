<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Dynamic Bubble Puzzle</title><style>body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f0f8ff; } h1 { color: #4a90e2; } #game { display: grid; grid-template-columns: repeat(6, 50px); gap: 5px; margin-bottom: 20px; } .bubble { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; } .bubble:hover { transform: scale(1.1); } #score { font-size: 24px; color: #333; }</style></head><body><h1>Dynamic Bubble Puzzle</h1><div id='game'></div><div id='score'>Score: 0</div><button onclick='startGame()'>Start Game</button><script>let score = 0; let bubbles = []; const colors = ['#FF5733', '#33FF57', '#3357FF', '#F1C40F', '#9B59B6', '#E67E22']; function startGame() { score = 0; document.getElementById('score').textContent = 'Score: ' + score; bubbles = []; createBubbles(); } function createBubbles() { const gameDiv = document.getElementById('game'); gameDiv.innerHTML = ''; for (let i = 0; i < 36; i++) { const bubbleDiv = document.createElement('div'); const color = colors[Math.floor(Math.random() * colors.length)]; bubbleDiv.style.backgroundColor = color; bubbleDiv.classList.add('bubble'); bubbleDiv.addEventListener('click', () => bubbleClick(color, bubbleDiv)); gameDiv.appendChild(bubbleDiv); bubbles.push(bubbleDiv); } } function bubbleClick(color, bubbleDiv) { const connected = getConnectedBubbles(color); if (connected.length > 1) { score += connected.length; document.getElementById('score').textContent = 'Score: ' + score; connected.forEach(bubble => bubble.style.display = 'none'); checkGameOver(); } } function getConnectedBubbles(color) { return bubbles.filter(bubble => bubble.style.display !== 'none' && bubble.style.backgroundColor === color); } function checkGameOver() { if (!bubbles.some(bubble => bubble.style.display !== 'none')) { alert('Game Over! Your score is: ' + score); } } </script></body></html>
