<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Whimsical Sound Inverter</title><style>body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f8ff; } h1 { color: #ff6347; } button { padding: 10px 20px; font-size: 16px; margin: 10px; background-color: #48d1cc; border: none; border-radius: 5px; cursor: pointer; } button:hover { background-color: #20b2aa; } #output { margin-top: 20px; }</style></head><body><h1>Whimsical Sound Inverter</h1><p>Record your voice and turn it into magical sounds!</p><button id='recordBtn'>Record</button><button id='playBtn'>Play Sound</button><button id='invertBtn'>Invert Sound</button><audio id='audio'></audio><div id='output'></div><script>let mediaRecorder; let audioChunks = []; let audioElement = document.getElementById('audio'); const recordBtn = document.getElementById('recordBtn'); const playBtn = document.getElementById('playBtn'); const invertBtn = document.getElementById('invertBtn'); recordBtn.onclick = async () => { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); mediaRecorder = new MediaRecorder(stream); mediaRecorder.start(); audioChunks = []; mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); }; mediaRecorder.onstop = () => { const audioBlob = new Blob(audioChunks, { type: 'audio/wav' }); const audioUrl = URL.createObjectURL(audioBlob); audioElement.src = audioUrl; localStorage.setItem('audioData', audioUrl); }; setTimeout(() => mediaRecorder.stop(), 3000); }; playBtn.onclick = () => { const audioUrl = localStorage.getItem('audioData'); if (audioUrl) { audioElement.src = audioUrl; audioElement.play(); } else { alert('No audio recorded!'); } }; invertBtn.onclick = () => { const audioUrl = localStorage.getItem('audioData'); if (audioUrl) { const invertedUrl = audioUrl.split('').reverse().join(''); audioElement.src = invertedUrl; audioElement.play(); } else { alert('No audio recorded!'); } }; </script></body></html>
